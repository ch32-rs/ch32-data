name: metapac build

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "*.md"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use nightly Rust
        run: |
          rustup default nightly
          rustup target add riscv32imac-unknown-none-elf
          rustup target add thumbv7m-none-eabi
      - name: Build
        run: |
          ./d gen
      - name: Test
        run: |
          cd build/ch32-metapac/
          cargo build --features pac,metadata,rt,memory-x,ch32v307vct6 --target riscv32imac-unknown-none-elf
          cargo doc --features pac,metadata,rt,memory-x,ch32v307vct6 --target riscv32imac-unknown-none-elf
          cargo build --features pac,metadata,rt,memory-x,ch32x035f7p6 --target riscv32imac-unknown-none-elf
          cargo doc --features pac,metadata,rt,memory-x,ch32x035f7p6 --target riscv32imac-unknown-none-elf
          cargo build --features pac,metadata,rt,memory-x,ch32f103c8t6 --target thumbv7m-none-eabi
          cargo doc --features pac,metadata,rt,memory-x,ch32f103c8t6 --target thumbv7m-none-eabi
          cargo build --features pac,metadata,rt,memory-x,ch32f103c8u6 --target thumbv7m-none-eabi
          cargo doc --features pac,metadata,rt,memory-x,ch32f103c8u6 --target thumbv7m-none-eabi
          cargo build --features pac,metadata,rt,memory-x,ch32f203c6t6 --target thumbv7m-none-eabi
          cargo doc --features pac,metadata,rt,memory-x,ch32f203c6t6 --target thumbv7m-none-eabi
          cargo build --features pac,metadata,rt,memory-x,ch32f203c8t6 --target thumbv7m-none-eabi
          cargo doc --features pac,metadata,rt,memory-x,ch32f203c8t6 --target thumbv7m-none-eabi
          cargo build --features pac,metadata,rt,memory-x,ch32f203c8u6 --target thumbv7m-none-eabi
          cargo doc --features pac,metadata,rt,memory-x,ch32f203c8u6 --target thumbv7m-none-eabi
          cargo build --features pac,metadata,rt,memory-x,ch32f203cbt6 --target thumbv7m-none-eabi
          cargo doc --features pac,metadata,rt,memory-x,ch32f203cbt6 --target thumbv7m-none-eabi
          cargo build --features pac,metadata,rt,memory-x,ch32f203k8t6 --target thumbv7m-none-eabi
          cargo doc --features pac,metadata,rt,memory-x,ch32f203k8t6 --target thumbv7m-none-eabi
          cargo build --features pac,metadata,rt,memory-x,ch32f203rbt6 --target thumbv7m-none-eabi
          cargo doc --features pac,metadata,rt,memory-x,ch32f203rbt6 --target thumbv7m-none-eabi
          cargo build --features pac,metadata,rt,memory-x,ch32f203rct6 --target thumbv7m-none-eabi
          cargo doc --features pac,metadata,rt,memory-x,ch32f203rct6 --target thumbv7m-none-eabi
          cargo build --features pac,metadata,rt,memory-x,ch32f203vct6 --target thumbv7m-none-eabi
          cargo doc --features pac,metadata,rt,memory-x,ch32f203vct6 --target thumbv7m-none-eabi
          cargo build --features pac,metadata,rt,memory-x,ch32f205rbt6 --target thumbv7m-none-eabi
          cargo doc --features pac,metadata,rt,memory-x,ch32f205rbt6 --target thumbv7m-none-eabi
          cargo build --features pac,metadata,rt,memory-x,ch32f207vct6 --target thumbv7m-none-eabi
          cargo doc --features pac,metadata,rt,memory-x,ch32f207vct6 --target thumbv7m-none-eabi
          cargo build --features pac,metadata,rt,memory-x,ch32f208rbt6 --target thumbv7m-none-eabi
          cargo doc --features pac,metadata,rt,memory-x,ch32f208rbt6 --target thumbv7m-none-eabi
          cargo build --features pac,metadata,rt,memory-x,ch32f208wbu6 --target thumbv7m-none-eabi
          cargo doc --features pac,metadata,rt,memory-x,ch32f208wbu6 --target thumbv7m-none-eabi
      - name: Unit tests (host)
        run: |
          cd build/ch32-metapac/
          cargo test --features metadata,ch32v003f4u6
