block/OB:
  description: Option Bytes — persistent flash configuration shared across CH32V2 and CH32V3 chips that do not expose the SRAM/CODE allocation feature (read protection, watchdog mode, low-power reset behavior, user data, four 1-byte write-protection masks). USER bits 3-7 are reserved on these parts; chips that decode RAM_CODE use ob_v2_ram_code or ob_v3_ram_code instead.
  items:
    - name: RDPR
      description: Read protection level.
      byte_offset: 0
      bit_size: 8
      fieldset: RDPR
    - name: NRDPR
      description: Integrity complement of RDPR (auto-computed on write).
      byte_offset: 1
      bit_size: 8
      access: Read
    - name: USER
      description: User configuration (watchdog, stop/standby reset).
      byte_offset: 2
      bit_size: 8
      fieldset: USER
    - name: NUSER
      description: Integrity complement of USER (auto-computed on write).
      byte_offset: 3
      bit_size: 8
      access: Read
    - name: DATA0
      description: Free user data byte 0 (8 bits available for application use).
      byte_offset: 4
      bit_size: 8
    - name: NDATA0
      description: Integrity complement of DATA0 (auto-computed on write).
      byte_offset: 5
      bit_size: 8
      access: Read
    - name: DATA1
      description: Free user data byte 1 (8 bits available for application use).
      byte_offset: 6
      bit_size: 8
    - name: NDATA1
      description: Integrity complement of DATA1 (auto-computed on write).
      byte_offset: 7
      bit_size: 8
      access: Read
    - name: WRPR0
      description: Write protection mask for sectors 0-7 (1 bit per 4K sector; 1 = writable, 0 = protected).
      byte_offset: 8
      bit_size: 8
    - name: NWRPR0
      description: Integrity complement of WRPR0 (auto-computed on write).
      byte_offset: 9
      bit_size: 8
      access: Read
    - name: WRPR1
      description: Write protection mask for sectors 8-15 (1 bit per 4K sector; 1 = writable, 0 = protected).
      byte_offset: 10
      bit_size: 8
    - name: NWRPR1
      description: Integrity complement of WRPR1 (auto-computed on write).
      byte_offset: 11
      bit_size: 8
      access: Read
    - name: WRPR2
      description: Write protection mask for sectors 16-23 (1 bit per 4K sector; 1 = writable, 0 = protected).
      byte_offset: 12
      bit_size: 8
    - name: NWRPR2
      description: Integrity complement of WRPR2 (auto-computed on write).
      byte_offset: 13
      bit_size: 8
      access: Read
    - name: WRPR3
      description: Write protection mask for sectors 24-30 (bits 0-6) and sectors 31-127 (bit 7); 1 = writable, 0 = protected.
      byte_offset: 14
      bit_size: 8
    - name: NWRPR3
      description: Integrity complement of WRPR3 (auto-computed on write).
      byte_offset: 15
      bit_size: 8
      access: Read

fieldset/RDPR:
  description: Read protection byte.
  bit_size: 8
  fields:
    - name: RDPR
      description: Read protection level. Set UNPROTECTED (0xA5) to allow debug reads; any other value blocks the debug interface and auto-write-protects pages 0-15 (4K each).
      bit_offset: 0
      bit_size: 8
      enum: ReadProtection

fieldset/USER:
  description: User configuration byte. Bits 3-7 are reserved and must remain set on chips that do not decode the SRAM/CODE allocation field.
  bit_size: 8
  fields:
    - name: IWDGSW
      description: How the independent watchdog starts.
      bit_offset: 0
      bit_size: 1
      enum: IwdgMode
    - name: STOPRST
      description: Whether entering Stop mode resets the chip.
      bit_offset: 1
      bit_size: 1
      enum: PowerModeReset
    - name: STANDYRST
      description: Whether entering Standby mode resets the chip.
      bit_offset: 2
      bit_size: 1
      enum: PowerModeReset

enum/ReadProtection:
  description: Whether flash contents are readable through the debug interface.
  bit_size: 8
  variants:
    - name: UNPROTECTED
      description: Allow the debug interface to read flash.
      value: 0xA5

enum/IwdgMode:
  description: When the independent watchdog turns on after reset.
  bit_size: 1
  variants:
    - name: HARDWARE
      description: Watchdog starts automatically at power-on.
      value: 0
    - name: SOFTWARE
      description: Watchdog stays off until software enables it.
      value: 1

enum/PowerModeReset:
  description: Whether entering a low-power mode triggers a system reset.
  bit_size: 1
  variants:
    - name: RESET
      description: Reset the chip on entering the mode.
      value: 0
    - name: NO_RESET
      description: Keep running on entering the mode.
      value: 1
