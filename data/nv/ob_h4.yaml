block/OB:
  description: Persistent flash configuration — read protection, watchdog mode, BOOT-mode download enables, write protection, and two free user-data bytes.
  items:
    - name: RDPR
      description: Read protection level.
      byte_offset: 0
      bit_size: 8
      fieldset: RDPR
    - name: NRDPR
      description: Integrity complement of RDPR (managed automatically).
      byte_offset: 1
      bit_size: 8
      access: Read
    - name: USER
      description: User configuration — watchdog mode and BOOT-mode download enables.
      byte_offset: 2
      bit_size: 8
      fieldset: USER
    - name: NUSER
      description: Integrity complement of USER (managed automatically).
      byte_offset: 3
      bit_size: 8
      access: Read
    - name: DATA0
      description: Free user data byte 0.
      byte_offset: 4
      bit_size: 8
    - name: NDATA0
      description: Integrity complement of DATA0 (managed automatically).
      byte_offset: 5
      bit_size: 8
      access: Read
    - name: DATA1
      description: Free user data byte 1.
      byte_offset: 6
      bit_size: 8
    - name: NDATA1
      description: Integrity complement of DATA1 (managed automatically).
      byte_offset: 7
      bit_size: 8
      access: Read
    - name: WRPR0
      description: Write protection for main-flash sectors 0-7. 1 bit per sector — sector is 8K (DBMODE=1) or 4K (DBMODE=0). 1 = writable, 0 = protected.
      byte_offset: 8
      bit_size: 8
    - name: NWRPR0
      description: Integrity complement of WRPR0 (managed automatically).
      byte_offset: 9
      bit_size: 8
      access: Read
    - name: WRPR1
      description: Write protection for main-flash sectors 8-15. 1 bit per sector — sector is 8K (DBMODE=1) or 4K (DBMODE=0). 1 = writable, 0 = protected.
      byte_offset: 10
      bit_size: 8
    - name: NWRPR1
      description: Integrity complement of WRPR1 (managed automatically).
      byte_offset: 11
      bit_size: 8
      access: Read
    - name: WRPR2
      description: Write protection for main-flash sectors 16-23. 1 bit per sector — sector is 8K (DBMODE=1) or 4K (DBMODE=0). 1 = writable, 0 = protected.
      byte_offset: 12
      bit_size: 8
    - name: NWRPR2
      description: Integrity complement of WRPR2 (managed automatically).
      byte_offset: 13
      bit_size: 8
      access: Read
    - name: WRPR3
      description: Write protection — bits 0-6 cover main-flash sectors 24-30 (1 bit per sector); bit 7 covers sectors 31-119 as a group. Sector is 8K (DBMODE=1) or 4K (DBMODE=0). 1 = writable, 0 = protected.
      byte_offset: 14
      bit_size: 8
    - name: NWRPR3
      description: Integrity complement of WRPR3 (managed automatically).
      byte_offset: 15
      bit_size: 8
      access: Read

fieldset/RDPR:
  description: Read protection level.
  bit_size: 8
  fields:
    - name: RDPR
      description: Set UNPROTECTED (0xA5) to allow debug reads. Any other value blocks the debug interface and auto-write-protects pages 0-31 (the first 8K sector) under DBMODE=1, or pages 0-15 (the first 4K sector) under DBMODE=0.
      bit_offset: 0
      bit_size: 8
      enum: ReadProtection

fieldset/USER:
  description: Watchdog mode and BOOT-mode download enables.
  bit_size: 8
  fields:
    - name: IWDGSW
      description: How the independent watchdog starts.
      bit_offset: 0
      bit_size: 1
      enum: IwdgMode
    - name: USBFSDLEN
      description: Whether the on-chip BOOT loader exposes its USB-FS download path.
      bit_offset: 6
      bit_size: 1
      enum: BootDownloadEnable
    - name: USARTDLEN
      description: Whether the on-chip BOOT loader exposes its USART key-free download path.
      bit_offset: 7
      bit_size: 1
      enum: BootDownloadEnable

enum/ReadProtection:
  description: Whether flash contents are readable through the debug interface.
  bit_size: 8
  variants:
    - name: UNPROTECTED
      description: Allow the debug interface to read flash.
      value: 0xA5

enum/IwdgMode:
  description: When the independent watchdog turns on after reset.
  bit_size: 1
  variants:
    - name: HARDWARE
      description: Watchdog starts automatically at power-on, clocked by LSI.
      value: 0
    - name: SOFTWARE
      description: Watchdog stays off until software enables it.
      value: 1

enum/BootDownloadEnable:
  description: Whether a BOOT-mode download path is exposed.
  bit_size: 1
  variants:
    - name: DISABLED
      description: BOOT loader does not expose this download path.
      value: 0
    - name: ENABLED
      description: BOOT loader exposes this download path.
      value: 1
