block/ESIG:
  description: Electronic signature — factory-programmed identifiers, identical across all WCH chips.
  items:
    - name: FLACAP
      description: Flash capacity in KiB.
      byte_offset: 0
      bit_size: 16
      access: Read
    - name: UNIID1
      description: Unique device ID word 1.
      byte_offset: 8
      access: Read
    - name: UNIID2
      description: Unique device ID word 2.
      byte_offset: 12
      access: Read
    - name: UNIID3
      description: Unique device ID word 3.
      byte_offset: 16
      access: Read
