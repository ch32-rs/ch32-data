block/OB:
  description: Persistent flash configuration — read protection, watchdog/boot mode, write protection, and two free user-data bytes.
  items:
    - name: RDPR
      description: Read protection level.
      byte_offset: 0
      bit_size: 8
      fieldset: RDPR
    - name: NRDPR
      description: Integrity complement of RDPR (managed automatically).
      byte_offset: 1
      bit_size: 8
      access: Read
    - name: USER
      description: User configuration — boot mode, reset and download options.
      byte_offset: 2
      bit_size: 8
      fieldset: USER
    - name: NUSER
      description: Integrity complement of USER (managed automatically).
      byte_offset: 3
      bit_size: 8
      access: Read
    - name: DATA0
      description: Free user data byte 0.
      byte_offset: 4
      bit_size: 8
    - name: NDATA0
      description: Integrity complement of DATA0 (managed automatically).
      byte_offset: 5
      bit_size: 8
      access: Read
    - name: DATA1
      description: Free user data byte 1.
      byte_offset: 6
      bit_size: 8
    - name: NDATA1
      description: Integrity complement of DATA1 (managed automatically).
      byte_offset: 7
      bit_size: 8
      access: Read
    - name: WRPR0
      description: Write protection for main-flash sectors 0-7. 1 bit per 4K sector (1 = writable, 0 = protected).
      byte_offset: 8
      bit_size: 8
    - name: NWRPR0
      description: Integrity complement of WRPR0 (managed automatically).
      byte_offset: 9
      bit_size: 8
      access: Read
    - name: WRPR1
      description: Write protection for main-flash sectors 8-15. 1 bit per 4K sector (1 = writable, 0 = protected).
      byte_offset: 10
      bit_size: 8
    - name: NWRPR1
      description: Integrity complement of WRPR1 (managed automatically).
      byte_offset: 11
      bit_size: 8
      access: Read
    - name: WRPR2
      description: Write protection for main-flash sectors 16-23. 1 bit per 4K sector (1 = writable, 0 = protected).
      byte_offset: 12
      bit_size: 8
    - name: NWRPR2
      description: Integrity complement of WRPR2 (managed automatically).
      byte_offset: 13
      bit_size: 8
      access: Read
    - name: WRPR3
      description: Write protection for main-flash sectors 24-31. 1 bit per 4K sector (1 = writable, 0 = protected).
      byte_offset: 14
      bit_size: 8
    - name: NWRPR3
      description: Integrity complement of WRPR3 (managed automatically).
      byte_offset: 15
      bit_size: 8
      access: Read
fieldset/RDPR:
  description: Read protection level.
  fields:
    - name: RDPR
      description: 0xA5 (with NRDPR 0x5A) disables read protection.
      bit_offset: 0
      bit_size: 8
fieldset/USER:
  description: User configuration byte.
  fields:
    - name: IWDGSW
      description: IWDG software enable (1 = software start only).
      bit_offset: 0
      bit_size: 1
    - name: CFGRSTEN
      description: External reset pin enable (1 = disabled).
      bit_offset: 3
      bit_size: 1
    - name: START_MD
      description: Boot mode (1 = boot from the system flash when BOOT is present).
      bit_offset: 4
      bit_size: 1
    - name: USBHSDLEN
      description: Enable USBHS download in the bootloader.
      bit_offset: 6
      bit_size: 1
    - name: USARTDLEN
      description: Enable USART keyless download in the bootloader.
      bit_offset: 7
      bit_size: 1
