# CH32V407 / CH32V467 alternate function I/O (CH32V407RM §8).
#
# Derived from afio_v3.yaml: same ECR / EXTICR layout, with the PCFR1 and PCFR2
# remap bits of this family. PCFR1 drops the Ethernet PHY, CAN2 and MII select
# bits and renames I2C1_RM/PD01_RM; PCFR2 swaps the TIM9/TIM10 remaps for the
# FSMC/LTDC/SDIO/DVP/I3C and USART9/10 remaps.

block/AFIO:
  description: Alternate function I/O.
  items:
    - name: ECR
      description: Event Control Register (AFIO_ECR).
      byte_offset: 0
      fieldset: ECR
    - name: PCFR1
      description: AF remap and debug I/O configuration register (AFIO_PCFR1).
      byte_offset: 4
      fieldset: PCFR1
    - name: PCFR2
      description: AF remap and debug I/O configuration register (AFIO_PCFR2).
      byte_offset: 28
      fieldset: PCFR2
    - name: EXTICR
      description: External interrupt configuration registers (AFIO_EXTICRs).
      array:
        len: 4
        stride: 4
      byte_offset: 8
      fieldset: EXTICR
fieldset/ECR:
  description: Event Control Register (AFIO_ECR).
  fields:
    - name: PIN
      description: Pin selection.
      bit_offset: 0
      bit_size: 4
    - name: PORT
      description: Port selection.
      bit_offset: 4
      bit_size: 3
    - name: EVOE
      description: Event Output Enable.
      bit_offset: 7
      bit_size: 1
fieldset/EXTICR:
  description: External interrupt configuration register (AFIO_EXTICRx).
  fields:
    - name: EXTI
      description: EXTI configuration.
      bit_offset: 0
      bit_size: 4
      array:
        len: 4
        stride: 4
fieldset/PCFR1:
  description: AF remap and debug I/O configuration register (AFIO_PCFR1).
  fields:
    - name: SPI1_RM
      description: SPI1 remapping.
      bit_offset: 0
      bit_size: 1
    - name: I2C_RM
      description: I2C remapping.
      bit_offset: 1
      bit_size: 1
    - name: USART1_RM
      description: USART1 remapping.
      bit_offset: 2
      bit_size: 1
    - name: USART2_RM
      description: USART2 remapping.
      bit_offset: 3
      bit_size: 1
    - name: USART3_RM
      description: USART3 remapping.
      bit_offset: 4
      bit_size: 2
    - name: TIM1_RM
      description: TIM1 remapping.
      bit_offset: 6
      bit_size: 2
    - name: TIM2_RM
      description: TIM2 remapping.
      bit_offset: 8
      bit_size: 2
    - name: TIM3_RM
      description: TIM3 remapping.
      bit_offset: 10
      bit_size: 2
    - name: TIM4_RM
      description: TIM4 remapping.
      bit_offset: 12
      bit_size: 1
    - name: CAN1_RM
      description: CAN1 remapping.
      bit_offset: 13
      bit_size: 2
    - name: PD0PD1_RM
      description: Port D0/Port D1 mapping on OSCIN/OSCOUT.
      bit_offset: 15
      bit_size: 1
    - name: TIM5CH4_RM
      description: TIM5 channel4 internal remap.
      bit_offset: 16
      bit_size: 1
    - name: ADC1_ETRGINJ_RM
      description: ADC 1 External trigger injected conversion remapping.
      bit_offset: 17
      bit_size: 1
    - name: ADC1_ETRGREG_RM
      description: ADC 1 external trigger regular conversion remapping.
      bit_offset: 18
      bit_size: 1
    - name: ADC2_ETRGINJ_RM
      description: ADC 2 External trigger injected conversion remapping.
      bit_offset: 19
      bit_size: 1
    - name: ADC2_ETRGREG_RM
      description: ADC 2 external trigger regular conversion remapping.
      bit_offset: 20
      bit_size: 1
    - name: SW_CFG
      description: Serial wire JTAG configuration.
      bit_offset: 24
      bit_size: 3
    - name: SPI3_RM
      description: SPI3 remapping.
      bit_offset: 28
      bit_size: 1
    - name: TIM2ITR1_RM
      description: TIM2 internally triggers 1 remapping.
      bit_offset: 29
      bit_size: 1
    - name: PTP_PPS_RM
      description: Ethernet PTP_PPS remapping.
      bit_offset: 30
      bit_size: 1
    - name: ETHPHY_LED_RM
      description: ETH PHY LED remapping.
      bit_offset: 31
      bit_size: 1
