  fields:
  - name: HTBAP
    description: Host transmit buffer address pointer
    bit_offset: 0
    bit_size: 32

fieldset/DMACHRBAR:
  description: Ethernet DMA current host receive buffer address register
  fields:
  - name: HRBAP
    description: Host receive buffer address pointer
    bit_offset: 0
    bit_size: 32
