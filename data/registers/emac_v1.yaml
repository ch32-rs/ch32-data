    bit_size: 1
  - name: TPSIE
    description: Transmit process stopped interrupt enable
    bit_offset: 1
    bit_size: 1
  - name: TBUIE
    description: Transmit buffer unavailable interrupt enable
    bit_offset: 2
    bit_size: 1
  - name: TJTIE
    description: Transmit jabber timeout interrupt enable
    bit_offset: 3
    bit_size: 1
  - name: ROIE
