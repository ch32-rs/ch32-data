# CH32V407RM V1.2 section 9.4.5. Derived from pfic_rv4, not pfic_h4:
# one core, 104 interrupt status bits, 256 priority bytes, and five event/core
# registers. Field access is documented where the IR cannot encode mixed access.
# IACTR is read-only status (9.4.5.33..35); .36 prints WO inconsistently.

