block/SYSTICK:
  description: Systick registers for the CH32H4 dual-core SysTick. Two independent 32-bit counters, indexed by hart, and one status register shared by both.
  items:
  - name: CTLR
    description: System count control register.
    byte_offset: 0
    array:
      len: 2
      stride: 128
    fieldset: CTLR
  - name: SR
    description: System counter interrupt status register. Shared by both counters.
    byte_offset: 4
    fieldset: SR
  - name: CNT
    description: System counter count register.
    byte_offset: 8
    bit_size: 32
    array:
      len: 2
      stride: 128
  - name: CMP
    description: System count compare register.
    byte_offset: 16
    bit_size: 32
    array:
      len: 2
      stride: 128
fieldset/CTLR:
  description: System count control register.
  fields:
  - name: STE
    description: Counter enable.
    bit_offset: 0
    bit_size: 1
  - name: STIE
    description: Counter interrupt enable.
    bit_offset: 1
    bit_size: 1
  - name: STCLK
    description: Counter clock source. Both counters are clocked from the V3F HCLK domain.
    bit_offset: 2
    bit_size: 1
    enum: STCLK
  - name: STRE
    description: Auto reload enable. Leave clear for a free-running counter.
    bit_offset: 3
    bit_size: 1
  - name: MODE
    description: Count mode.
    bit_offset: 4
    bit_size: 1
    enum: MODE
  - name: CID
    description: Hart the counter interrupt is routed to. Updated to the operating hart when STE is set.
    bit_offset: 6
    bit_size: 1
fieldset/SR:
  description: System counter interrupt status register (shared).
  fields:
  - name: CNTIF0
    description: Counter 0 compare flag.
    bit_offset: 0
    bit_size: 1
  - name: CNTIF1
    description: Counter 1 compare flag.
    bit_offset: 1
    bit_size: 1
enum/MODE:
  bit_size: 1
  variants:
  - name: Upcount
    description: Upcount.
    value: 0
  - name: Downcount
    description: Downcount.
    value: 1
enum/STCLK:
  bit_size: 1
  variants:
  - name: HCLK_DIV8
    description: V3F HCLK/8.
    value: 0
  - name: HCLK
    description: V3F HCLK.
    value: 1
