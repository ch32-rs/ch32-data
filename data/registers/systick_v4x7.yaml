# CH32V407RM V1.2 section 9.3, table 9-4.
# SWIE is in SR, unlike rv4. CNT/CMP and the high-word views are project
# register extensions retained alongside the manual's low-word registers.
# CMPL retains the existing API spelling of the manual's STK_CMPLR register.

block/SYSTICK:
  description: CH32V407/CH32V467 system counter with 32-bit and 64-bit access views.
  items:
  - name: CTLR
    description: System count control register.
    byte_offset: 0
    fieldset: CTLR
  - name: SR
    description: System count status register.
    byte_offset: 4
    fieldset: SR
  - name: CNTL
    description: 32-bit system counter value (STK_CNTL).
    byte_offset: 8
  - name: CNTH
    description: System counter high word (project register extension).
    byte_offset: 12
  - name: CNT
    description: 64-bit system counter view (project register extension).
    byte_offset: 8
    bit_size: 64
  - name: CMP
    description: 64-bit compare value view (project register extension).
    byte_offset: 16
    bit_size: 64
  - name: CMPL
    description: 32-bit compare value (STK_CMPLR).
    byte_offset: 16
  - name: CMPH
    description: Compare value high word (project register extension).
    byte_offset: 20
fieldset/CTLR:
  description: System count control register.
  fields:
  - name: STE
    description: Counter enable control bit.
    bit_offset: 0
    bit_size: 1
  - name: STIE
    description: Counter interrupt enable control bit.
    bit_offset: 1
    bit_size: 1
  - name: STCLK
    description: System counter clock source.
    bit_offset: 2
    bit_size: 1
    enum: STCLK
  - name: STRE
    description: Auto reload count enable bit.
    bit_offset: 3
    bit_size: 1
  - name: MODE
    description: Counter mode.
    bit_offset: 4
    bit_size: 1
    enum: MODE
  - name: INIT
    description: Counter initial value update.
    bit_offset: 5
    bit_size: 1
fieldset/SR:
  description: System count status register.
  fields:
  - name: CNTIF
    description: Compare flag. Write 0 to clear; writing 1 has no effect.
    bit_offset: 0
    bit_size: 1
  - name: SWIE
    description: Software interrupt request. Set to trigger; clear in the software interrupt handler.
    bit_offset: 31
    bit_size: 1
enum/MODE:
  bit_size: 1
  variants:
  - name: Upcount
    description: Upcount.
    value: 0
  - name: Downcount
    description: Downcount.
    value: 1
enum/STCLK:
  bit_size: 1
  variants:
  - name: HCLK_DIV8
    description: HCLK/8.
    value: 0
  - name: HCLK
    description: HCLK.
    value: 1
