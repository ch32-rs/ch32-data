fieldset/SFR_BIT_CONFIG:
  description: Coded bit configuration registers.
  fields:
  - name: SB_BIT_CYC_CNT3
    description: The periodic timing state of the encoded bits.
    bit_offset: 0
    bit_size: 1
  - name: SB_BIT_CYC_CNT4
    description: The periodic timing state of the encoded bits.
    bit_offset: 1
    bit_size: 1
  - name: SB_BIT_CYC_CNT5
    description: The periodic timing state of the encoded bits.
    bit_offset: 2
    bit_size: 1
  - name: SB_BIT_CYC_CNT6
    description: The periodic timing state of the encoded bits.
    bit_offset: 3
    bit_size: 1
  - name: SB_BIT_CYC_TAIL
    description: Periodic state of the encoded bits.
    bit_offset: 4
    bit_size: 1
  - name: SB_PORT_IN_EDGE
    description: Pin input level sampling point selection.
    bit_offset: 5
    bit_size: 1
  - name: SB_BIT_CODE_MOD
    description: How the coded bits are modulated.
    bit_offset: 6
    bit_size: 1
  - name: SB_BIT_TX_EN
    description: The transmission of the coded bits is enabled.
    bit_offset: 7
    bit_size: 1
fieldset/SFR_BIT_CYCLE:
  description: Periodic registers for coded bits.
  fields:
  - name: SB_BIT_CYCLE
    description: Sets the width of the encoded bits in clock cycles, which is the actual number of bits minus 1.
    bit_offset: 0
    bit_size: 7
  - name: SB_BIT_TX_O0
    description: The raw bit data of the encoded bit to be sent, which is a double-buffered structure.
    bit_offset: 7
    bit_size: 1
fieldset/SFR_PORT_DIR:
  description: The port direction sets the register.
  fields:
  - name: SB_PORT_DIR0
    description: IO0 Pin Direction Control.
    bit_offset: 0
    bit_size: 1
  - name: SB_PORT_DIR1
    description: IO1 Pin Direction Control.
    bit_offset: 1
    bit_size: 1
  - name: SB_PORT_PU0
    description: IO0 Pin Pull-Up Enables.
    bit_offset: 2
    bit_size: 1
  - name: SB_PORT_PU1
    description: IO1 Pin Pull-Up Enables.
    bit_offset: 3
    bit_size: 1
  - name: SB_PORT_MOD0
    description: Pin mode control, host side defines the purpose.
    bit_offset: 4
    bit_size: 1
  - name: SB_PORT_MOD1
    description: Pin mode control, host side defines the purpose.
    bit_offset: 5
    bit_size: 1
  - name: SB_PORT_MOD2
    description: Pin mode control, host side defines the purpose.
    bit_offset: 6
    bit_size: 1
  - name: SB_PORT_MOD3
    description: Pin mode control, host side defines the purpose.
    bit_offset: 7
    bit_size: 1
fieldset/SFR_STATUS_REG:
  description: Status registers.
  fields:
  - name: SB_FLAG_C
    description: ALU carry flag, whether the result is carried or produced by displacement.
    bit_offset: 0
    bit_size: 1
  - name: SB_GP_BIT_X
    description: A generic bit variable X, defined and used by the application.
    bit_offset: 1
    bit_size: 1
  - name: SB_FLAG_Z
    description: ALU zero flag, whether the result is 00H.
    bit_offset: 2
    bit_size: 1
  - name: SB_GP_BIT_Y
    description: a generic bit variable Y, defined and used by the application.
    bit_offset: 3
    bit_size: 1
  - name: SB_EN_TOUT_RST
    description: Timer Timeout Reset Enabled.
    bit_offset: 4
    bit_size: 1
  - name: SB_STACK_USED
    description: Current stack usage flags.
    bit_offset: 5
    bit_size: 1
fieldset/SFR_SYS_CFG:
  description: System configuration registers.
  fields:
  - name: SB_MST_CLK_GATE
    description: Global Clock Control for eMCUs.
    bit_offset: 0
    bit_size: 1
  - name: SB_MST_RESET
    description: Force eMCU Reset.
    bit_offset: 1
    bit_size: 1
  - name: SB_MST_IO_EN0
    description: Mode and output control switches for IO0 pins.
    bit_offset: 2
    bit_size: 1
  - name: SB_MST_IO_EN1
    description: Mode and output control switches for IO1 pins.
    bit_offset: 3
    bit_size: 1
  - name: SB_MST_CFG_B4
    description: Configure information bits, software-defined uses.
    bit_offset: 4
    bit_size: 1
  - name: SB_DATA_MW_SR
    description: SFR_CTRL_WR waiting to read the status bit.
    bit_offset: 5
    bit_size: 1
  - name: SB_DATA_SW_MR
    description: SFR_CTRL_RD wait to read the status bit.
    bit_offset: 6
    bit_size: 1
  - name: SB_INT_REQ
    description: Interrupt Request Activation Bits.
    bit_offset: 7
    bit_size: 1
