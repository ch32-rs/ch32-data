block/FLASH:
  description: FLASH.
  items:
    - name: ACTLR
      description: Flash access control register.
      byte_offset: 0
      fieldset: ACTLR
    - name: KEYR
      description: Flash key register.
      byte_offset: 4
      access: Write
      fieldset: KEYR
    - name: OBKEYR
      description: Flash option key register.
      byte_offset: 8
      access: Write
      fieldset: OBKEYR
    - name: STATR
      description: Status register.
      byte_offset: 12
      fieldset: STATR
    - name: CTLR
      description: Control register.
      byte_offset: 16
      fieldset: CTLR
    - name: ADDR
      description: Flash address register.
      byte_offset: 20
      access: Write
      fieldset: ADDR
    - name: OBR
      description: Option byte register.
      byte_offset: 28
      access: Read
      fieldset: OBR
    - name: WPR
      description: Write protection register.
      byte_offset: 32
      access: Read
      fieldset: WPR
    - name: MODEKEYR
      description: Extension key register.
      byte_offset: 36
      access: Write
      fieldset: MODEKEYR
fieldset/ACTLR:
  description: Flash access control register.
  fields:
    - name: LATENCY
      description: Latency.
      bit_offset: 0
      bit_size: 3
    - name: PRFTBE
      description: Prefetch buffer enable.
      bit_offset: 4
      bit_size: 1
    - name: PRFTBS
      description: Prefetch buffer status.
      bit_offset: 5
      bit_size: 1
fieldset/ADDR:
  description: Flash address register.
  fields:
    - name: FAR
      description: Flash Address.
      bit_offset: 0
      bit_size: 32
fieldset/CTLR:
  description: Control register.
  fields:
    - name: PG
      description: Programming.
      bit_offset: 0
      bit_size: 1
    - name: PER
      description: Page Erase.
      bit_offset: 1
      bit_size: 1
    - name: MER
      description: Mass Erase.
      bit_offset: 2
      bit_size: 1
    - name: OBPG
      description: Option byte programming.
      bit_offset: 4
      bit_size: 1
    - name: OBER
      description: Option byte erase.
      bit_offset: 5
      bit_size: 1
    - name: STRT
      description: Start.
      bit_offset: 6
      bit_size: 1
    - name: LOCK
      description: Lock.
      bit_offset: 7
      bit_size: 1
    - name: OBWRE
      description: Option bytes write enable.
      bit_offset: 9
      bit_size: 1
    - name: ERRIE
      description: Error interrupt enable.
      bit_offset: 10
      bit_size: 1
    - name: EOPIE
      description: End of operation interrupt enable.
      bit_offset: 12
      bit_size: 1
    - name: FLOCK
      description: FAST programming lock.
      bit_offset: 15
      bit_size: 1
    - name: FTPG
      description: execute fast programming.
      bit_offset: 16
      bit_size: 1
    - name: FTER
      description: execute fast 128byte erase.
      bit_offset: 17
      bit_size: 1
    - name: BUFLOAD
      description: execute data load inner buffer.
      bit_offset: 18
      bit_size: 1
    - name: BUFRST
      description: execute inner buffer reset.
      bit_offset: 19
      bit_size: 1
fieldset/KEYR:
  description: Flash key register.
  fields:
    - name: KEYR
      description: FPEC key.
      bit_offset: 0
      bit_size: 32
fieldset/MODEKEYR:
  description: Extension key register.
  fields:
    - name: MODEKEYR
      description: high speed write /erase mode ENABLE.
      bit_offset: 0
      bit_size: 32
fieldset/OBKEYR:
  description: Flash option key register.
  fields:
    - name: OBKEYR
      description: Option byte key.
      bit_offset: 0
      bit_size: 32
fieldset/OBR:
  description: Option byte register — read-only mirror of the Option Bytes loaded from flash at reset.
  fields:
    - name: OPTERR
      description: Option byte integrity error — a value/complement pair did not match when loading.
      bit_offset: 0
      bit_size: 1
    - name: RDPRT
      description: Read protection is currently active.
      bit_offset: 1
      bit_size: 1
    - name: IWDG_SW
      description: Independent watchdog start mode currently in effect.
      bit_offset: 2
      bit_size: 1
      enum: IwdgMode
    - name: nRST_STOP
      description: Stop-mode reset behavior currently in effect.
      bit_offset: 3
      bit_size: 1
      enum: PowerModeReset
    - name: nRST_STDBY
      description: Standby-mode reset behavior currently in effect.
      bit_offset: 4
      bit_size: 1
      enum: PowerModeReset
    - name: USBD_MODE
      description: USBD bus speed mode currently in effect.
      bit_offset: 5
      bit_size: 1
      enum: UsbdSpeed
    - name: USBD_PU
      description: USBD built-in 1.5 kΩ pull-up resistor state currently in effect.
      bit_offset: 6
      bit_size: 1
      enum: UsbdPullup
    - name: POR_CTR
      description: Power-on reset timing window currently in effect.
      bit_offset: 7
      bit_size: 1
      enum: PowerOnResetTime
    - name: Data0
      description: Free user data byte 0 (mirror of OB.DATA0).
      bit_offset: 10
      bit_size: 8
    - name: Data1
      description: Free user data byte 1 (mirror of OB.DATA1).
      bit_offset: 18
      bit_size: 8
fieldset/STATR:
  description: Status register.
  fields:
    - name: BSY
      description: Busy.
      bit_offset: 0
      bit_size: 1
    - name: PGERR
      description: Programming error.
      bit_offset: 2
      bit_size: 1
    - name: WRPRTERR
      description: Write protection error.
      bit_offset: 4
      bit_size: 1
    - name: EOP
      description: End of operation.
      bit_offset: 5
      bit_size: 1
fieldset/WPR:
  description: Write protection register.
  fields:
    - name: WRP
      description: Write protect.
      bit_offset: 0
      bit_size: 32
enum/IwdgMode:
  description: When the independent watchdog turns on after reset.
  bit_size: 1
  variants:
    - name: HARDWARE
      description: Watchdog starts automatically at power-on.
      value: 0
    - name: SOFTWARE
      description: Watchdog stays off until software enables it.
      value: 1
enum/PowerModeReset:
  description: Whether entering a low-power mode triggers a system reset.
  bit_size: 1
  variants:
    - name: RESET
      description: Reset the chip on entering the mode.
      value: 0
    - name: NO_RESET
      description: Keep running on entering the mode.
      value: 1
enum/UsbdSpeed:
  description: USBD bus speed mode loaded from Option Bytes at startup.
  bit_size: 1
  variants:
    - name: FULL_SPEED
      description: USB full-speed mode (12 Mbps).
      value: 0
    - name: LOW_SPEED
      description: USB low-speed mode (1.5 Mbps).
      value: 1
enum/UsbdPullup:
  description: USBD built-in 1.5 kΩ pull-up resistor state loaded from Option Bytes at startup.
  bit_size: 1
  variants:
    - name: DISABLED
      description: Built-in pull-up disabled — an external pull-up is required on the USB data line.
      value: 0
    - name: ENABLED
      description: Built-in pull-up enabled — no external pull-up needed.
      value: 1
enum/PowerOnResetTime:
  description: Length of the power-on reset window.
  bit_size: 1
  variants:
    - name: LONG
      description: 40.96 ms power-on reset window.
      value: 0
    - name: SHORT
      description: 16.384 ms power-on reset window.
      value: 1
