  - name: PPRE2
    description: PB2 (high-speed APB) prescaler, also feeds ADC prescaler.
    bit_offset: 11
    bit_size: 3
    enum: PPRE
  - name: ADCPRE
    description: ADC prescaler (divides PB2 clock).
    bit_offset: 14
    bit_size: 2
