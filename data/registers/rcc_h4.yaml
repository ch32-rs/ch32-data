    description: calibrate the clock output selection.
    bit_offset: 3
    bit_size: 1
  - name: ASOE
    description: TAMPER pin enables pulse output.
    bit_offset: 4
    bit_size: 1
  - name: ASOS
    description: TAMPER pin alarm/second pulse output.
    bit_offset: 5
    bit_size: 1
