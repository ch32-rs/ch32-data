# CH32V407 / CH32V467 Ethernet controller (CH32V407RM §29).
#
# Derived from emac_v1.yaml — the MAC and DMA register blocks are identical
# to the CH32V307 one. Added here, all from the RM register tables:
#   * PHY_CR at 0x080, control for the integrated 10/100M PHY
#     (PHY_RSTN / PHY_PD must both be released before use);
#   * the MMC statistics block at 0x100;
#   * the IEEE 1588 timestamp block at 0x700.
#
# The RM places the MAC at 0x40028000 (DMA at +0x1000), not at the
# 0x40406000 the vendor file declares.

block/ETH:
  description: 'Ethernet MAC, integrated PHY, MMC and IEEE 1588.'
  items:
    - name: MACCR
      description: Ethernet MAC configuration register
      byte_offset: 0
      fieldset: MACCR
