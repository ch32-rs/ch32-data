block/CAN:
  description: Controller area network (bxCAN-compatible). 3 TX mailboxes + 2 RX FIFOs + 42 filter banks shared across CAN1/CAN2/CAN3 instances.
  items:
  - name: CTLR
    description: CAN master control register.
    byte_offset: 0
    fieldset: CTLR
  - name: STATR
    description: CAN master status register.
    byte_offset: 4
    fieldset: STATR
  - name: TSTATR
    description: CAN transmit status register.
    byte_offset: 8
    fieldset: TSTATR
  - name: RFIFO
    description: CAN receive FIFO register (RX FIFO 0 / 1).
    array:
      len: 2
      stride: 4
    byte_offset: 12
    fieldset: RFIFO
  - name: INTENR
    description: CAN interrupt enable register.
    byte_offset: 20
    fieldset: INTENR
  - name: ERRSR
    description: CAN error status register.
    byte_offset: 24
    fieldset: ERRSR
  - name: BTIMR
    description: CAN bit timing register.
    byte_offset: 28
    fieldset: BTIMR
  - name: TTCTLR
    description: CAN time-trigger control register.
    byte_offset: 32
    fieldset: TTCTLR
  - name: TTCNT
    description: CAN time-trigger counter value.
    byte_offset: 36
    bit_size: 16
  - name: TERR_CNT
    description: CAN error counter register.
    byte_offset: 40
    fieldset: TERR_CNT
  - name: TX
    description: 'CAN TX mailbox cluster: TXMIR/TXMDTR/TXMDLR/TXMDHR per mailbox, 3 mailboxes.'
    array:
      len: 3
      stride: 16
    byte_offset: 384
    block: TX
  - name: RX
    description: 'CAN RX FIFO mailbox cluster: RXMIR/RXMDTR/RXMDLR/RXMDHR per FIFO, 2 FIFOs.'
    array:
      len: 2
      stride: 16
    byte_offset: 432
    block: RX
  - name: FCTLR
    description: Filter master register.
    byte_offset: 512
    fieldset: FCTLR
  - name: FMCFGR
    description: Filter mode configuration (banks owned by CAN1/CAN2).
    byte_offset: 516
    fieldset: FMCFGR
  - name: FMCFGR_CAN3
    description: Filter mode configuration (banks owned by CAN3).
    byte_offset: 520
    fieldset: FMCFGR_CAN3
  - name: FSCFGR
    description: Filter scale configuration (banks owned by CAN1/CAN2).
    byte_offset: 524
    fieldset: FSCFGR
  - name: FSCFGR_CAN3
    description: Filter scale configuration (banks owned by CAN3).
    byte_offset: 528
    fieldset: FSCFGR_CAN3
  - name: FAFIFOR
    description: Filter assignment to FIFO (banks owned by CAN1/CAN2).
    byte_offset: 532
    fieldset: FAFIFOR
  - name: FAFIFOR_CAN3
    description: Filter assignment to FIFO (banks owned by CAN3).
    byte_offset: 536
    fieldset: FAFIFOR_CAN3
  - name: FWR
    description: Filter activation (banks owned by CAN1/CAN2).
    byte_offset: 540
    fieldset: FWR
  - name: FWR_CAN3
    description: Filter activation (banks owned by CAN3).
    byte_offset: 544
    fieldset: FWR_CAN3
  - name: FB
    description: 'Filter bank: FR1 + FR2 per bank, 42 banks shared by CAN1/CAN2/CAN3.'
    array:
      len: 42
      stride: 8
    byte_offset: 576
    block: FB
block/FB:
  description: Filter bank (two 32-bit registers; layout depends on FSCFGR.FSC bit for this bank).
  items:
  - name: FR1
    description: Filter bank register 1.
    byte_offset: 0
    fieldset: FR1
  - name: FR2
    description: Filter bank register 2.
    byte_offset: 4
    fieldset: FR2
block/RX:
  description: CAN RX FIFO mailbox (read-only; identifier / data length+timestamp / data low / data high).
  items:
  - name: RXMIR
    description: RX FIFO mailbox identifier register.
    byte_offset: 0
    access: Read
    fieldset: RXMIR
  - name: RXMDTR
    description: RX FIFO mailbox data length control and timestamp register.
    byte_offset: 4
    access: Read
    fieldset: RXMDTR
  - name: RXMDLR
    description: RX FIFO mailbox data low register.
    byte_offset: 8
    access: Read
    fieldset: RXMDLR
  - name: RXMDHR
    description: RX FIFO mailbox data high register.
    byte_offset: 12
    access: Read
    fieldset: RXMDHR
block/TX:
  description: CAN TX mailbox (identifier / data length+timestamp / data low / data high).
  items:
  - name: TXMIR
    description: TX mailbox identifier register.
    byte_offset: 0
    fieldset: TXMIR
  - name: TXMDTR
    description: TX mailbox data length control and timestamp register.
    byte_offset: 4
    fieldset: TXMDTR
  - name: TXMDLR
    description: TX mailbox data low register.
    byte_offset: 8
    fieldset: TXMDLR
  - name: TXMDHR
    description: TX mailbox data high register.
    byte_offset: 12
    fieldset: TXMDHR
fieldset/BTIMR:
  description: CAN bit timing register.
  fields:
  - name: BRP
    description: minimum time unit length setting value.
    bit_offset: 0
    bit_size: 10
  - name: BTR_TS1_T
    description: CLAS_LONG_TS1=0;TS1 is TS[3:0](4bit);CLAS_LONG_TS1=1,TS1 is.  TS[1:0]+BTR_TS1_T[15:12](6bit).
    bit_offset: 12
    bit_size: 4
  - name: TS1
    description: Time segment 1.
    bit_offset: 16
    bit_size: 4
  - name: TS2
    description: Time segment 2.
    bit_offset: 20
    bit_size: 4
  - name: SJW
    description: Resynchronization jump width.
    bit_offset: 24
    bit_size: 4
  - name: LBKM
    description: Loop back mode (debug).
    bit_offset: 30
    bit_size: 1
  - name: SILM
    description: Silent mode (debug).
    bit_offset: 31
    bit_size: 1
fieldset/CTLR:
  description: CAN Master control register.
  fields:
  - name: INRQ
    description: Initialization request.
    bit_offset: 0
    bit_size: 1
  - name: SLEEP
    description: Sleep mode request bit.
    bit_offset: 1
    bit_size: 1
  - name: TXFP
    description: Transmit FIFO priority.
    bit_offset: 2
    bit_size: 1
  - name: RFLM
    description: Receive FIFO locked mode.
    bit_offset: 3
    bit_size: 1
  - name: NART
    description: No automatic retransmission.
    bit_offset: 4
    bit_size: 1
  - name: AWUM
    description: Automatic wakeup mode.
    bit_offset: 5
    bit_size: 1
  - name: ABOM
    description: Automatic bus-off management.
    bit_offset: 6
    bit_size: 1
  - name: TTCM
    description: Time triggered communication mode.
    bit_offset: 7
    bit_size: 1
  - name: RST
    description: Software master reset.
    bit_offset: 15
    bit_size: 1
  - name: DBF
    description: Debug freeze.
    bit_offset: 16
    bit_size: 1
  - name: CFGCANM
    description: Configure CAN offline recovery time.
    bit_offset: 17
    bit_size: 1
fieldset/ERRSR:
  description: CAN error status register.
  fields:
  - name: EWGF
    description: Error warning flag.
    bit_offset: 0
    bit_size: 1
  - name: EPVF
    description: Error passive flag.
