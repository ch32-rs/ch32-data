# CH32H417 CAN controller (CH32H417RM §28).
#
# Three identical bxCAN nodes (CAN1/CAN2/CAN3) at 0x40006400, 0x40006800 and
# 0x40007800. The shared filter table lives in CAN1 only: its registers start
# at 0x40006600 and RM table 28-12 marks every entry x=1. CAN2/CAN3 have no
# filter registers of their own, and RM §28.2.1 note says the filter table is
# clocked from CAN1, so CAN1EN must be on before any node uses filters.
#
# Differs from can_v4x7.yaml, which this file is derived from:
#
#   * 42 filter banks instead of 14. Banks 0..27 are configured through
#     FMCFGR/FSCFGR/FAFIFOR/FWR, banks 28..41 through the *1 variants at
#     0x208/0x210/0x218/0x220 (RM §28.7.20-28.7.28);
#   * FCTLR gains CAN2SB[12:8] and CAN3SB[21:16], the start bank of CAN2 and
#     CAN3 (reset values 14 and 28);
#   * CTLR gains CFGCANM (bit 17);
#   * RXMDTR exposes the received-frame BRS/ESI/RES bits; there is no CAN FD
#     transmit path, so the driver ignores them;
#   * the 42 banks are one FR array of 84 words (0x240..0x38F), F<i>R1 at
#     2*i and F<i>R2 at 2*i+1.

block/CAN:
  description: Controller area network (bxCAN). Filter registers are only mapped on CAN1.
  items:
    - name: CTLR
      description: CAN master control register.
      byte_offset: 0
      fieldset: CTLR
    - name: STATR
      description: CAN master status register.
      byte_offset: 4
      fieldset: STATR
    - name: TSTATR
      description: CAN transmit status register.
      byte_offset: 8
      fieldset: TSTATR
    - name: RFIFO
      description: CAN receive FIFO register.
      array:
        len: 2
        stride: 4
      byte_offset: 12
      fieldset: RFIFO
    - name: INTENR
      description: CAN interrupt enable register.
      byte_offset: 20
      fieldset: INTENR
    - name: ERRSR
      description: CAN error status register.
      byte_offset: 24
      fieldset: ERRSR
    - name: BTIMR
      description: CAN bit timing register.
      byte_offset: 28
      fieldset: BTIMR
    - name: TTCTLR
      description: CAN time trigger control register.
      byte_offset: 32
      fieldset: TTCTLR
    - name: TTCNT
      description: CAN time trigger count value register.
      byte_offset: 36
      bit_size: 16
    - name: TERR_CNT
      description: CAN offline recovery error counter.
      byte_offset: 40
      fieldset: TERR_CNT
    # mailbox related
    - name: TXMIR
      description: CAN TX mailbox identifier register.
      array:
        len: 3
        stride: 16
      byte_offset: 384
      fieldset: TXMIR
    - name: TXMDTR
      description: CAN mailbox data length control and time stamp register.
      array:
        len: 3
        stride: 16
      byte_offset: 388
      fieldset: TXMDTR
    - name: TXMDLR
      description: CAN mailbox data low register.
      array:
        len: 3
        stride: 16
      byte_offset: 392
      fieldset: TXMDLR
    - name: TXMDHR
      description: CAN mailbox data high register.
      array:
        len: 3
        stride: 16
      byte_offset: 396
      fieldset: TXMDHR
    - name: RXMIR
      description: CAN receive FIFO mailbox identifier register.
      array:
        len: 2
        stride: 16
      byte_offset: 432
      access: Read
      fieldset: RXMIR
    - name: RXMDTR
      description: CAN receive FIFO mailbox data length control and time stamp register.
      array:
        len: 2
        stride: 16
      byte_offset: 436
      access: Read
      fieldset: RXMDTR
    - name: RXMDLR
      description: CAN receive FIFO mailbox data low register.
      array:
        len: 2
        stride: 16
      byte_offset: 440
      access: Read
      fieldset: RXMDLR
    - name: RXMDHR
      description: CAN receive FIFO mailbox data high register.
      array:
        len: 2
        stride: 16
      byte_offset: 444
      access: Read
      fieldset: RXMDHR
    # filter table (CAN1 only)
    - name: FCTLR
      description: CAN filter master register.
      byte_offset: 512
      fieldset: FCTLR
    - name: FMCFGR
      description: CAN filter mode register (banks 0..27).
      byte_offset: 516
      fieldset: FMCFGR
    - name: FMCFGR1
      description: CAN filter mode register 1 (banks 28..41).
      byte_offset: 520
      fieldset: FMCFGR1
    - name: FSCFGR
      description: CAN filter scale register (banks 0..27).
      byte_offset: 524
      fieldset: FSCFGR
    - name: FSCFGR1
      description: CAN filter scale register 1 (banks 28..41).
      byte_offset: 528
      fieldset: FSCFGR1
    - name: FAFIFOR
      description: CAN filter FIFO assignment register (banks 0..27).
      byte_offset: 532
      fieldset: FAFIFOR
    - name: FAFIFOR1
      description: CAN filter FIFO assignment register 1 (banks 28..41).
      byte_offset: 536
      fieldset: FAFIFOR1
    - name: FWR
      description: CAN filter activation register (banks 0..27).
      byte_offset: 540
      fieldset: FWR
    - name: FWR1
      description: CAN filter activation register 1 (banks 28..41).
      byte_offset: 544
      fieldset: FWR1
    - name: FR
      description: Filter bank register 1/2, F0R1 to F41R2.
      array:
        len: 84
        stride: 4
      byte_offset: 576
      fieldset: FR

fieldset/CTLR:
  description: CAN master control register.
  fields:
    - name: INRQ
      description: Initialization request.
      bit_offset: 0
      bit_size: 1
    - name: SLEEP
      description: Sleep mode request.
      bit_offset: 1
      bit_size: 1
    - name: TXFP
      description: Transmit FIFO priority.
      bit_offset: 2
      bit_size: 1
    - name: RFLM
      description: Receive FIFO locked mode.
      bit_offset: 3
      bit_size: 1
    - name: NART
      description: No automatic retransmission.
      bit_offset: 4
      bit_size: 1
    - name: AWUM
      description: Automatic wakeup mode.
      bit_offset: 5
      bit_size: 1
    - name: ABOM
      description: Automatic bus-off management.
      bit_offset: 6
      bit_size: 1
    - name: TTCM
      description: Time triggered communication mode.
      bit_offset: 7
      bit_size: 1
    - name: RST
      description: Software master reset.
      bit_offset: 15
      bit_size: 1
    - name: DBF
      description: Debug freeze.
      bit_offset: 16
      bit_size: 1
    - name: CFGCANM
      description: Configure CAN offline recovery time.
      bit_offset: 17
      bit_size: 1

fieldset/STATR:
  description: CAN master status register.
  fields:
    - name: INAK
      description: Initialization acknowledge.
      bit_offset: 0
      bit_size: 1
    - name: SLAK
      description: Sleep acknowledge.
      bit_offset: 1
      bit_size: 1
    - name: ERRI
      description: Error interrupt.
      bit_offset: 2
      bit_size: 1
    - name: WKUI
      description: Wakeup interrupt.
      bit_offset: 3
      bit_size: 1
    - name: SLAKI
      description: Sleep acknowledge interrupt.
      bit_offset: 4
      bit_size: 1
    - name: TXM
      description: Transmit mode.
      bit_offset: 8
      bit_size: 1
    - name: RXM
      description: Receive mode.
      bit_offset: 9
      bit_size: 1
    - name: SAMP
      description: Last sample point.
      bit_offset: 10
      bit_size: 1
    - name: RX
      description: Rx signal.
      bit_offset: 11
      bit_size: 1

fieldset/TSTATR:
  description: CAN transmit status register.
  fields:
    - name: RQCP
      description: Request completed mailbox 0.
      bit_offset: 0
      bit_size: 1
      array:
        len: 3
        stride: 8
    - name: TXOK
      description: Transmission OK of mailbox 0.
      bit_offset: 1
      bit_size: 1
      array:
        len: 3
        stride: 8
    - name: ALST
      description: Arbitration lost for mailbox 0.
      bit_offset: 2
      bit_size: 1
      array:
        len: 3
        stride: 8
    - name: TERR
      description: Transmission error of mailbox 0.
      bit_offset: 3
      bit_size: 1
      array:
        len: 3
        stride: 8
    - name: ABRQ
      description: Abort request for mailbox 0.
      bit_offset: 7
      bit_size: 1
      array:
        len: 3
        stride: 8
    - name: CODE
      description: Mailbox code.
      bit_offset: 24
      bit_size: 2
    - name: TME
      description: Transmit mailbox 0 empty.
      bit_offset: 26
      bit_size: 1
      array:
        len: 3
        stride: 1
    - name: LOW
      description: Lowest priority flag for mailbox 0.
      bit_offset: 29
      bit_size: 1
      array:
        len: 3
        stride: 1

fieldset/RFIFO:
  description: CAN receive FIFO register.
  fields:
    - name: FMP
      description: FIFO message pending.
      bit_offset: 0
      bit_size: 2
    - name: FULL
      description: FIFO full.
      bit_offset: 3
      bit_size: 1
    - name: FOVR
      description: FIFO overrun.
      bit_offset: 4
      bit_size: 1
    - name: RFOM
      description: Release FIFO output mailbox.
      bit_offset: 5
      bit_size: 1

fieldset/INTENR:
  description: CAN interrupt enable register.
  fields:
    - name: TMEIE
      description: Transmit mailbox empty interrupt enable.
      bit_offset: 0
      bit_size: 1
    - name: FMPIE0
      description: FIFO 0 message pending interrupt enable.
      bit_offset: 1
      bit_size: 1
    - name: FFIE0
      description: FIFO 0 full interrupt enable.
      bit_offset: 2
      bit_size: 1
    - name: FOVIE0
      description: FIFO 0 overrun interrupt enable.
      bit_offset: 3
      bit_size: 1
    - name: FMPIE1
      description: FIFO 1 message pending interrupt enable.
      bit_offset: 4
      bit_size: 1
    - name: FFIE1
      description: FIFO 1 full interrupt enable.
      bit_offset: 5
      bit_size: 1
    - name: FOVIE1
      description: FIFO 1 overrun interrupt enable.
      bit_offset: 6
      bit_size: 1
    - name: EWGIE
      description: Error warning interrupt enable.
      bit_offset: 8
      bit_size: 1
    - name: EPVIE
      description: Error passive interrupt enable.
      bit_offset: 9
      bit_size: 1
    - name: BOFIE
      description: Bus-off interrupt enable.
      bit_offset: 10
      bit_size: 1
    - name: LECIE
      description: Last error code interrupt enable.
      bit_offset: 11
      bit_size: 1
    - name: ERRIE
      description: Error interrupt enable.
      bit_offset: 15
      bit_size: 1
    - name: WKUIE
      description: Wakeup interrupt enable.
      bit_offset: 16
      bit_size: 1
    - name: SLKIE
      description: Sleep interrupt enable.
      bit_offset: 17
      bit_size: 1

fieldset/ERRSR:
  description: CAN error status register.
  fields:
    - name: EWGF
      description: Error warning flag.
      bit_offset: 0
      bit_size: 1
    - name: EPVF
      description: Error passive flag.
      bit_offset: 1
      bit_size: 1
    - name: BOFF
      description: Bus-off flag.
      bit_offset: 2
      bit_size: 1
    - name: LEC
      description: Last error code.
      bit_offset: 4
      bit_size: 3
    - name: TEC
      description: Least significant byte of the 9-bit transmit error counter.
      bit_offset: 16
      bit_size: 8
    - name: REC
      description: Receive error counter.
      bit_offset: 24
      bit_size: 8

fieldset/BTIMR:
  description: CAN bit timing register.
  fields:
    - name: BRP
      description: Baud rate prescaler.
      bit_offset: 0
      bit_size: 10
    - name: BTR_TS1_T
      description: Extended high bits of TS1 in long-TS1 mode.
      bit_offset: 12
      bit_size: 4
    - name: TS1
      description: Time segment 1.
      bit_offset: 16
      bit_size: 4
    - name: TS2
      description: Time segment 2.
      bit_offset: 20
      bit_size: 4
    - name: SJW
      description: Resynchronization jump width.
      bit_offset: 24
      bit_size: 4
    - name: LBKM
      description: Loop back mode (debug).
      bit_offset: 30
      bit_size: 1
    - name: SILM
      description: Silent mode (debug).
      bit_offset: 31
      bit_size: 1

fieldset/TTCTLR:
  description: CAN time trigger control register.
  fields:
    - name: TIMCMV
      description: Internal counter count end value.
      bit_offset: 0
      bit_size: 16
    - name: TIMRST
      description: Internal counter reset control.
      bit_offset: 16
      bit_size: 1
    - name: MODE
      description: Time-triggered mode selection.
      bit_offset: 17
      bit_size: 1

fieldset/TERR_CNT:
  description: CAN offline recovery error counter.
  fields:
    - name: TX_ERR_CNT
      description: Offline recovery error count value.
      bit_offset: 0
      bit_size: 9

fieldset/TXMIR:
  description: CAN TX mailbox identifier register.
  fields:
    - name: TXRQ
      description: Transmit mailbox request.
      bit_offset: 0
      bit_size: 1
    - name: RTR
      description: Remote transmission request.
      bit_offset: 1
      bit_size: 1
    - name: IDE
      description: Identifier extension.
      bit_offset: 2
      bit_size: 1
    - name: EXID
      description: Extended identifier.
      bit_offset: 3
      bit_size: 18
    - name: STID
      description: Standard identifier (also EXID[28:18] for extended frames).
      bit_offset: 21
      bit_size: 11

fieldset/TXMDTR:
  description: CAN mailbox data length control and time stamp register.
  fields:
    - name: DLC
      description: Data length code.
      bit_offset: 0
      bit_size: 4
    - name: TGT
      description: Transmit global time.
      bit_offset: 8
      bit_size: 1
    - name: TIME
      description: Message time stamp.
      bit_offset: 16
      bit_size: 16

fieldset/TXMDLR:
  description: CAN mailbox data low register.
  fields:
    - name: DATA
      description: Data byte 0.
      bit_offset: 0
      bit_size: 8
      array:
        len: 4
        stride: 8

fieldset/TXMDHR:
  description: CAN mailbox data high register.
  fields:
    - name: DATA
      description: Data byte 4.
      bit_offset: 0
      bit_size: 8
      array:
        len: 4
        stride: 8

fieldset/RXMIR:
  description: CAN receive FIFO mailbox identifier register.
  fields:
    - name: RTR
      description: Remote transmission request.
      bit_offset: 1
      bit_size: 1
    - name: IDE
      description: Identifier extension.
      bit_offset: 2
      bit_size: 1
    - name: EXID
      description: Extended identifier.
      bit_offset: 3
      bit_size: 18
    - name: STID
      description: Standard identifier (also EXID[28:18] for extended frames).
      bit_offset: 21
      bit_size: 11

fieldset/RXMDTR:
  description: CAN receive FIFO mailbox data length control and time stamp register.
  fields:
    - name: DLC
      description: Data length code.
      bit_offset: 0
      bit_size: 4
    - name: BRS
      description: Received frame BRS bit (no CAN FD transmit path).
      bit_offset: 4
      bit_size: 1
    - name: ESI
      description: Received frame ESI bit.
      bit_offset: 5
      bit_size: 1
    - name: RES
      description: Received frame reserved bit.
      bit_offset: 6
      bit_size: 1
    - name: FMI
      description: Filter match index.
      bit_offset: 8
      bit_size: 8
    - name: TIME
      description: Message time stamp.
      bit_offset: 16
      bit_size: 16

fieldset/RXMDLR:
  description: CAN receive FIFO mailbox data low register.
  fields:
    - name: DATA
      description: Data byte 0.
      bit_offset: 0
      bit_size: 8
      array:
        len: 4
        stride: 8

fieldset/RXMDHR:
  description: CAN receive FIFO mailbox data high register.
  fields:
    - name: DATA
      description: Data byte 4.
      bit_offset: 0
      bit_size: 8
      array:
        len: 4
        stride: 8

fieldset/FCTLR:
  description: CAN filter master register.
  fields:
    - name: FINIT
      description: Filter init mode.
      bit_offset: 0
      bit_size: 1
    - name: CAN2SB
      description: Start bank of CAN2's filters; banks below belong to CAN1.
      bit_offset: 8
      bit_size: 5
    - name: CAN3SB
      description: Start bank of CAN3's filters; 42 means CAN3 takes none.
      bit_offset: 16
      bit_size: 6

fieldset/FMCFGR:
  description: CAN filter mode register (banks 0..27).
  fields:
    - name: FBM
      description: Filter mode.
      bit_offset: 0
      bit_size: 1
      array:
        len: 28
        stride: 1

fieldset/FMCFGR1:
  description: CAN filter mode register 1 (banks 28..41).
  fields:
    - name: FBM
      description: Filter mode.
      bit_offset: 0
      bit_size: 1
      array:
        len: 14
        stride: 1

fieldset/FSCFGR:
  description: CAN filter scale register (banks 0..27).
  fields:
    - name: FSC
      description: Filter scale configuration.
      bit_offset: 0
      bit_size: 1
      array:
        len: 28
        stride: 1

fieldset/FSCFGR1:
  description: CAN filter scale register 1 (banks 28..41).
  fields:
    - name: FSC
      description: Filter scale configuration.
      bit_offset: 0
      bit_size: 1
      array:
        len: 14
        stride: 1

fieldset/FAFIFOR:
  description: CAN filter FIFO assignment register (banks 0..27).
  fields:
    - name: FFA
      description: Filter FIFO assignment.
      bit_offset: 0
      bit_size: 1
      array:
        len: 28
        stride: 1

fieldset/FAFIFOR1:
  description: CAN filter FIFO assignment register 1 (banks 28..41).
  fields:
    - name: FFA
      description: Filter FIFO assignment.
      bit_offset: 0
      bit_size: 1
      array:
        len: 14
        stride: 1

fieldset/FWR:
  description: CAN filter activation register (banks 0..27).
  fields:
    - name: FACT
      description: Filter active.
      bit_offset: 0
      bit_size: 1
      array:
        len: 28
        stride: 1

fieldset/FWR1:
  description: CAN filter activation register 1 (banks 28..41).
  fields:
    - name: FACT
      description: Filter active.
      bit_offset: 0
      bit_size: 1
      array:
        len: 14
        stride: 1

fieldset/FR:
  description: Filter bank register 1 or 2.
  fields:
    - name: FB
      description: Filter bits.
      bit_offset: 0
      bit_size: 1
      array:
        len: 32
        stride: 1
