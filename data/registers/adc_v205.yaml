    bit_size: 4
fieldset/TKEY_TRANS_CFG:
  description: Charge Shift Configuration Register.
  fields:
  - name: TRANSCC
    description: In charge transfer mode, touch the button capacitor charge charge T2 and charge transfer time T4 configuration bits.
    bit_offset: 0
    bit_size: 3
  - name: TRANSN
    description: The actual number of transfer cycles is TRANSN+1, that is,.  the maximum number of transfer cycles is 1024.
    bit_offset: 3
    bit_size: 10
  - name: TKSW
    description: TKEY switch switching time configuration.
    bit_offset: 13
    bit_size: 2
fieldset/CAP_CFG:
