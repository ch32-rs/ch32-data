    fieldset: CTLR1
  - name: CTLR2
    description: control register 2.
    byte_offset: 8
    fieldset: CTLR2
  - name: SAMPTR1
    description: sample time register 1.
    byte_offset: 12
    fieldset: SAMPTR1
  - name: SAMPTR2
    description: sample time register 2.
    byte_offset: 16
    fieldset: SAMPTR2
  - name: IOFR1
    description: injected channel data offset register x.
    byte_offset: 20
    fieldset: IOFR1
  - name: IOFR2
    description: injected channel data offset register x.
    byte_offset: 24
    fieldset: IOFR2
  - name: IOFR3
    description: injected channel data offset register x.
    byte_offset: 28
    fieldset: IOFR3
  - name: IOFR4
    description: injected channel data offset register x.
    byte_offset: 32
    fieldset: IOFR4
  - name: WDHTR
    description: watchdog higher threshold register.
    byte_offset: 36
    fieldset: WDHTR
  - name: WDLTR
    description: watchdog lower threshold register.
    byte_offset: 40
    fieldset: WDLTR
  - name: RSQR1
    description: regular sequence register 1.
    byte_offset: 44
    fieldset: RSQR1
  - name: RSQR2
    description: regular sequence register 2.
    byte_offset: 48
    fieldset: RSQR2
  - name: RSQR3
    description: regular sequence register 3.
    byte_offset: 52
    fieldset: RSQR3
  - name: ISQR
    description: injected sequence register.
    byte_offset: 56
    fieldset: ISQR
  - name: IDATAR1_CHGOFFSET
    description: injected data register 1.
    byte_offset: 60
    access: Read
    fieldset: IDATAR1_CHGOFFSET
  - name: IDATAR2
    description: injected data register 2.
    byte_offset: 64
    access: Read
    fieldset: IDATAR2
  - name: IDATAR3
    description: injected data register 3.
    byte_offset: 68
    access: Read
    fieldset: IDATAR3
  - name: IDATAR4
    description: injected data register 4.
    byte_offset: 72
    access: Read
    fieldset: IDATAR4
  - name: RDATAR
    description: regular data register.
    byte_offset: 76
    access: Read
    fieldset: RDATAR
  # Touch key (TKEY) control registers of this ADC block (RM ch.13). TKEY
  # reuses the ADC sequence registers (RSQR1/2/3) and conversion engine;
  # it is enabled through TKEY_CTLR.TKEN, not via a separate peripheral.
  - name: TKEY_CTLR
    description: TKEY control register.
    byte_offset: 88
    fieldset: TKEY_CTLR
  - name: TKEY_TRANS_CFG
    description: Charge Shift Configuration Register.
    byte_offset: 92
    fieldset: TKEY_TRANS_CFG
  - name: TKEY_CAP_CFG
    description: Capacitor Configuration Register.
    byte_offset: 96
    fieldset: CAP_CFG
  - name: TKEY_DRV_CFG
    description: Driver Shield Configuration Register.
    byte_offset: 100
    fieldset: DRV_CFG
  - name: TKEY_CDCC
    description: TKEY Charge-Discharge Configuration Register.
    byte_offset: 104
    fieldset: TKEY_CDCC
  - name: TKEY_SR
    description: TKEY Status Register.
    byte_offset: 108
    fieldset: TKEY_SR
fieldset/CTLR1:
  description: control register 1.
  fields:
  - name: AWDCH
    description: Analog watchdog channel select bits.
    bit_offset: 0
    bit_size: 5
  - name: EOCIE
    description: Interrupt enable for EOC.
    bit_offset: 5
    bit_size: 1
  - name: AWDIE
    description: Analog watchdog interrupt enable.
    bit_offset: 6
    bit_size: 1
  - name: JEOCIE
    description: Interrupt enable for injected channels.
    bit_offset: 7
    bit_size: 1
  - name: SCAN
    description: Scan mode enable.
    bit_offset: 8
    bit_size: 1
  - name: AWDSGL
    description: Enable the watchdog on a single channel in scan mode.
    bit_offset: 9
    bit_size: 1
  - name: JAUTO
    description: Automatic injected group conversion.
    bit_offset: 10
    bit_size: 1
  - name: DISCEN
    description: Discontinuous mode on regular channels.
    bit_offset: 11
    bit_size: 1
  - name: JDISCEN
    description: Discontinuous mode on injected channels.
    bit_offset: 12
    bit_size: 1
  - name: DISCNUM
    description: Discontinuous mode channel count.
    bit_offset: 13
    bit_size: 3
  - name: JAWDEN
    description: Analog watchdog enable on injected channels.
    bit_offset: 22
    bit_size: 1
  - name: AWDEN
    description: Analog watchdog enable on regular channels.
    bit_offset: 23
    bit_size: 1
  - name: BUFEN
    description: ADC BUF Enable.
    bit_offset: 26
    bit_size: 1
  - name: PGA
    description: ADC_PGA.
    bit_offset: 27
    bit_size: 2
  - name: AWDRST_EN
    description: simulation watchdog reset enable.
    bit_offset: 30
    bit_size: 1
  - name: SWDIS
    description: ADC channel pre-switching function.
    bit_offset: 31
    bit_size: 1
