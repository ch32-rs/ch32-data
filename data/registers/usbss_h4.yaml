    bit_offset: 19
    bit_size: 1
  - name: UIE_ITP
    description: Send ITP to complete interrupt enable.
    bit_offset: 20
    bit_size: 1
  - name: UIE_FIFO_TXOV
    description: Sending FIFO overflow interrupt enables.
    bit_offset: 22
    bit_size: 1
  - name: UIE_FIFO_RXOV
    description: Receive FIFO overflow interrupt enabled.
    bit_offset: 23
    bit_size: 1
