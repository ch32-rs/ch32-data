    description: Send FIFO overflow interrupt flag.
    bit_offset: 6
    bit_size: 1
  - name: UIF_FIFO_RXOV
    description: Receive FIFO overflow interrupt flag.
    bit_offset: 7
    bit_size: 1
  - name: EP_ID
    description: If multiple endpoints have interrupt flags at the same time, the order of endpoint priority is as follows.
    bit_offset: 8
    bit_size: 3
  - name: EP_DIR
    description: The direction of the endpoint that currently has an interrupt flag for transmission completion,.
    bit_offset: 12
    bit_size: 1
  - name: HOST_ACK_NUMP
    description: This bit is invalid for synchronous transmission, and is defined as follows in Control Transfer,. Block Transfer, and Interrupt Transfer.
    bit_offset: 16
    bit_size: 5
  - name: HTX_RES
    description: Received a reply TP from the device returning.
    bit_offset: 22
    bit_size: 2
  - name: HRX_RES
    description: A reply TP is received from the device back.
    bit_offset: 30
    bit_size: 2
fieldset/UEP0_RX_CTRL:
  description: Endpoint 0 receives control registers.
  fields:
  - name: EP0_RX_LEN
    description: The endpoint receives the length register.
    bit_offset: 0
    bit_size: 11
  - name: EP0_RX_SEQ
    description: The sequence number of the endpoint expects to accept.
    bit_offset: 16
    bit_size: 5
  - name: EP0_RX_RES
    description: Response to DPH.
    bit_offset: 21
    bit_size: 2
  - name: EP0_RX_ERDY
    description: ERDY received.
    bit_offset: 23
    bit_size: 1
  - name: EP0_RX_PP
    description: PP bits in the received DPH.
    bit_offset: 24
    bit_size: 1
  - name: UIF_EP0_RX_ACT
    description: Upload the transaction completion interrupt flag, the software writes 0 to zero, and the hardware sets 1.
    bit_offset: 31
    bit_size: 1
fieldset/UEP0_TX_CTRL:
  description: Endpoint 0 sends control registers.
  fields:
  - name: EP0_TX_LEN
    description: Endpoint transmits length registers with a maximum value of 512B.
    bit_offset: 0
    bit_size: 11
  - name: EP0_TX_SEQ
    description: The current sequence number of the endpoint,. which is aotomatically reset after receiving the SETUP transaction.
    bit_offset: 16
    bit_size: 5
  - name: EP0_TX_RES
    description: Response to ACK-TP.
    bit_offset: 21
    bit_size: 2
  - name: EP0_TX_ERDY
    description: ERDY received.
    bit_offset: 23
    bit_size: 1
  - name: EP0_TX_PP
    description: The PP bit in the received ACK-TP.
    bit_offset: 24
    bit_size: 1
  - name: EP0_TX_FLOW
    description: A sign that completes the NRDY-TP send (answer).
    bit_offset: 25
    bit_size: 1
  - name: UIF_EP0_TX_ACT
    description: The upload transaction is interrupted, the software writes 0 to zero, and the hardware sets 1.
    bit_offset: 31
    bit_size: 1
fieldset/UEP_RX_EN:
  description: Endpoint Receive Enable Register.
  bit_size: 16
  fields:
  - name: EP_RX_EN
    description: Endpoints 1~15 downpass enabled. Index 0 is endpoint 1.
    bit_offset: 1
    bit_size: 1
    array:
      len: 15
      stride: 1
fieldset/UEP_TX_EN:
  description: Endpoint Sends Enable Register.
  bit_size: 16
  fields:
  - name: EP_TX_EN
    description: Endpoints 1~15 upload enabled. Index 0 is endpoint 1.
    bit_offset: 1
    bit_size: 1
    array:
      len: 15
      stride: 1
fieldset/UH_RX_CTRL:
  description: Host receives control registers.
  fields:
  - name: UH_RX_LEN
    description: The endpoint receives the length register,. which for burst transmissions indicates the packet length of the last packet of the burst transmission,  and the other packets must be 1024B as specified in the protocol.
    bit_offset: 0
    bit_size: 11
  - name: UH_RX_EP
    description: Indicates the source (device endpoint number) from which the packet was received in host mode.
    bit_offset: 12
    bit_size: 4
  - name: UH_RX_SEQ
    description: The SEQ _NUM that the endpoint expects to receive, the hardware automatically adds 1, except for endpoint 0.
    bit_offset: 16
    bit_size: 5
  - name: UH_RX_RES
    description: Response to DPH+DPP or STATUS-TP.
    bit_offset: 21
    bit_size: 2
  - name: UH_RX_NUMP
    description: The number of packets (DPP) that the endpoint is capable of receiving (burst transmission).
    bit_offset: 24
    bit_size: 5
  - name: UH_RX_ISO
    description: Received Packets (DPP) are transmitted synchronously.
    bit_offset: 30
    bit_size: 1
  - name: UH_RX_ACT
    description: The OUT transaction completes the interrupt flag, the software writes 0 to zero, and the hardware sets 1.
    bit_offset: 31
    bit_size: 1
fieldset/UH_RX_DMA_OFS:
  description: Host Receive Address Offset Register.
  fields:
  - name: UH_RX_DMA_OFS
    description: After the host receives it, the DMA's address is offset by a large amount.
    bit_offset: 0
    bit_size: 32
fieldset/UH_RX_DMA:
  description: Receive buffer address registers.
  fields:
  - name: UH_RX_DMA
    description: The start address of the host receiving buffer.
    bit_offset: 0
    bit_size: 32
fieldset/UH_TX_CTRL:
  description: Host Transmit Control Registers.
  fields:
  - name: UH_TX_LEN
    description: The endpoint receives the length register,. which for burst transmissions indicates the packet length of the last packet of the burst transmission,  and the other packets must be 1024B as specified in the protocol.
    bit_offset: 0
    bit_size: 11
  - name: UH_TX_EP
    description: Indicates the destination of the packet sent in host mode (the target endpoint number of the device).
    bit_offset: 12
    bit_size: 4
  - name: UH_TX_SEQ
    description: The SEQ _NUM for which the endpoint receives the packet, the hardware automatically adds 1, except for endpoint 0.
    bit_offset: 16
    bit_size: 5
  - name: UH_TX_RES
    description: Response to DPH+DPP.
    bit_offset: 21
    bit_size: 2
  - name: UH_TX_LPF
    description: For burst transmissions, this bit simply represents the LPF/EOB of the last packet,. and the LPF/EOB of the preceding packet uses a fixed value of 0.
    bit_offset: 23
    bit_size: 1
  - name: UH_TX_STATUS
    description: Indicates that the packet sent by the host is STATUS TP.
    bit_offset: 28
    bit_size: 1
  - name: UH_TX_SETUP
    description: Indicates that the packet sent by the host is a Setup packet, and the setup flag is set.
    bit_offset: 29
    bit_size: 1
  - name: UH_TX_ISO
    description: The host prepares to send ISO packets.
    bit_offset: 30
    bit_size: 1
  - name: UH_TX_ACT
    description: The IN transaction completes the interrupt flag, the software writes 0 to zero, and the hardware sets 1.
    bit_offset: 31
    bit_size: 1
fieldset/UH_TX_DMA_OFS:
  description: Host Transmit Address Offset Register.
  fields:
  - name: UH_TX_DMA_OFS
    description: After the host sends the DMA, the size of the DMA address offset.
    bit_offset: 0
    bit_size: 32
fieldset/UH_TX_DMA:
  description: Send buffer address registers.
  fields:
  - name: UH_TX_DMA
    description: The start address of the host sending buffer.
    bit_offset: 0
    bit_size: 32
fieldset/USBSS_CTRL:
  description: USBSS Control Register.
  fields:
  - name: DMA_EN
    description: Enable DMA.
    bit_offset: 0
    bit_size: 1
  - name: USB_CLR_ALL
    description: Reset all software configuration registers, high validity, software clearance required.
    bit_offset: 1
    bit_size: 1
  - name: FORCE_RST
    description: The protocol layer and FIFO module are reset and need to be cleared by software.
    bit_offset: 2
    bit_size: 1
  - name: DMA_MODE
    description: When DPH is transmitted in bursts, the next packet of data status.
    bit_offset: 3
    bit_size: 1
  - name: SETUP_FLOW
