  fields:
  - name: LINK_PD_MODE
    description: Configure the current power mode of the PHY, corresponding to PO/P1/P2/P3 in the PIPE.
    bit_offset: 0
    bit_size: 2
  - name: LINK_GO_DISABLED
    description: SET LINK TO ENTER SS.DISABLED, WHICH IS HIGHLY VALID,. AND REQUIRES SOFTWARE TO CLEAR.
    bit_offset: 4
    bit_size: 1
  - name: LINK_GO_INACTIVE
    description: SET THE LINK TO ENTER SS.INACTIVE,. WHICH IS HIGHLY VALID, AND THE HARDWARE IS AUTOMATICALLY CLEARED.
    bit_offset: 5
    bit_size: 1
  - name: LINK_GO_RECOVERY
    description: SET THE LINK TO ENTER SS.RECOVERY,. WHICH IS HIGHLY EFFECTIVE, AND THE HARDWARE IS AUTOMATICALLY CLEARED.
    bit_offset: 6
    bit_size: 1
  - name: LINK_GO_RX_DET
    description: Before setting this bit, the PD_MODE should be set to P2 mode,. and the LINK should be set to enter the SS.RX_DETECT,  and the software will query TERM_PRESENT to know whether there is a connection or whether the connection is disconnected.  High effectiveness, automatic clearing.
    bit_offset: 7
    bit_size: 1
  - name: LINK_TX_WARM_RST
    description: High validity, cleared by software. A valid bit will send a warm-reset.
    bit_offset: 8
    bit_size: 1
  - name: LINK_TX_UX_EXIT
    description: High validity, hardware automatic zeroing.
    bit_offset: 9
    bit_size: 1
  - name: LINK_LUP_LDN_EN
    description: In the U0 state, if there is no data, whether to send LUP and LDN packets every 10us.
    bit_offset: 10
    bit_size: 1
  - name: LINK_REG_ROUT_EN
    description: Enable the routing function of the HUB, which is highly effective, with registers and no interfaces.
    bit_offset: 11
    bit_size: 1
  - name: LINK_POLLING_EN
    description: If the TERM is detected by the SS.RX_DETECT,. a POLLING handshake will be performed after the software sets the bit to be valid.
    bit_offset: 12
    bit_size: 1
  - name: LINK_TX_LGO_U1
