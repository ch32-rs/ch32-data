fieldset/ITP_ADJ:
  description: Interval Adaptive Registers for ITP packets in USB.
  fields:
  - name: ITP_ADJ_CR
    description: In device mode, the Bus Interval Adjustment Control field in the received ITP should be 0 after power-on reset or device disconnection.
    bit_offset: 0
    bit_size: 7
  - name: ITP_DELAYED
    description: In device mode, the Delayed bit of Link Control Word in the received ITP is 1 when the ITP is delayed.
    bit_offset: 7
    bit_size: 1
  - name: ITP_DELTA
    description: The higher 13-bit delta of the ITS in. the ITP received in device mode indicates the time difference from the start of the current  ITP packet to the previous bus interval boundary.
    bit_offset: 8
    bit_size: 13
