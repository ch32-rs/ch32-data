    bit_offset: 13
    bit_size: 1
  - name: LINK_TX_LGO_U2
    description: After the bit is valid, the LGO_U2 is sent, the high is active, and the hardware is automatically cleared.
    bit_offset: 14
    bit_size: 1
  - name: LINK_TX_LGO_U3
    description: After the bit is valid, the LGO_U3 is transmitted, and the hardware is automatically cleared.
    bit_offset: 15
    bit_size: 1
