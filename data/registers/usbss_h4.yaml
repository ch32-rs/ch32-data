    description: Transmitter de-emphasis control.
    bit_offset: 8
    bit_size: 2
  - name: LINK_CP78_SEL
    description: In Compliance Pattern 7/8, send a length of consecutive 0 or consecutive 1.
    bit_offset: 10
    bit_size: 2
  - name: LINK_U2_DET_EN
    description: Detection mode of connected devices in U2 state.
    bit_offset: 12
    bit_size: 1
  - name: LINK_LOOPBACK_EN
    description: The LOOPBACK enable bit is allowed, which is highly active, and can be used with the LOOKBACK enable in TX/RX_TS_CFG [3],. both of which are valid before LINK can enter the LOOKBACK mode  (used to enable the data loopback and error counting of the LOOPBACK slave,  and the LOOPBACK master remains 0).
    bit_offset: 13
    bit_size: 1
  - name: LINK_LOOKBACK_ACT
    description: It is used in LOOPBACK mode for the LOOPBACK master to control the pattern transmission (the LOOPBACK slave keeps 0),. and the ACT is a high-level signal that lasts for a period of time.
    bit_offset: 14
    bit_size: 1
  - name: LINK_LTSSM_MODE
    description: The link state machine enters DISABLE mode.
    bit_offset: 15
    bit_size: 1
  - name: LINK_U1_ALLOW
    description: High validity, after receiving the LGO_U1, the response LAU allows to enter the U1 state,. otherwise, after receiving the LGO_U1, the response LXU refuses to enter the U1 state.
    bit_offset: 16
    bit_size: 1
  - name: LINK_U2_ALLOW
    description: High validity, after receiving the LGO_U2, the response LXU allows to enter the U2 state,. otherwise after receiving the LGO_U2, the response LXU refuses to enter the U2 state.
    bit_offset: 17
    bit_size: 1
