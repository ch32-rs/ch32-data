    bit_offset: 6
    bit_size: 1
  - name: HOST_MODE
    description: USB Operating Mode Selection Bits.
    bit_offset: 7
    bit_size: 1
  - name: REG_HP_PEND
    description: Packet Pending control bit for sending TP/DP packets.
    bit_offset: 8
    bit_size: 2
  - name: TX_ERDY_MODE
    description: Use in device mode.
    bit_offset: 14
    bit_size: 1
  - name: UIE_TRANSFER
    description: USB Transaction Completion Interrupt Enabled.
    bit_offset: 16
    bit_size: 1
  - name: UDIE_SETUP
    description: Receive SETUP Transaction Completion Interrupt Enabled.
    bit_offset: 17
    bit_size: 1
  - name: UHIE_ERDY
    description: Receive ERDY-TP Complete Interrupt Enabled.
    bit_offset: 17
    bit_size: 1
  - name: UDIE_STATUS
    description: Receiving STATUS transaction completion interrupt enabled.
    bit_offset: 18
    bit_size: 1
  - name: UHIE_NOTIF
