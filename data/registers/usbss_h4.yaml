block/EP_RX:
  description: Receive (OUT) registers of one device endpoint, 1 to 7. USBSS_EP_RX_TypeDef in the EVT header.
  items:
  - name: CFG
    description: Endpoint n configuration register (R8_UEPn_RX_CFG).
    byte_offset: 0
    bit_size: 8
    fieldset: EP_RX_CFG
  - name: CR
    description: Endpoint n control register (R8_UEPn_RX_CR).
    byte_offset: 1
    bit_size: 8
    fieldset: EP_RX_CR
  - name: SEQ
    description: Endpoint n sequence number register (R8_UEPn_RX_SEQ).
    byte_offset: 2
    bit_size: 8
    fieldset: EP_RX_SEQ
  - name: ST
    description: Endpoint n status register (R8_UEPn_RX_ST).
    byte_offset: 3
    bit_size: 8
    fieldset: EP_RX_ST
  - name: CHAIN_CR
    description: Endpoint n CHAIN control register (R8_UEPn_RX_CHAIN_CR).
    byte_offset: 4
    bit_size: 8
    fieldset: EP_RX_CHAIN_CR
  - name: CHAIN_ST
    description: Endpoint n CHAIN status register (R8_UEPn_RX_CHAIN_ST).
    byte_offset: 5
    bit_size: 8
    fieldset: EP_RX_CHAIN_ST
  - name: CHAIN_LEN
    description: Length of the last packet the CHAIN received (R16_UEPn_RX_CHAIN_LEN).
    byte_offset: 6
    bit_size: 16
    fieldset: EP_RX_CHAIN_LEN
  - name: CHAIN_MAX_NUMP
    description: Number of DPPs the CHAIN can receive (R8_UEPn_RX_CHAIN_MAX_NUMP).
    byte_offset: 8
    bit_size: 8
  - name: CHAIN_NUMP
    description: Number of DPPs the CHAIN has received (R8_UEPn_RX_CHAIN_NUMP).
    byte_offset: 9
    bit_size: 8
  - name: DMA_OFS
    description: Offset of a DPP in the CHAIN, the distance between two packets in the buffer (R16_UEPn_RX_DMA_OFS). Resets to 0x0400.
    byte_offset: 10
    bit_size: 16
  - name: DMA
    description: 'Normal mode: DMA start address of the CHAIN. FIFO mode: FIFO start and end addresses (R32_UEPn_RX_DMA).'
    byte_offset: 12
block/EP_TX:
  description: Transmit (IN) registers of one device endpoint, 1 to 7. USBSS_EP_TX_TypeDef in the EVT header.
  items:
  - name: CFG
    description: Endpoint n configuration register (R8_UEPn_TX_CFG).
    byte_offset: 0
    bit_size: 8
    fieldset: EP_TX_CFG
  - name: CR
    description: Endpoint n control register (R8_UEPn_TX_CR).
    byte_offset: 1
    bit_size: 8
    fieldset: EP_TX_CR
  - name: SEQ
    description: Endpoint n sequence number register (R8_UEPn_TX_SEQ).
    byte_offset: 2
    bit_size: 8
    fieldset: EP_TX_SEQ
  - name: ST
    description: Endpoint n status register (R8_UEPn_TX_ST).
    byte_offset: 3
    bit_size: 8
    fieldset: EP_TX_ST
  - name: CHAIN_CR
    description: Endpoint n CHAIN control register (R8_UEPn_TX_CHAIN_CR).
    byte_offset: 4
    bit_size: 8
    fieldset: EP_TX_CHAIN_CR
  - name: CHAIN_ST
    description: Endpoint n CHAIN status register (R8_UEPn_TX_CHAIN_ST).
    byte_offset: 5
    bit_size: 8
    fieldset: EP_TX_CHAIN_ST
  - name: CHAIN_LEN
    description: Length of the last packet the CHAIN sends (R16_UEPn_TX_CHAIN_LEN).
    byte_offset: 6
    bit_size: 16
    fieldset: EP_TX_CHAIN_LEN
  - name: CHAIN_EXP_NUMP
    description: Number of DPPs the CHAIN is to send (R8_UEPn_TX_CHAIN_EXP_NUMP).
    byte_offset: 8
    bit_size: 8
  - name: CHAIN_NUMP
    description: Number of DPPs the CHAIN has sent (R8_UEPn_TX_CHAIN_NUMP).
    byte_offset: 9
    bit_size: 8
  - name: DMA_OFS
    description: Offset of a DPP in the CHAIN, the distance between two packets in the buffer (R16_UEPn_TX_DMA_OFS). Resets to 0x0400.
    byte_offset: 10
    bit_size: 16
  - name: DMA
    description: 'Normal mode: DMA start address of the CHAIN. FIFO mode: FIFO start and end addresses (R32_UEPn_TX_DMA).'
    byte_offset: 12
block/USBSS:
  description: USB3.0 ultra-high speed host /device controller.
  items:
  - name: LINK_CFG
    description: LINK Configuration Register.
    byte_offset: 0
    fieldset: LINK_CFG
  - name: LINK_CTRL
    description: LINK control registers.
    byte_offset: 4
    fieldset: LINK_CTRL
  - name: LINK_INT_CTRL
    description: LINK interrupt enable register.
    byte_offset: 8
    fieldset: LINK_INT_CTRL
  - name: LINK_INT_FLAG
    description: LINK Interrupt Flag Register.
    byte_offset: 12
    fieldset: LINK_INT_FLAG
  - name: LINK_STATUS
    description: LINK Status Register.
    byte_offset: 16
    fieldset: LINK_STATUS
  - name: LINK_ITP_PRE
    description: LINK ITP Timeout Mode Register.
    byte_offset: 23
    bit_size: 8
    fieldset: LINK_ITP_PRE
  - name: LINK_U2_INACT_TIMER
    description: LINK U2 Inactivity Timeout Counter Threshold Register.
    byte_offset: 29
    bit_size: 8
    fieldset: LINK_U2_INACT_TIMER
  - name: LINK_U1_WKUP_FILTER
    description: U1 wakes up the LFPS Duration Register.
    byte_offset: 40
    bit_size: 8
    fieldset: LINK_U1_WKUP_FILTER
  - name: LINK_U1_WKUP_TMR
    description: U1 wake-up timer. The RM register table omits this register; the EVT device header exposes it and the device SDK writes 120.
    byte_offset: 42
    bit_size: 16
    fieldset: LINK_U1_WKUP_TMR
  - name: LINK_U2_WKUP_FILTER
    description: U2 wakes up the LFPS Duration Register.
    byte_offset: 44
    bit_size: 8
    fieldset: LINK_U2_WKUP_FILTER
  - name: LINK_U3_WKUP_FILTER
    description: U3 wakes up the LFPS validity duration register.
    byte_offset: 48
    bit_size: 8
    fieldset: LINK_U3_WKUP_FILTER
  - name: LINK_U3_WKUP_TMR
    description: U3 wake-up timer. The RM register table omits this register; the EVT device header exposes it.
    byte_offset: 50
    bit_size: 16
    fieldset: LINK_U3_WKUP_TMR
  - name: LINK_U1_EXIT_CFG
    description: U1 exit configuration. The RM register table omits this register; the EVT device header exposes it and the device SDK sets bit 9 before link training.
    byte_offset: 52
    fieldset: LINK_U1_EXIT_CFG
  - name: LINK_U2_EXIT_CFG
    description: U2 exit configuration. The RM register table omits this register and the EVT header gives no bit definitions.
    byte_offset: 56
    fieldset: LINK_U2_EXIT_CFG
  - name: LINK_U3_EXIT_CFG
    description: U3 exit configuration. The RM register table omits this register and the EVT header gives no bit definitions.
    byte_offset: 60
    fieldset: LINK_U3_EXIT_CFG
  - name: LINK_ISO_DLY
    description: LINK Synchronous Delay Register.
    byte_offset: 64
    bit_size: 16
    fieldset: LINK_ISO_DLY
  - name: LINK_LPM_CR
    description: Link Power Management Registers.
    byte_offset: 80
    bit_size: 16
    fieldset: LINK_LPM_CR
  - name: LINK_LMP_PORT_CAP
    description: PORT_CAP Registers.
    byte_offset: 84
    fieldset: LINK_LMP_PORT_CAP
  - name: LINK_LMP_RX_DATA
    description: Header packet of the last LMP received; word n holds bits [32n+31:32n].
    array:
      len: 3
      stride: 4
    byte_offset: 88
  - name: LINK_LMP_TX_DATA
    description: User-defined header packet to send, such as an LMP; word n holds bits [32n+31:32n].
    array:
      len: 3
      stride: 4
    byte_offset: 100
  - name: USBSS_CTRL
    description: USBSS Control Register.
    byte_offset: 112
    fieldset: USBSS_CTRL
  - name: STATUS
    description: USBSS Status Register.
    byte_offset: 116
    fieldset: STATUS
  - name: ITP
    description: Interval Registers for ITP packets in USB.
    byte_offset: 120
    fieldset: ITP
  - name: ITP_ADJ
    description: Interval Adaptive Registers for ITP packets in USB.
    byte_offset: 124
    fieldset: ITP_ADJ
  - name: TP_RX_DATA
    description: Header packet of the last DEV_NOTIF-TP received; word n holds bits [32n+31:32n].
    array:
      len: 3
      stride: 4
    byte_offset: 168
  - name: PHY_CFG_CR
    description: Indirect PHY configuration command. The RM does not document this register; the device SDK writes `(1 << 23) | (addr << 16) | data`.
    byte_offset: 504
    fieldset: PHY_CFG_CR
  - name: PHY_CFG_DAT
    description: Indirect PHY configuration data. The RM does not document this register; the device SDK reads the PHY response from it.
    byte_offset: 508
    fieldset: PHY_CFG_DAT
block/USBSS_DEVICE:
  extends: USBSS
  description: USBSS in device mode. Endpoint configuration / TX / RX registers (UEP* family). Offsets overlap with USBSS_HOST host-mode registers; chiptool's overlap check is intra-block only so the two views coexist via the extends mechanism.
  items:
  - name: UEP_TX_EN
    description: Endpoint Sends Enable Register.
    byte_offset: 128
    bit_size: 16
    fieldset: UEP_TX_EN
  - name: UEP_RX_EN
    description: Endpoint Receive Enable Register.
    byte_offset: 130
    bit_size: 16
    fieldset: UEP_RX_EN
  - name: UEP0_TX_CTRL
    description: Endpoint 0 sends control registers.
    byte_offset: 132
    fieldset: UEP0_TX_CTRL
  - name: UEP0_RX_CTRL
    description: Endpoint 0 receives control registers.
    byte_offset: 136
    fieldset: UEP0_RX_CTRL
  - name: UEP0_TX_DMA
    description: Start address of the endpoint 0 transmit buffer.
    byte_offset: 140
  - name: UEP0_RX_DMA
    description: Start address of the endpoint 0 receive buffer.
    byte_offset: 144
  - name: UEP0_TX_DMA_OFS
    description: Endpoint 0 transmit DMA offset. The RM register table omits this register; the EVT device header exposes it.
    byte_offset: 148
  - name: UEP0_RX_DMA_OFS
    description: Endpoint 0 receive DMA offset. The RM register table omits this register; the EVT device header exposes it.
    byte_offset: 152
  - name: EP_TX
    description: Transmit (IN) registers of endpoints 1 to 7. Index 0 is endpoint 1.
    array:
      len: 7
      stride: 32
    byte_offset: 192
    block: EP_TX
  - name: EP_RX
    description: Receive (OUT) registers of endpoints 1 to 7. Index 0 is endpoint 1.
    array:
      len: 7
      stride: 32
    byte_offset: 208
    block: EP_RX
block/USBSS_HOST:
  extends: USBSS
  description: USBSS in host mode. UH_* / HOST_* registers. Offsets overlap with USBSS_DEVICE.
  items:
  - name: UH_TX_CTRL
    description: Host Transmit Control Registers.
    byte_offset: 132
    fieldset: UH_TX_CTRL
  - name: UH_RX_CTRL
    description: Host receives control registers.
    byte_offset: 136
    fieldset: UH_RX_CTRL
  - name: UH_TX_DMA
    description: Send buffer address registers.
    byte_offset: 140
    fieldset: UH_TX_DMA
  - name: UH_RX_DMA
    description: Receive buffer address registers.
    byte_offset: 144
    fieldset: UH_RX_DMA
  - name: UH_TX_DMA_OFS
    description: Host Transmit Address Offset Register.
    byte_offset: 148
    fieldset: UH_TX_DMA_OFS
  - name: UH_RX_DMA_OFS
    description: Host Receive Address Offset Register.
    byte_offset: 152
    fieldset: UH_RX_DMA_OFS
  - name: HOST_RX_NUMP
    description: The host receives the NUMP register.
    byte_offset: 158
    bit_size: 16
    fieldset: HOST_RX_NUMP
  - name: HOST_STATUS
    description: Host Status Registers.
    byte_offset: 160
    fieldset: HOST_STATUS
  - name: HOST_TX_FC_STATUS
    description: The host endpoint sends flow control register.
    byte_offset: 164
    bit_size: 16
    fieldset: HOST_TX_FC_STATUS
  - name: HOST_RX_FC_STATUS
    description: The host endpoint receives the flow control register.
    byte_offset: 166
    bit_size: 16
    fieldset: HOST_RX_FC_STATUS
fieldset/EP_RX_CFG:
  description: Endpoint n receive configuration register.
  bit_size: 8
  fields:
  - name: ISO_MODE
    description: A value of 1 indicates that the current endpoint is a synchronous endpoint.
    bit_offset: 0
    bit_size: 1
  - name: SEQ_AUTO
    description: '1: software cannot write SEQ_NUM, hardware maintains it. 0: software may write SEQ_NUM.'
    bit_offset: 1
    bit_size: 1
  - name: ERDY_AUTO
    description: ERDY automatic mode, the hardware sends ERDY without software control. The RM recommends clearing this bit on a synchronous endpoint.
    bit_offset: 2
    bit_size: 1
  - name: EOB_MODE
    description: This bit is 1, and when a short packet or DP(PP=0) is received,. clearing all CHAIN_EN will result in an NRDY response to the subsequent DPH;  Software reconfiguration required.
    bit_offset: 3
    bit_size: 1
  - name: TOUT_MODE
    description: This bit is 1, and when a continuous burst packet is received,. PP=1 and not a short packet is not received, and DPH is not received after the timeout, resulting in TOUT_IF interrupt.
    bit_offset: 4
    bit_size: 1
  - name: FIFO_CFG
    description: Access offset address 0xC~0xF, and the operation object.
    bit_offset: 5
    bit_size: 1
  - name: FIFO_MODE
    description: If the bit is 1, the current endpoint uses FIFO mode,. and the start and end addresses of the FIFO should be configured before the bit is 1.
    bit_offset: 6
    bit_size: 1
  - name: CHAIN_AUTO
    description: CHAIN automatically switches modes, and this mode is recommended.
    bit_offset: 7
    bit_size: 1
fieldset/EP_RX_CHAIN_CR:
  description: Endpoint n receive CHAIN control register.
  bit_size: 8
  fields:
  - name: RET_SEL
    description: When the FORCE_RET is valid, this bit indicates the returned CHAIN status and configuration.
    bit_offset: 0
    bit_size: 2
  - name: FORCE_RET
    description: This bit effectively forces the return of the selected CHAIN state machine configuration.
    bit_offset: 2
    bit_size: 1
  - name: CUR_CFG
    description: The chain serial number of the current configuration.
    bit_offset: 4
    bit_size: 2
  - name: CUR_USE
    description: The CHAIN serial number currently in use.
    bit_offset: 6
    bit_size: 2
fieldset/EP_RX_CHAIN_LEN:
  description: Endpoint n CHAIN receive packet length.
  bit_size: 16
  fields:
  - name: LEN
    description: The length of the last packet received by the CHAIN.
    bit_offset: 0
    bit_size: 11
fieldset/EP_RX_CHAIN_ST:
  description: Endpoint n receive CHAIN status register.
  bit_size: 8
  fields:
  - name: CHAIN_NO
    description: The serial number of the CHAIN that is currently interrupting.
    bit_offset: 0
    bit_size: 2
  - name: DPH_PP
    description: The status of the PP bits in the currently received DPH.
    bit_offset: 2
    bit_size: 1
  - name: NUMP_EMPTY
    description: IF THE NUMP IN THE CHAIN IS 0, THE POSITION IS 1.
    bit_offset: 3
    bit_size: 1
  - name: LPF_FLAG
    description: Only the synchronous downhaul endpoint is used to currently receive the LPF status in the DPH.
    bit_offset: 5
    bit_size: 1
  - name: CHAIN_IF
    description: This bit is only written, and 1 is written to release the current CHAIN_IF.
    bit_offset: 6
    bit_size: 1
  - name: CHAIN_EN
    description: The currently used CHAIN enables the automatic hardware setting of 1 after the UEP_CHAIN_NUMP register is configured,. and the CHAIN is automatically cleared to zero after the transmission is completed.
    bit_offset: 7
    bit_size: 1
fieldset/EP_RX_CR:
  description: Endpoint n receive control register.
  bit_size: 8
  fields:
  - name: ERDY_NUMP
    description: The nump field of ERDY-TP is sent by the hardware,. and the value is generally set to the number of supported bursts.  For example, if you support 16 bursts, the value of this field is 16.
    bit_offset: 0
    bit_size: 5
  - name: CHAIN_CLR
    description: Write 1 clears all CHAIN configuration values and statuses.
    bit_offset: 5
    bit_size: 1
  - name: CLR
    description: Write 1 clears all configuration values and status of the endpoint, except for UEP_CFG.
    bit_offset: 6
    bit_size: 1
  - name: HALT
    description: Endpoint Stop, High Validity, Endpoint Stop Answering STALL to DPH.
    bit_offset: 7
    bit_size: 1
fieldset/EP_RX_SEQ:
  description: Endpoint n receive sequence number register.
  bit_size: 8
  fields:
  - name: SEQ_NUM
    description: The current serial number of the endpoint,. writable in non-SEQ_AUTO mode,  read-only in SEQ_AUTO mode.
    bit_offset: 0
    bit_size: 5
fieldset/EP_RX_ST:
  description: Endpoint n receive status register.
  bit_size: 8
  fields:
  - name: CHAIN_EN
    description: The CHAIN enabled state, which corresponds to 4 independent CHAINS.
    bit_offset: 0
    bit_size: 4
  - name: CHAIN_RES
    description: CHAIN response state, corresponding to 4 separate CHAINS.
    bit_offset: 4
    bit_size: 1
  - name: ERDY_REQ
    description: Indicates that the ERDY is currently being sent;. Writing 1 to that bit will send ERDY, which is used in non-ERDY_AUTO mode.
    bit_offset: 5
    bit_size: 1
  - name: FC_ST
    description: The endpoint is in the current throttling state, and write 1 is cleared to zero.
    bit_offset: 6
    bit_size: 1
  - name: INT_FLAG
    description: The current break flag for the endpoint, the bit is read-only,. and all CHAIN_IF are 0 if the bit is 0, otherwise it is 1.
    bit_offset: 7
    bit_size: 1
fieldset/EP_TX_CFG:
  description: Endpoint n transmit configuration register.
  bit_size: 8
  fields:
  - name: ISO_MODE
    description: A value of 1 indicates that the current endpoint is a synchronous endpoint.
    bit_offset: 0
    bit_size: 1
  - name: SEQ_AUTO
    description: '1: software cannot write SEQ_NUM, hardware maintains it. 0: software may write SEQ_NUM.'
    bit_offset: 1
    bit_size: 1
  - name: ERDY_AUTO
    description: ERDY automatic mode, the hardware sends ERDY without software control. The RM recommends clearing this bit on a synchronous endpoint.
    bit_offset: 2
    bit_size: 1
  - name: EOB_MODE
    description: If a short packet is sent, EOB/LPF=0 in ACK-TP;If a short packet is sent, EOB/LPF=1 in ACK-TP.
    bit_offset: 3
    bit_size: 1
  - name: FIFO_CFG
    description: Access offset address 0xC~0xF, and the operation object.
    bit_offset: 5
    bit_size: 1
  - name: FIFO_MODE
    description: If the bit is 1, the current endpoint uses FIFO mode,. and the start and end addresses of the FIFO should be configured before the bit is 1.
    bit_offset: 6
    bit_size: 1
  - name: CHAIN_AUTO
    description: CHAIN automatically switches modes, and this mode is recommended.
    bit_offset: 7
    bit_size: 1
fieldset/EP_TX_CHAIN_CR:
  description: Endpoint n transmit CHAIN control register.
  bit_size: 8
  fields:
  - name: RET_SEL
    description: When the FORCE_RET is valid, this bit indicates the returned CHAIN status and configuration.
    bit_offset: 0
    bit_size: 2
  - name: FORCE_RET
    description: This bit effectively forces the return of the selected CHAIN state machine configuration.
    bit_offset: 2
    bit_size: 1
  - name: CUR_CFG
    description: The chain serial number of the current configuration.
    bit_offset: 4
    bit_size: 2
  - name: CUR_USE
    description: The CHAIN serial number currently in use.
    bit_offset: 6
    bit_size: 2
fieldset/EP_TX_CHAIN_LEN:
  description: Endpoint n CHAIN transmit packet length.
  bit_size: 16
  fields:
  - name: LEN
    description: The length of the last packet sent by the CHAIN.
    bit_offset: 0
    bit_size: 11
fieldset/EP_TX_CHAIN_ST:
  description: Endpoint n transmit CHAIN status register.
  bit_size: 8
  fields:
  - name: CHAIN_NO
    description: The serial number of the CHAIN that is currently interrupting.
    bit_offset: 0
    bit_size: 2
  - name: DPH_PP
    description: The status of the PP bits in the currently received DPH.
    bit_offset: 2
    bit_size: 1
  - name: NUMP_EMPTY
    description: IF THE NUMP IN THE CHAIN IS 0, THE POSITION IS 1.
    bit_offset: 3
    bit_size: 1
  - name: EOB_LPF
    description: EOB/LPF bits in the last packet of DPH in the current CHAIN.
    bit_offset: 5
    bit_size: 1
  - name: CHAIN_IF
    description: This bit is only written, and 1 is written to release the current CHAIN_IF.
    bit_offset: 6
    bit_size: 1
  - name: CHAIN_EN
    description: The currently used CHAIN enables the automatic hardware setting of 1 after the UEP_CHAIN_NUMP register is configured,. and the CHAIN is automatically cleared to zero after the transmission is completed.
    bit_offset: 7
    bit_size: 1
fieldset/EP_TX_CR:
  description: Endpoint n transmit control register.
  bit_size: 8
  fields:
  - name: ERDY_NUMP
    description: The nump field of ERDY-TP is sent by the hardware,. and the value is generally set to the number of supported bursts.  For example, if you support 16 bursts, the value of this field is 16.
    bit_offset: 0
    bit_size: 5
  - name: CHAIN_CLR
    description: Write 1 clears all CHAIN configuration values and statuses.
    bit_offset: 5
    bit_size: 1
  - name: CLR
    description: Write 1 clears all configuration values and status of the endpoint, except for UEP_CFG.
    bit_offset: 6
    bit_size: 1
  - name: HALT
    description: Endpoint Stop, High Validity, Endpoint Stop Answering STALL to DPH.
    bit_offset: 7
    bit_size: 1
fieldset/EP_TX_SEQ:
  description: Endpoint n transmit sequence number register.
  bit_size: 8
  fields:
  - name: SEQ_NUM
    description: The current serial number of the endpoint,. writable in non-SEQ_AUTO mode,  read-only in SEQ_AUTO mode.
    bit_offset: 0
    bit_size: 5
fieldset/EP_TX_ST:
  description: Endpoint n transmit status register.
  bit_size: 8
  fields:
  - name: CHAIN_EN
    description: The CHAIN enabled state, which corresponds to 4 independent CHAINS.
    bit_offset: 0
    bit_size: 4
  - name: CHAIN_RES
    description: CHAIN response state, corresponding to 4 separate CHAINS.
    bit_offset: 4
    bit_size: 1
  - name: ERDY_REQ
    description: Indicates that the ERDY is currently being sent;. Writing 1 to that bit will send ERDY, which is used in non-ERDY_AUTO mode.
    bit_offset: 5
    bit_size: 1
  - name: FC_ST
    description: The endpoint is in the current throttling state, and write 1 is cleared to zero.
    bit_offset: 6
    bit_size: 1
  - name: INT_FLAG
    description: The current break flag for the endpoint, the bit is read-only,. and all CHAIN_IF are 0 if the bit is 0, otherwise it is 1.
    bit_offset: 7
    bit_size: 1
fieldset/HOST_RX_FC_STATUS:
  description: The host endpoint receives the flow control register.
  bit_size: 16
  fields:
  - name: EP_RX_FC
    description: The flow control status of the host to receiving endpoints 1-15.
    bit_offset: 1
    bit_size: 1
    array:
      len: 15
      stride: 1
fieldset/HOST_RX_NUMP:
  description: The host receives the NUMP register.
  bit_size: 16
  fields:
  - name: UH_RX_NUMP
    description: The number of packets that the host expects to receive,. if it is a synchronous transmission, will automatically subtract 1 from the hardware for each packet it receives.
    bit_offset: 0
    bit_size: 8
  - name: UH_RX_DPP_NUM
    description: The number of DPPs that have been accepted by the host.
    bit_offset: 8
    bit_size: 8
fieldset/HOST_STATUS:
  description: Host Status Registers.
  fields:
  - name: UH_RX_ERDY_EP
    description: ERDY is received from the device, and the segment represents the endpoint number of the device ERDY.
    bit_offset: 4
    bit_size: 4
  - name: UH_RX_ERDY_NUMP
    description: ERDY received from the device,. which indicates the number of packets that can be sent/received by the device's corresponding endpoint.
    bit_offset: 8
    bit_size: 5
  - name: UH_RX_ERDY_DIR
    description: ERDY is received from the device, and the segment represents the direction of the endpoint.
    bit_offset: 15
    bit_size: 1
  - name: UH_RX_EOB_LPF
    description: This bit represents the EOB/LPF status in the received packet.
