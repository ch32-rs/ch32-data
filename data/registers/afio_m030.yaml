block/AFIO:
  description: Alternate function I/O.
  items:
  - name: PCFR1
    description: AF remap and debug I/O configuration register (AFIO_PCFR1).
    byte_offset: 4
    fieldset: PCFR1
  - name: EXTICR
    description: External interrupt configuration register (AFIO_EXTICR).
    byte_offset: 8
    fieldset: EXTICR
fieldset/EXTICR:
  description: External interrupt configuration register (AFIO_EXTICR).
  fields:
  - name: EXTI
    description: EXTI line configuration (00=PA, 01=PB, 10=PC).
    bit_offset: 0
    bit_size: 2
    array:
      len: 16
      stride: 2
fieldset/PCFR1:
  description: AF remap and debug I/O configuration register (AFIO_PCFR1).
  fields:
  - name: I2C1_RM
    description: I2C1 remapping.
    bit_offset: 0
    bit_size: 2
  - name: UART1_RM
    description: UART1 remapping.
    bit_offset: 2
    bit_size: 3
  - name: SPI1_RM
    description: SPI1 remapping.
    bit_offset: 5
    bit_size: 2
  - name: TIM1_RM
    description: TIM1 remapping.
    bit_offset: 7
    bit_size: 3
  - name: TIM2_RM
    description: TIM2 remapping.
    bit_offset: 10
    bit_size: 2
  - name: TIM3_RM
    description: TIM3 remapping.
    bit_offset: 12
    bit_size: 3
  - name: ADC_ETRGIN_RM
    description: ADC External trigger injected conversion remapping.
    bit_offset: 15
    bit_size: 1
  - name: PB5PB6_RM
    description: PB5 and PB6 remapping.
    bit_offset: 16
    bit_size: 1
  - name: HO_DIO_EN0
