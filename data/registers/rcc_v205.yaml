      description: PB2 peripheral clock enable register (RCC_PB2PCENR).
      byte_offset: 24
      fieldset: PB2PCENR
    - name: PB1PCENR
      description: PB1 peripheral clock enable register (RCC_PB1PCENR).
      byte_offset: 28
      fieldset: PB1PCENR
    - name: BDCTLR
      description: Backup domain control register (RCC_BDCTLR).
      byte_offset: 32
      fieldset: BDCTLR
    - name: RSTSCKR
      description: Control/status register (RCC_RSTSCKR).
      byte_offset: 36
      fieldset: RSTSCKR
    - name: HBRSTR
      description: HB reset register (RCC_HBPRSTR).
      byte_offset: 40
      fieldset: HBRSTR
    - name: CFGR2
      description: Clock configuration register2 (RCC_CFGR2).
      byte_offset: 44
      fieldset: CFGR2
