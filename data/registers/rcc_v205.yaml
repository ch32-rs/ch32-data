      description: HSI selected as system clock.
      value: 0b00
    - name: HSE
      description: HSE selected as system clock.
      value: 0b01
    - name: PLL
      description: PLL selected as system clock.
      value: 0b10
enum/HPRE:
  description: HB prescaler.
  bit_size: 4
  variants:
    - name: DIV1
      description: SYSCLK not divided.
      value: 0b0000
    - name: DIV2
      description: SYSCLK divided by 2.
      value: 0b1000
    - name: DIV4
      description: SYSCLK divided by 4.
      value: 0b1001
    - name: DIV8
      description: SYSCLK divided by 8.
      value: 0b1010
    - name: DIV16
      description: SYSCLK divided by 16.
      value: 0b1011
    - name: DIV64
      description: SYSCLK divided by 64.
      value: 0b1100
    - name: DIV128
      description: SYSCLK divided by 128.
      value: 0b1101
    - name: DIV256
      description: SYSCLK divided by 256.
      value: 0b1110
    - name: DIV512
      description: SYSCLK divided by 512.
      value: 0b1111
enum/PPRE:
  description: PB Low speed prescaler (PB1).
  bit_size: 3
  variants:
    - name: DIV1
      description: HCLK not divided.
      value: 0b000
    - name: DIV2
      description: HCLK divided by 2.
      value: 0b100
    - name: DIV4
      description: HCLK divided by 4.
      value: 0b101
    - name: DIV8
      description: HCLK divided by 8.
      value: 0b110
    - name: DIV16
      description: HCLK divided by 16.
      value: 0b111
enum/ADCPRE:
  description: ADC prescaler.
  bit_size: 2
  variants:
    - name: DIV2
      description: PCLK2 divided by 2.
      value: 0b00
    - name: DIV4
      description: PCLK2 divided by 4.
      value: 0b01
    - name: DIV6
      description: PCLK2 divided by 6.
      value: 0b10
    - name: DIV8
      description: PCLK2 divided by 8.
      value: 0b11
enum/ADCSRC:
  description: ADC clock source.
  bit_size: 2
  variants:
    - name: HCLK_DIV2
      description: HCLK divided by 2.
      value: 0b00
    - name: HCLK
      description: HCLK.
      value: 0b01
    - name: USBHS_PLL_DIV5
      description: USBHS PLL clock divided by 5.
      value: 0b10
    - name: USBHS_PLL_DIV6
      description: USBHS PLL clock divided by 6.
      value: 0b11
enum/RTCSEL:
  description: RTC clock source selection.
  bit_size: 2
  variants:
    - name: NO_CLK
      description: No clock.
      value: 0b00
    - name: LSE
      description: LSE oscillator clock used as RTC clock.
      value: 0b01
    - name: LSI
      description: LSI oscillator clock used as RTC clock.
      value: 0b10
    - name: HSE
      description: HSE oscillator clock divided by 128 used as RTC clock.
      value: 0b11
enum/MCO:
  description: Microcontroller clock output.
  bit_size: 3
  variants:
    - name: NO_CLK
      description: No clock.
      value: 0b000
    - name: SYSCLK
      description: SYSCLK selected.
      value: 0b100
    - name: HSI
      description: HSI selected.
      value: 0b101
    - name: HSE
      description: HSE selected.
      value: 0b110
    - name: PLL_DIV2
      description: PLL clock divided by 2.
      value: 0b111
enum/USBPRE:
  description: USB prescaler.
  bit_size: 3
  variants:
    - name: DIV1
      description: PLL clock divided by 1(PLLCLK=48MHz).
      value: 0b000
    - name: DIV2
      description: PLL clock divided by 2(PLLCLK=96MHz).
      value: 0b001
    - name: DIV3
      description: PLL clock divided by 3(PLLCLK=144MHz).
      value: 0b010
    - name: DIV4
      description: PLL clock divided by 4(PLLCLK=192MHz).
      value: 0b011
    - name: DIV1_5
      description: PLL clock divided by 1.5(PLLCLK=72MHz).
      value: 0b100
    - name: DIV2_5
      description: PLL clock divided by 2.5(PLLCLK=120MHz).
      value: 0b101
    - name: DIV3_5
      description: PLL clock divided by 3.5(PLLCLK=168MHz).
      value: 0b110
