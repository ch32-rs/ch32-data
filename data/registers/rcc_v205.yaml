      byte_offset: 4
      fieldset: CFGR0
    - name: INTR
      description: Clock interrupt register (RCC_INTR).
      byte_offset: 8
      fieldset: INTR
    - name: PB2PRSTR
      description: PB2 peripheral reset register (RCC_PB2PRSTR).
      byte_offset: 12
      fieldset: PB2PRSTR
    - name: PB1PRSTR
      description: PB1 peripheral reset register (RCC_PB1PRSTR).
      byte_offset: 16
      fieldset: PB1PRSTR
    - name: HBPCENR
      description: HB Peripheral Clock enable register (RCC_HBPCENR).
      byte_offset: 20
      fieldset: HBPCENR
