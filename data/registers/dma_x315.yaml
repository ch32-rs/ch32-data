fieldset/CFGR:
  description: DMA channel configuration register (DMA_CFGR).
  fields:
  - name: EN
    description: Channel enable.
    bit_offset: 0
    bit_size: 1
  - name: TCIE
    description: Transfer complete interrupt enable.
    bit_offset: 1
    bit_size: 1
  - name: HTIE
    description: Half Transfer interrupt enable.
    bit_offset: 2
    bit_size: 1
  - name: TEIE
    description: Transfer error interrupt enable.
    bit_offset: 3
    bit_size: 1
  - name: DIR
    description: Data transfer direction.
    bit_offset: 4
    bit_size: 1
  - name: CIRC
    description: Circular mode.
    bit_offset: 5
    bit_size: 1
  - name: PINC
    description: Peripheral increment mode.
    bit_offset: 6
    bit_size: 1
  - name: MINC
    description: Memory increment mode.
    bit_offset: 7
    bit_size: 1
  - name: PSIZE
    description: Peripheral size.
    bit_offset: 8
    bit_size: 2
  - name: MSIZE
    description: Memory size.
    bit_offset: 10
    bit_size: 2
  - name: PL
    description: Channel Priority level.
    bit_offset: 12
    bit_size: 2
  - name: MEM2MEM
    description: Memory to memory mode.
    bit_offset: 14
    bit_size: 1
  - name: DOUBLE_MODE
    description: Double buffer mode enable bit.
    bit_offset: 15
    bit_size: 1
  - name: FLAG_CUR_MEM
    description: Memory address selection setting.
    bit_offset: 16
    bit_size: 1
fieldset/CNTR:
  description: DMA channel 1 number of data register.
  fields:
  - name: NDT
    description: Number of data to transfer.
    bit_offset: 0
    bit_size: 16
block/CH:
  description: 'Channel cluster: CFGR, CNTR, PADDR, MADDR and M1ADDR registers.'
  items:
  - name: CFGR
    description: DMA channel configuration register.
    byte_offset: 0
    fieldset: CFGR
  - name: CNTR
    description: DMA channel number of data register.
    byte_offset: 4
    fieldset: CNTR
  - name: PADDR
    description: DMA channel peripheral address register.
    byte_offset: 8
  - name: MADDR
    description: DMA channel memory address register.
    byte_offset: 12
  - name: M1ADDR
    description: DMA channel second memory address register.
    byte_offset: 16
