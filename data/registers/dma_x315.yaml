    description: Channel enable.
    bit_offset: 0
    bit_size: 1
  - name: TCIE
    description: Transfer complete interrupt enable.
    bit_offset: 1
    bit_size: 1
  - name: HTIE
    description: Half Transfer interrupt enable.
    bit_offset: 2
    bit_size: 1
  - name: TEIE
    description: Transfer error interrupt enable.
    bit_offset: 3
    bit_size: 1
  - name: DIR
    description: Data transfer direction.
    bit_offset: 4
    bit_size: 1
  - name: CIRC
    description: Circular mode.
    bit_offset: 5
    bit_size: 1
  - name: PINC
    description: Peripheral increment mode.
    bit_offset: 6
    bit_size: 1
  - name: MINC
    description: Memory increment mode.
    bit_offset: 7
    bit_size: 1
  - name: PSIZE
    description: Peripheral size.
    bit_offset: 8
    bit_size: 2
  - name: MSIZE
    description: Memory size.
    bit_offset: 10
    bit_size: 2
  - name: PL
    description: Channel Priority level.
    bit_offset: 12
    bit_size: 2
  - name: MEM2MEM
    description: Memory to memory mode.
    bit_offset: 14
    bit_size: 1
