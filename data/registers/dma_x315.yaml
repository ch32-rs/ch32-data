block/DMA1:
  description: DMA1 controller (11 channels).
  items:
  - name: INTFR
    description: DMA interrupt status register (DMA_INTFR).
    byte_offset: 0
    access: Read
    fieldset: INTFR
  - name: INTFCR
    description: DMA interrupt flag clear register (DMA_INTFCR).
    byte_offset: 4
    access: Write
    fieldset: INTFR
  - name: CH
    description: 'Channel cluster: CFGR, CNTR, PADDR, MADDR and M1ADDR registers.'
    byte_offset: 8
    array:
      len: 11
      stride: 20
    block: CH
  - name: EXTEM_INTFR
    description: DMA extends the interrupt status register.
    byte_offset: 228
    access: Read
    fieldset: EXTEM_INTFR
  - name: EXTEM_INTFCR
    description: DMA extends the interrupt flag clear register.
    byte_offset: 232
    access: Write
    fieldset: EXTEM_INTFR
fieldset/EXTEM_INTFR:
  description: DMA extends the interrupt status register.
  fields:
  - name: GIF9
    description: Channel 9 Global interrupt flag.
    bit_offset: 0
    bit_size: 1
  - name: TCIF9
    description: Channel 9 Transfer Complete flag.
    bit_offset: 1
    bit_size: 1
  - name: HTIF9
    description: Channel 9 Half Transfer Complete flag.
    bit_offset: 2
    bit_size: 1
  - name: TEIF9
    description: Channel 9 Transfer Error flag.
    bit_offset: 3
    bit_size: 1
  - name: GIF10
