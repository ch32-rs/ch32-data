block/CAN:
  description: Controller area network.
  items:
  - name: CTLR
    description: CAN Master control register.
    byte_offset: 0
    fieldset: CTLR
  - name: STATR
    description: CAN master status register.
    byte_offset: 4
    fieldset: STATR
  - name: TSTATR
    description: CAN transmit status register.
    byte_offset: 8
    fieldset: TSTATR
  - name: RFIFO0
    description: CAN receive FIFO 0 register.
    byte_offset: 12
    fieldset: RFIFO0
  - name: RFIFO1
    description: CAN receive FIFO 1 register.
    byte_offset: 16
    fieldset: RFIFO1
  - name: INTENR
    description: CAN interrupt enable register.
    byte_offset: 20
    fieldset: INTENR
  - name: ERRSR
    description: CAN error status register.
    byte_offset: 24
    fieldset: ERRSR
  - name: BTIMR
    description: CAN bit timing register.
    byte_offset: 28
    fieldset: BTIMR
  - name: TTCTLR
    description: CAN time trigger control register.
    byte_offset: 32
    fieldset: TTCTLR
  - name: TTCNT
    description: CAN Time Trigger Count Value Register.
    byte_offset: 36
    fieldset: TTCNT
  - name: TERR_CNT
    description: CAN offline recovery error counter.
    byte_offset: 40
    fieldset: TERR_CNT
  - name: TXMIR
    description: CAN TX mailbox identifier register.
    byte_offset: 384
    array:
      len: 3
      stride: 16
    fieldset: TXMIR
  - name: TXMDTR
    description: CAN mailbox data length control and time stamp register.
    byte_offset: 388
    array:
      len: 3
      stride: 16
    fieldset: TXMDTR
  - name: TXMDLR
    description: CAN mailbox data low register.
    byte_offset: 392
    array:
      len: 3
      stride: 16
    fieldset: TXMDLR
  - name: TXMDHR
    description: CAN mailbox data high register.
    byte_offset: 396
    array:
      len: 3
      stride: 16
    fieldset: TXMDHR
  - name: RXMIR
    description: CAN receive FIFO mailbox identifier register.
    byte_offset: 432
    array:
      len: 2
      stride: 16
    fieldset: RXMIR
  - name: RXMDTR
    description: CAN receive FIFO mailbox data length control and time stamp register.
    byte_offset: 436
    array:
      len: 2
      stride: 16
    fieldset: RXMDTR
  - name: RXMDLR
    description: CAN receive FIFO mailbox data low register.
    byte_offset: 440
    array:
      len: 2
      stride: 16
    fieldset: RXMDLR
    access: Read
  - name: RXMDHR
    description: CAN receive FIFO mailbox data high register.
    byte_offset: 444
    array:
      len: 2
      stride: 16
    fieldset: RXMDHR
    access: Read
  - name: FCTLR
    description: CAN filter master register.
    byte_offset: 512
    fieldset: FCTLR
  - name: FMCFGR
    description: CAN filter mode register.
    byte_offset: 516
    fieldset: FMCFGR
  - name: FSCFGR
    description: CAN filter scale register.
    byte_offset: 524
    fieldset: FSCFGR
  - name: FAFIFOR
    description: CAN filter FIFO assignment register.
    byte_offset: 532
    fieldset: FAFIFOR
  - name: FWR
    description: CAN filter activation register.
    byte_offset: 540
    fieldset: FWR
  - name: FR
    description: Filter bank registers (14 banks, 2 words each).
    byte_offset: 576
    array:
      len: 28
      stride: 4
    fieldset: FR
fieldset/BTIMR:
  description: CAN bit timing register.
  fields:
  - name: BRP
    description: minimum time unit length setting value.
    bit_offset: 0
    bit_size: 10
  - name: BTR_TS1_T
    description: CLAS_LONG_TS1=0;TS1 is TS[3:0](4bit);CLAS_LONG_TS1=1,TS1 is.  TS[1:0]+BTR_TS1_T[15:12](6bit).
    bit_offset: 12
    bit_size: 4
  - name: TS1
    description: Time segment 1.
    bit_offset: 16
    bit_size: 4
  - name: TS2
    description: Time segment 2.
    bit_offset: 20
    bit_size: 4
  - name: SJW
    description: Resynchronization jump width.
    bit_offset: 24
    bit_size: 4
  - name: LBKM
    description: Loop back mode (debug).
    bit_offset: 30
    bit_size: 1
  - name: SILM
    description: Silent mode (debug).
    bit_offset: 31
    bit_size: 1
fieldset/CTLR:
  description: CAN Master control register.
  fields:
  - name: INRQ
    description: Initialization request.
    bit_offset: 0
    bit_size: 1
  - name: SLEEP
    description: Sleep mode request bit.
    bit_offset: 1
    bit_size: 1
  - name: TXFP
    description: Transmit FIFO priority.
    bit_offset: 2
    bit_size: 1
  - name: RFLM
    description: Receive FIFO locked mode.
    bit_offset: 3
    bit_size: 1
  - name: NART
    description: No automatic retransmission.
    bit_offset: 4
    bit_size: 1
  - name: AWUM
    description: Automatic wakeup mode.
    bit_offset: 5
    bit_size: 1
  - name: ABOM
    description: Automatic bus-off management.
    bit_offset: 6
    bit_size: 1
  - name: TTCM
    description: Time triggered communication mode.
    bit_offset: 7
    bit_size: 1
  - name: RST
    description: Software master reset.
    bit_offset: 15
    bit_size: 1
  - name: DBF
    description: Debug freeze.
    bit_offset: 16
    bit_size: 1
fieldset/ERRSR:
