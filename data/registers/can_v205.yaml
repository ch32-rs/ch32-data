fieldset/BTIMR:
  description: CAN bit timing register.
  fields:
  - name: BRP
    description: minimum time unit length setting value.
    bit_offset: 0
    bit_size: 10
  - name: BTR_TS1_T
    description: CLAS_LONG_TS1=0;TS1 is TS[3:0](4bit);CLAS_LONG_TS1=1,TS1 is.  TS[1:0]+BTR_TS1_T[15:12](6bit).
    bit_offset: 12
    bit_size: 4
  - name: TS1
    description: Time segment 1.
    bit_offset: 16
    bit_size: 4
  - name: TS2
    description: Time segment 2.
    bit_offset: 20
    bit_size: 4
  - name: SJW
    description: Resynchronization jump width.
    bit_offset: 24
    bit_size: 4
  - name: LBKM
    description: Loop back mode (debug).
    bit_offset: 30
    bit_size: 1
  - name: SILM
    description: Silent mode (debug).
    bit_offset: 31
    bit_size: 1
fieldset/CTLR:
  description: CAN Master control register.
  fields:
  - name: INRQ
    description: Initialization request.
    bit_offset: 0
    bit_size: 1
  - name: SLEEP
    description: Sleep mode request bit.
    bit_offset: 1
    bit_size: 1
  - name: TXFP
    description: Transmit FIFO priority.
    bit_offset: 2
    bit_size: 1
  - name: RFLM
    description: Receive FIFO locked mode.
    bit_offset: 3
    bit_size: 1
  - name: NART
    description: No automatic retransmission.
    bit_offset: 4
    bit_size: 1
  - name: AWUM
    description: Automatic wakeup mode.
    bit_offset: 5
    bit_size: 1
  - name: ABOM
    description: Automatic bus-off management.
    bit_offset: 6
    bit_size: 1
  - name: TTCM
    description: Time triggered communication mode.
    bit_offset: 7
    bit_size: 1
  - name: RST
    description: Software master reset.
    bit_offset: 15
    bit_size: 1
  - name: DBF
    description: Debug freeze.
    bit_offset: 16
    bit_size: 1
fieldset/ERRSR:
  description: CAN error status register.
  fields:
  - name: EWGF
    description: Error warning flag.
    bit_offset: 0
    bit_size: 1
  - name: EPVF
    description: Error passive flag.
    bit_offset: 1
    bit_size: 1
  - name: BOFF
    description: Bus-off flag.
    bit_offset: 2
    bit_size: 1
  - name: LEC
    description: Last error code.
    bit_offset: 4
    bit_size: 3
  - name: TEC
    description: Least significant byte of the 9-bit transmit error counter.
    bit_offset: 16
    bit_size: 8
  - name: REC
    description: Receive error counter.
    bit_offset: 24
    bit_size: 8
