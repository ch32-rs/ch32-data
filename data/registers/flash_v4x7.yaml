# CH32V407 / CH32V467 flash interface (CH32V407RM §32).
#
# Derived from flash_v3.yaml. The register map is unchanged; the control
# register differs:
#   * the fast program bit is FTPG at bit 16, and there is no separate
#     fast-erase bit at bit 17 (PER covers 4 KB sectors);
#   * only a 32 KB block erase (BER32) exists — no BER64 and no BOOT-region
#     program/erase bits;
#   * SCKMOD is a two-bit flash access clock divider at bits 26:25
#     (the reset value is 0b01 = HCLK/2);
#   * OBR exposes the allocation as a single RAM_CODE_MOD bit at bit 8:
#     1 = 576 KB code + 136 KB RAM, 0 = 512 KB code + 200 KB RAM.

block/FLASH:
  description: FLASH.
  items:
  - name: KEYR
    description: Flash key register.
    byte_offset: 4
    access: Write
    fieldset: KEYR
  - name: OBKEYR
    description: Flash option key register.
    byte_offset: 8
    access: Write
    fieldset: OBKEYR
  - name: STATR
    description: Status register.
    byte_offset: 12
    fieldset: STATR
  - name: CTLR
    description: Control register.
    byte_offset: 16
    fieldset: CTLR
  - name: ADDR
    description: Flash address register.
    byte_offset: 20
    access: Write
    fieldset: ADDR
  - name: OBR
    description: Option byte register.
    byte_offset: 28
    access: Read
    fieldset: OBR
  - name: WPR
    description: Write protection register.
    byte_offset: 32
    access: Read
    fieldset: WPR
  - name: MODEKEYR
    description: Mode select register.
    byte_offset: 36
    access: Write
    fieldset: MODEKEYR
fieldset/ADDR:
  description: Flash address register.
  fields:
  - name: FAR
    description: Flash Address.
    bit_offset: 0
    bit_size: 32
fieldset/CTLR:
  description: Control register.
  fields:
  - name: PG
    description: Programming.
    bit_offset: 0
    bit_size: 1
  - name: PER
    description: Page Erase.
    bit_offset: 1
    bit_size: 1
  - name: MER
    description: Mass Erase.
    bit_offset: 2
    bit_size: 1
  - name: OBPG
    description: Option byte programming.
    bit_offset: 4
    bit_size: 1
  - name: OBER
    description: Option byte erase.
    bit_offset: 5
    bit_size: 1
  - name: STRT
    description: Start.
    bit_offset: 6
    bit_size: 1
  - name: LOCK
    description: Lock.
    bit_offset: 7
    bit_size: 1
  - name: OBWRE
    description: Option bytes write enable.
    bit_offset: 9
    bit_size: 1
  - name: ERRIE
    description: Error interrupt enable.
    bit_offset: 10
    bit_size: 1
  - name: EOPIE
    description: End of operation interrupt enable.
    bit_offset: 12
    bit_size: 1
  - name: FLOCK
    description: Fast programmable lock.
    bit_offset: 15
    bit_size: 1
  - name: FTPG
    description: Fast page programming.
    bit_offset: 16
    bit_size: 1
  - name: BER32
    description: Block Erase 32K.
    bit_offset: 18
    bit_size: 1
  - name: PGSTRT
    description: Page Programming Start. Set to start a fast page programming operation; cleared by hardware.
    bit_offset: 21
    bit_size: 1
  - name: RSENACT
    description: Reset Flash Enhance read mode.
    bit_offset: 22
    bit_size: 1
  - name: EHMOD
    description: Flash enhanced read mode.
    bit_offset: 24
    bit_size: 1
  - name: SCKMOD
    description: Flash access clock configuration - 0b00 HCLK, 0b01 HCLK/2, 0b10 HCLK/4. The flash access clock must not exceed 100 MHz.
    bit_offset: 25
    bit_size: 2
fieldset/KEYR:
  description: Flash key register.
  fields:
  - name: KEYR
    description: FPEC key.
    bit_offset: 0
    bit_size: 32
fieldset/MODEKEYR:
  description: Mode select register.
  fields:
  - name: MODEKEYR
    description: Mode select.
    bit_offset: 0
    bit_size: 32
fieldset/OBKEYR:
  description: Flash option key register.
  fields:
  - name: OBTKEY
    description: Option byte key.
    bit_offset: 0
    bit_size: 32
fieldset/OBR:
  description: Option byte register — read-only mirror of the Option Bytes loaded from flash at reset.
  fields:
  - name: OBERR
    description: Option byte integrity error — a value/complement pair did not match when loading.
    bit_offset: 0
    bit_size: 1
  - name: RDPRT
    description: Read protection is currently active.
    bit_offset: 1
    bit_size: 1
  - name: IWDG_SW
    description: Independent watchdog start mode currently in effect.
    bit_offset: 2
    bit_size: 1
    enum: IwdgMode
  - name: STOP_RST
    description: Stop-mode reset behavior currently in effect.
    bit_offset: 3
    bit_size: 1
    enum: PowerModeReset
  - name: STANDY_RST
    description: Standby-mode reset behavior currently in effect.
    bit_offset: 4
    bit_size: 1
    enum: PowerModeReset
  - name: RAM_CODE_MOD
    description: SRAM/CODE allocation currently in effect.
    bit_offset: 8
    bit_size: 1
    enum: RamCodeMode
fieldset/STATR:
  description: Status register.
  fields:
  - name: BSY
    description: Busy.
    bit_offset: 0
    bit_size: 1
  - name: WR_BSY
    description: Quick page programming.
    bit_offset: 1
    bit_size: 1
  - name: WRPRTERR
    description: Write protection error.
    bit_offset: 4
    bit_size: 1
  - name: EOP
    description: End of operation.
    bit_offset: 5
    bit_size: 1
  - name: ENHANCE_MOD_STA
    description: Enhance mode start.
    bit_offset: 7
    bit_size: 1
fieldset/WPR:
  description: Write protection register.
  fields:
  - name: WRP
    description: Write protect.
    bit_offset: 0
    bit_size: 32
enum/IwdgMode:
  description: When the independent watchdog turns on after reset.
  bit_size: 1
  variants:
    - name: HARDWARE
      description: Watchdog starts automatically at power-on.
      value: 0
    - name: SOFTWARE
      description: Watchdog stays off until software enables it.
      value: 1
enum/RamCodeMode:
  description: SRAM/CODE memory allocation.
  bit_size: 1
  variants:
    - name: C512_R200
      description: 512 KB code + 200 KB RAM.
      value: 0
    - name: C576_R136
      description: 576 KB code + 136 KB RAM.
      value: 1
enum/PowerModeReset:
  description: Whether entering a low-power mode triggers a system reset.
  bit_size: 1
  variants:
    - name: RESET
      description: Reset the chip on entering the mode.
      value: 0
    - name: NO_RESET
      description: Keep running on entering the mode.
      value: 1
