fieldset/CSTAR0:
  description: PFIC kernel status register 0.
  fields:
  - name: CPU_nest_sta_0
    description: The nested status register of kernel C0 interrupts is used to.  query the nested state of kernel C0 interrupts. nest_sta bits from the INEST_CTLR register of the CSR register.
    bit_offset: 0
    bit_size: 8
  - name: CPU_irq_active_0
    description: Kernel C0 interrupt active flag register,.  which is used to query whether kernel C0 is processing interrupts.
    bit_offset: 8
    bit_size: 1
  - name: CPU_irq_pend_0
    description: Kernel C0 interrupt pending flag register, which is used to query kernel C1 for unhandled interrupts.
    bit_offset: 9
    bit_size: 1
  - name: CPU_globl_ie_0
    description: The kernel C0 global interrupt enable register is used to.  query whether the kernel C0 global interrupt is enabled.
    bit_offset: 11
    bit_size: 1
  - name: CPU_dbg_mode_0
    description: Kernel C0 debug mode register, which is used to query whether kernel C0 is in debug mode.
    bit_offset: 12
    bit_size: 1
  - name: CPU_lock_up_0
    description: The kernel C0 lock status register is used to query whether kernel C0 is in the locked state.
    bit_offset: 13
    bit_size: 1
  - name: CPU_ex_state_0
    description: The kernel C0 status register is used to obtain the running state of kernel C0.
    bit_offset: 14
    bit_size: 2
