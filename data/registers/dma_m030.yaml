block/DMA:
  description: DMA controller (7 channels).
  items:
  - name: INTFR
    description: DMA interrupt status register (DMA_INTFR).
    byte_offset: 0
    access: Read
    fieldset: INTFR
  - name: INTFCR
    description: DMA interrupt flag clear register (DMA_INTFCR).
    byte_offset: 4
    access: Write
    fieldset: INTFCR
  - name: CH
    description: 'Channel cluster: CFGR, CNTR, PADDR and MADDR registers.'
    byte_offset: 8
    array:
      len: 7
      stride: 20
    block: CH
