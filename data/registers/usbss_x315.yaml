fieldset/CTRL:
  description: Flash capecity register.
  fields:
  - name: DMA_EN
    description: Enable DMA.
    bit_offset: 0
    bit_size: 1
  - name: USB_CLR_ALL
    description: Reset all software configuration registers, high efficiency, need software clearing.
    bit_offset: 1
    bit_size: 1
  - name: FORCE_RST
    description: To reset the protocol layer and FIFO module, software clearing is required.
    bit_offset: 2
    bit_size: 1
  - name: DMA_MODE
    description: When performing burst DPH transmission, the operation of the next packet.
    bit_offset: 3
    bit_size: 1
  - name: SETUP_FLOW
    description: SETUP Transaction Flow Control.
    bit_offset: 5
    bit_size: 1
  - name: TX_ERDY_MODE
    description: Use in device mode.
    bit_offset: 14
    bit_size: 1
  - name: UIE_TRANSFER
    description: USB transaction completion interrupt enabled.
    bit_offset: 16
    bit_size: 1
  - name: UDIE_SETUP
    description: 'Device mode: Receive SETUP transaction to complete interrupt enablement.'
    bit_offset: 17
    bit_size: 1
  - name: UDIE_STATUS
    description: 'Device mode: Receive STATUS transaction to complete interrupt enable.'
    bit_offset: 18
    bit_size: 1
  - name: UIE_RX_PING
    description: Receive PING-TP to complete the interrupt enablement.
    bit_offset: 19
    bit_size: 1
  - name: UIE_ITP
    description: Send ITP to complete interrupt enable.
    bit_offset: 20
    bit_size: 1
  - name: UIE_FIFO_TXOV
    description: Sending FIFO Overflow Interrupt Enabled.
    bit_offset: 22
    bit_size: 1
  - name: UIE_FIFO_RXOV
    description: Receive FIFO overflow interrupt enable.
    bit_offset: 23
    bit_size: 1
  - name: DEV_ADDR
    description: The address of the USB device.
    bit_offset: 24
    bit_size: 1
fieldset/ITP:
  description: The Interval register for the ITP package in USB.
  fields:
  - name: REG_ITP_INTERVAL
    description: The Bus interval Counter field in the received ITP.
    bit_offset: 0
    bit_size: 14
fieldset/ITP_ADJ:
  description: Interval adaptive registers for ITP packets in USB.
  fields:
  - name: ITP_ADJ_CR
    description: In device mode, the Bus Interval Adjustment Control field in the received ITP.
    bit_offset: 0
    bit_size: 7
  - name: ITP_DELAYED
    description: In device mode, the delayed bit of the Link Control Word in the received ITP is 1 when the ITP is delayed.
    bit_offset: 7
    bit_size: 1
  - name: ITP_DELTA
    description: The high 13bit (delta) of ITS in the ITP received in device mode represents the time difference from.  the start of the current ITP packet to the boundary of the previous bus interval.
    bit_offset: 8
    bit_size: 13
fieldset/LINK_CFG:
  description: LINK Configuration Register.
  fields:
  - name: LINK_DOWN_MODE
    description: Peripheral Type.
    bit_offset: 0
    bit_size: 1
  - name: LINK_RX_TERM_EN
    description: Receiving terminal resistance control.
    bit_offset: 1
    bit_size: 1
  - name: LINK_SS_PLR_SWAP
    description: Swap SSTX and SSRX polarity as follows.
    bit_offset: 2
    bit_size: 1
  - name: LINK_PHY_RESET
    description: PIPE Interface Reset.
    bit_offset: 3
    bit_size: 1
  - name: LINK_COMPLIANCE_EN
    description: POLLING_LFPS whether the timeout enters COMPLIANCE mode.
    bit_offset: 4
    bit_size: 1
  - name: LINK_LFPS_RX_PD
    description: LFPS receive control, where the bit 1 indicates that LFPS receive is disabled.
    bit_offset: 5
    bit_size: 1
  - name: LINK_RX_EQ_EN
    description: Receiver equalization enables control, protocol specifics are optional.
    bit_offset: 6
    bit_size: 1
  - name: LINK_TX_SWING
    description: Transmitter signal swing control, low swing power consumption, but affect the transmission distance.
    bit_offset: 7
    bit_size: 1
  - name: LINK_TX_DEEMPH
    description: Transmitter De-Emphasis control.
    bit_offset: 8
    bit_size: 2
  - name: LINK_CP78_SEL
    description: In Compliance Pattern 7/8, send a length of consecutive 0 or consecutive 1.
    bit_offset: 10
    bit_size: 2
  - name: LINK_U2_DET_EN
    description: Detection method of connected devices in U2 state.
    bit_offset: 12
    bit_size: 1
  - name: LINK_LOOPBACK_EN
    description: Allow to enter the LOOPBACK enable bit, high efficiency, use with the LOOKBACK enable in TX/RX_TS_CFG [3], both are valid,.  LINK can enter the LOOKBACK mode (used to enable the LOOPBACK slave data loop and error counting, the LOOPBACK host maintains 0).
    bit_offset: 13
    bit_size: 1
  - name: LINK_LOOKBACK_ACT
