fieldset/LINK_CTRL:
  description: LINK Control Register.
  fields:
  - name: LINK_PD_MODE
    description: Configure the current power mode of the PHY, corresponding to PO/P1/P2/P3 in the PIPE.
    bit_offset: 0
    bit_size: 2
  - name: LINK_GO_DISABLED
    description: RW Set LINK to SS.DISABLED, which is highly effective and requires software to clear it.. If the hardware automatically goes to SS.DIABLED, then the bit is automatically set to 1 by the hardware.  In device mode, if the USB2.0 bus reset is received, the software should first set the PD_MODE to P2 mode, and then clear this bit,  LTSSM will automatically enter the SS.RX_DETECT, the device will be detected 8 times (every 12ms), if no TERM is detected, it will enter the DISABLE state,  and communicate in USB2.0 mode at the same time.  In host mode, a BUS_RESET signal should be sent through the USB2.0 controller, the software should first set the PD_MODE to P2 mode,  then clear this bit, and if a TERM is detected, a POLLING_LFPS handshake will be made.  Otherwise, the software should set the power mode to P3 and communicate in USB2.0 mode.
    bit_offset: 4
    bit_size: 1
  - name: LINK_GO_INACTIVE
    description: Set LINK to SS.INACTIVE, high efficiency, hardware automatic clearing.
    bit_offset: 5
    bit_size: 1
  - name: LINK_GO_RECOVERY
    description: Set the LINK to SS.RECOVERY, which is highly effective and the hardware is automatically cleared.
    bit_offset: 6
    bit_size: 1
  - name: LINK_GO_RX_DET
    description: Before setting this bit, the PD_MODE should be set to P2 mode, and the LINK should be set to enter the SS.RX_DETECT,.  and the software query TERM_PRESENT know whether there is a connection or whether the connection is disconnected.   High effectiveness, automatic clearing.
    bit_offset: 7
    bit_size: 1
  - name: LINK_TX_WARM_RST
    description: 'High effectiveness, cleared by software. This bit is valid and will send WARM_RESET.. In device mode: After detecting that the host has continuously sent WARM_RESET for 18 ms,  the device controller will automatically declare that it has detected WARM_RESET and reset it.'
    bit_offset: 8
    bit_size: 1
  - name: LINK_TX_UX_EXIT
    description: High efficiency, hardware automatic clearing.
    bit_offset: 9
    bit_size: 1
  - name: LINK_U3_WKUP_EN
    description: Receive U3 exti LPFS signal enable.
    bit_offset: 10
    bit_size: 1
  - name: LINK_POLLING_EN
    description: High validity, if the SS.RX_DETECT detects the TERM, the POLLING handshake will be performed after the software sets the bit to be valid.
    bit_offset: 12
    bit_size: 1
  - name: LINK_TX_LGO_U1
    description: After the bit is valid, it will send LGO_U1, high efficiency, and the hardware will be automatically cleared.. If the other party responds with LXU, it indicates that it refuses to enter U1 mode;  If the query LINK status is U1, it indicates that the other party accepts to enter the U1 low-power state,  and the software should change the current power mode to P1.
    bit_offset: 13
    bit_size: 1
  - name: LINK_TX_LGO_U2
    description: After the bit is valid, it will send LGO_U2, high efficiency, and the hardware will be automatically cleared;. If the other party responds with LXU, it indicates that it refuses to enter the U2 state;  If the query LINK status is U2, it indicates that the other party accepts to enter the U2 low-power state,  and the software should change the current power mode to P2.
    bit_offset: 14
    bit_size: 1
  - name: LINK_TX_LGO_U3
    description: After the bit is valid, it will be sent LGO_U3, high effectiveness, and the hardware will be automatically cleared.
    bit_offset: 15
    bit_size: 1
  - name: LINK_TX_TS_CFG
    description: Link Configuration for Sending TS1/TS2 Training Sequences.
    bit_offset: 16
    bit_size: 8
