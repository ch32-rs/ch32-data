  - name: EP_RX_ERDY_NUMP
    description: The hardware sends the NUMP field of ERDY-TP,.  and the general configuration value is the number of bursts supported.   For example, if you support level 16 bursts, the field is configured to be 16.
    bit_offset: 0
    bit_size: 5
  - name: EP_RX_CHAIN_CLR
    description: Write 1 to clear all CHAIN configuration values and statuses.
    bit_offset: 5
    bit_size: 1
  - name: EP_RX_CLR
    description: Write 1 to clear all configuration values and states of the endpoint, except for UEP_CFG.
    bit_offset: 6
    bit_size: 1
  - name: EP_RX_HALT
    description: Endpoint stop, high efficiency, endpoint stop response STALL to DPH.
    bit_offset: 7
    bit_size: 1
fieldset/UEP4_RX_DMA:
  description: DMA start address of Endpoint 4.
  fields:
  - name: CHAIN_DMA_BA
    description: 'In normal mode:. The DMA start address of the CHAIN receiving data.  In FIFO mode:  The FIFO start address is 16~23 bits of the mapping address in SRAM;  The FIFO ends 16~23 bits of the mapped address in SRAM.'
    bit_offset: 0
    bit_size: 32
fieldset/UEP4_RX_DMA_OFS:
  description: DMA offset length of Endpoint 4.
  fields:
  - name: CHAIN_DMA_OFS
    description: The offset address of the DPP in the CHAIN.
    bit_offset: 0
    bit_size: 16
fieldset/UEP4_RX_SEQ:
  description: Endpoint 4 serial number register.
  fields:
  - name: EP_RX_SEQ_NUM
    description: The current serial number of the endpoint is writable in non-SEQ_AUTO mode and read-only in SEQ_AUTO mode.
    bit_offset: 0
    bit_size: 5
fieldset/UEP4_RX_ST:
  description: Endpoint 4 state register.
  fields:
  - name: EP_RX_CHAIN_EN
    description: CHAIN enabled state, corresponding to 4 independent CHAINs.
    bit_offset: 0
    bit_size: 4
  - name: EP_RX_CHAIN_RES
    description: CHAIN response state, corresponding to 4 independent CHAINs.
    bit_offset: 4
    bit_size: 1
  - name: EP_RX_ERDY_REQ
    description: It indicates that it is currently in the sending ERDY;. Writing 1 to that bit will send ERDY, used in non-ERDY_AUTO mode.
    bit_offset: 5
    bit_size: 1
  - name: EP_RX_FC_ST
    description: The endpoint is currently in the flow control state, write 1 to clear it.
    bit_offset: 6
    bit_size: 1
  - name: EP_RX_INT_FLAG
    description: The endpoint is currently interrupted, the bit is read-only, and if all CHAIN_IF is 0, the bit is 0, otherwise it is 1.
    bit_offset: 7
    bit_size: 1
fieldset/UEP4_TX_CFG:
  description: Endpoint 4 configures the registers.
  fields:
  - name: EP_TX_ISO_MODE
    description: 1 means that the current endpoint is a synchronous endpoint.
    bit_offset: 0
    bit_size: 1
  - name: EP_TX_SEQ_AUTO
    description: Allow the software to write R16_EPn_ST->EP_SEQ_NUM.
    bit_offset: 1
    bit_size: 1
  - name: EP_TX_ERDY_AUTO
    description: ERDY automatic mode, the hardware will send ERDY, no software control required;.  The synchronous endpoint recommends clearing the bit.
    bit_offset: 2
    bit_size: 1
  - name: EP_TX_EOB_MODE
    description: If a short packet is sent, then EOB/LPF in ACK-TP.
    bit_offset: 3
    bit_size: 1
  - name: EP_TX_FIFO_CFG
    description: The object being operated on when the access offset address is 0xC~0xF.
    bit_offset: 5
    bit_size: 1
  - name: EP_TX_FIFO_MODE
    description: A bit of 1 indicates that the current endpoint is using the FIFO mode,.  and the start and end addresses of the FIFO should be configured before the bit is 1.
    bit_offset: 6
    bit_size: 1
  - name: EP_TX_CHAIN_AUTO
    description: CHAIN automatically switches mode, this mode is recommended.
    bit_offset: 7
    bit_size: 1
fieldset/UEP4_TX_CHAIN_CR:
  description: Endpoint 4 CHAIN control register.
  fields:
  - name: TX_RET_SEL
    description: When the FORCE_RET is valid, this bit indicates the returned CHAIN state and configuration.
    bit_offset: 0
    bit_size: 2
  - name: TX_FORCE_RET
    description: This bit effectively forces the return of the selected CHAIN state machine configuration.
    bit_offset: 2
    bit_size: 1
  - name: TX_CUR_CFG
    description: The currently configured CHAIN serial number.
    bit_offset: 4
    bit_size: 2
  - name: TX_CUR_USE
    description: The CHAIN serial number currently in use.
    bit_offset: 6
    bit_size: 2
fieldset/UEP4_TX_CHAIN_EXP_NUMP:
  description: Number of NUMPs expected to be sent by Endpoint 4.
  fields:
  - name: TX_CHAIN_EXP_NUMP
    description: The number of DPP packets that can be sent by the CHAIN that has been completed.
    bit_offset: 0
    bit_size: 8
fieldset/UEP4_TX_CHAIN_LEN:
  description: Endpoint 4 CHAIN sends the last packet length.
  fields:
  - name: CHAIN_TX_LEN
    description: The CHAIN sends the length of the last packet.
    bit_offset: 0
    bit_size: 11
fieldset/UEP4_TX_CHAIN_NUMP:
  description: Number of NUMPs sent by Endpoint 4.
  fields:
  - name: TX_CHAIN_NUMP
    description: The number of DPP packets that have been transmitted; When the CHIN_EN is 0,.  the register is automatically cleared at the same time as the UEP_CHAIN_NUMP is written.
    bit_offset: 0
    bit_size: 8
fieldset/UEP4_TX_CHAIN_ST:
  description: Endpoint 4 CHAIN status register.
  fields:
  - name: TX_CHAIN_NO
    description: The CHAIN serial number that is currently generating the outage.
    bit_offset: 0
    bit_size: 2
  - name: TX_DPH_PP
    description: The current status of the PP bit in the DPH.
    bit_offset: 2
    bit_size: 1
  - name: TX_NUMP_EMPTY
    description: If the NUMP in the current CHAIN is 0, then the position is 1.
    bit_offset: 3
    bit_size: 1
  - name: TX_EOB_LPF
    description: The EOB/LPF bits in the last pack of DPH of the current CHAIN.
    bit_offset: 5
    bit_size: 1
  - name: TX_CHAIN_IF
    description: The bit is only written, write 1 to release the current CHAIN_IF;. The current CHAIN NUMP_EMPTY is 1 to cause this outage.
    bit_offset: 6
    bit_size: 1
  - name: TX_CHAIN_EN
    description: The currently used CHAIN enables the hardware to.  automatically set 1 after the UEP_CHAIN_NUMP register is configured, and the CHAIN is automatically cleared   after the transmission is completed.
    bit_offset: 7
    bit_size: 1
