    bit_size: 1
  - name: EP_RX_NRDY_MODE
    description: This bit is 1, and when a short packet or DPH (PP=0) is received,.  all CHAIN_EN are cleared, which will cause the DPH to respond to NRDY.   Software reconfiguration required.
    bit_offset: 3
    bit_size: 1
  - name: EP_RX_TOUT_MODE
