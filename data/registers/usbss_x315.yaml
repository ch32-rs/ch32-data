fieldset/STATUS:
  description: USBSS Status Register.
  fields:
  - name: UIF_TRANSFER
    description: USB transaction completion interrupt flag bit.
    bit_offset: 0
    bit_size: 1
  - name: UDIF_SETUP
    description: 'Device mode: Receives the SETUP transaction completion interrupt flag bit.'
    bit_offset: 1
    bit_size: 1
  - name: UDIF_STATUS
    description: 'Device mode: Receives the STATUS transaction to complete the interrupt flag.'
    bit_offset: 2
    bit_size: 1
  - name: UIF_RX_PING
    description: Receive PING-TP completion interrupt flag bit.
    bit_offset: 3
    bit_size: 1
  - name: UIF_ITP
    description: Send ITP completion interrupt flag bit.
    bit_offset: 4
    bit_size: 1
  - name: UIF_FIFO_TXOV
    description: Send FIFO overflow interrupt flag bits.
    bit_offset: 6
    bit_size: 1
  - name: UIF_FIFO_RXOV
    description: Receive FIFO overflow interrupt flag bits.
    bit_offset: 7
    bit_size: 1
  - name: EP_ID
    description: 'If multiple endpoints have an interrupt flag at the same time,.  the priority order is as follows (high-> low): Synchronous transmission > control transmission>block   transmission/interrupted transmission, the smaller the endpoint number of the same endpoint type,   the higher the priority.'
    bit_offset: 8
    bit_size: 3
  - name: EP_DIR
    description: If the transmission and reception have an interrupt flag.  at the same time, the bit is 1, which prioritizes transmission   (SETUP/STATUS independent interrupt).
    bit_offset: 12
    bit_size: 1
fieldset/UEP0_RX_CTRL:
  description: Endpoint 0 Receives Control Register.
  fields:
  - name: EP0_RX_LEN
    description: The endpoint receives the length register.
    bit_offset: 0
    bit_size: 11
  - name: EP0_RX_SEQ
    description: The serial number that the endpoint expects to receive.
    bit_offset: 16
    bit_size: 5
  - name: EP0_RX_RES
    description: Response to DPH.
    bit_offset: 21
    bit_size: 2
  - name: EP0_RX_ERDY
    description: The bit writes 1, sends ERDY, and the hardware of the bit is automatically cleared after the ERDY is sent.
    bit_offset: 23
    bit_size: 1
  - name: EP0_RX_PP
    description: The PP bit in the received DPH.
    bit_offset: 24
    bit_size: 1
  - name: UIF_EP0_RX_ACT
    description: The downstream transaction completes the interrupt flag,.  the software writes 0 to clear zero, and the hardware sets it to 1.
    bit_offset: 31
    bit_size: 1
fieldset/UEP0_TX_CTRL:
  description: Endpoint 0 Transmit Control Register.
  fields:
  - name: EP0_TX_LEN
    description: The endpoint sends length registers with a maximum value of 512B.
    bit_offset: 0
    bit_size: 11
  - name: EP0_TX_SEQ
    description: The current sequence number of the endpoint is automatically cleared after receiving the SETUP transaction.
    bit_offset: 16
    bit_size: 5
  - name: EP0_TX_RES
    description: Response to ACK-TP.
    bit_offset: 21
    bit_size: 2
  - name: EP0_TX_ERDY
