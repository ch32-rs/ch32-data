fieldset/UDEV_CTRL__UHOST_CTRL:
  description: USB device/host physical prot control.
  bit_size: 8
  fields:
  - name: UH_PORT_EN__UD_PORT_EN
    description: 'enable USB port: 0=disable, 1=enable port, automatic disabled if USB device detached.'
    bit_offset: 0
    bit_size: 1
  - name: UH_BUS_RESET__UD_GP_BIT
    description: force clear FIFO and count of USB.
    bit_offset: 1
    bit_size: 1
  - name: UH_LOW_SPEED__UD_LOW_SPEED
    description: 'enable USB port low speed: 0=full speed, 1=low speed.'
    bit_offset: 2
    bit_size: 1
  - name: UH_DM_PIN__UD_DM_PIN
    description: 'ReadOnly: indicate current UDM pin level.'
    bit_offset: 4
    bit_size: 1
  - name: UH_DP_PIN__UD_DP_PIN
    description: USB device enable and internal pullup resistance enable.
    bit_offset: 5
    bit_size: 1
  - name: UH_PD_DIS__UD_PD_DIS
    description: 'disable USB UDP/UDM pulldown resistance: 0=enable pulldown, 1=disable.'
    bit_offset: 7
    bit_size: 1
fieldset/UEP0_R_CTRL:
  description: endpoint 0 control.
  bit_size: 8
  fields:
  - name: MASK_UEP_R_RES
    description: bit mask of handshake response type for USB endpoint X receiving (OUT).
    bit_offset: 0
    bit_size: 2
  - name: UEP_R_TOG
    description: 'expected data toggle flag of USB endpoint X receiving (OUT): 0=DATA0, 1=DATA1.'
    bit_offset: 2
    bit_size: 1
  - name: UEP_AUTO_TOG
    description: 'enable automatic toggle after successful transfer completion on endpoint 1/2/3: 0=manual toggle, 1=automatic toggle.'
