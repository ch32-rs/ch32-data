# OPA + CMP2 on CH32V005/V006. CMP2 is hard-wired to OPA1 output; CMP1 hardware is absent.
# V005 additionally lacks OPA polling (RM ch.17 intro); polling fields in the OPA register block read as reserved on V005.
- name: OPA
  address: 0x40024000
  registers:
    kind: opa
    version: v00x
    block: OPA
  interrupts:
    - { signal: "GLOBAL", interrupt: "OPCM" }
  pins:
    # OPA1 positive inputs (PSEL1)
    - { pin: "PA2", signal: "CHP0" }
    - { pin: "PD7", signal: "CHP1" }
    - { pin: "PD3", signal: "CHP2" }
    - { pin: "PD1", signal: "CHP3" }
    # OPA1 negative inputs (NSEL1)
    - { pin: "PA1", signal: "CHN0" }
    - { pin: "PD0", signal: "CHN1" }
    - { pin: "PA4", signal: "CHN2" }
    # OPA1 outputs (MODE1)
    - { pin: "PD4", signal: "OUT0" }
    - { pin: "PA5", signal: "OUT1" }
