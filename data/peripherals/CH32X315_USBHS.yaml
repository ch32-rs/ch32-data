- name: USBHS
  address: 0x40030000
  registers:
    kind: usbhs
    version: x315
    block: USB
  rcc:
    bus_clock: HCLK
    kernel_clock: USBHSPLLCLK
    enable:
      register: HBPCENR
      field: USBHSEN
    reset:
      register: HBRSTR
      field: USBHSRST
  interrupts:
  - signal: GLOBAL
    interrupt: USBHS
  - signal: WAKEUP
    interrupt: USBHS_WKUP
