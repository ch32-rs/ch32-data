- name: ARGB
  address: 0x40025000
  registers:
    kind: argb
    version: x315
    block: ARGB
  rcc:
    bus_clock: HCLK
    kernel_clock: HCLK
    enable:
      register: HBPCENR
      field: ARGBEN
    reset:
      register: HBRSTR
      field: ARGBRST
  interrupts:
  - signal: GLOBAL
    interrupt: ARGB
