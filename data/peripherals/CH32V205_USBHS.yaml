- name: USBHS
  address: 0x40023400
  registers:
    kind: usbhs
    version: v4x7
    block: USB
  rcc:
    bus_clock: HCLK
    kernel_clock: USBHSPLLCLK
    enable:
      register: HBPCENR
      field: USBHSEN
    reset:
      register: HBRSTR
      field: USBHSRST
  interrupts:
  - signal: GLOBAL
    interrupt: USBHS
  - signal: WAKEUP
    interrupt: USBHS_WKUP
  pins:
  - pin: PB6
    signal: DP
  - pin: PB7
    signal: DM
