# SPI1..SPI3 on CH32V407/CH32V467 (datasheet V1.3 table 2-3-5).
#
# SPI2 and SPI3 double as I2S2 and I2S3. SPI1 has no I2S divider at 0x20, so
# spi_v4x7 models the union of the three instances and all three use it.

- name: SPI1
  address: 0x40013000
  registers:
    kind: spi
    version: v4x7
    block: SPI
  rcc:
    bus_clock: PCLK2
    kernel_clock: PCLK2
    enable:
      register: PB2PCENR
      field: SPI1EN
    reset:
      register: PB2PRSTR
      field: SPI1RST
  remap:
    register: PCFR1
    field: SPI1_RM
  interrupts:
    - signal: GLOBAL
      interrupt: SPI1
  pins:
    # 0: default (NSS/PA4, SCK/PA5, MISO/PA6, MOSI/PA7)
    - { pin: "PA4", signal: "NSS", remap: 0 }
    - { pin: "PA5", signal: "SCK", remap: 0 }
    - { pin: "PA6", signal: "MISO", remap: 0 }
    - { pin: "PA7", signal: "MOSI", remap: 0 }
    # 1: remapped (NSS/PA15, SCK/PB3, MISO/PB4, MOSI/PB5)
    - { pin: "PA15", signal: "NSS", remap: 1 }
    - { pin: "PB3", signal: "SCK", remap: 1 }
    - { pin: "PB4", signal: "MISO", remap: 1 }
    - { pin: "PB5", signal: "MOSI", remap: 1 }

# No remap on SPI2.
- name: SPI2
  address: 0x40003800
  registers:
    kind: spi
    version: v4x7
    block: SPI
  rcc:
    bus_clock: PCLK1
    kernel_clock: PCLK1
    enable:
      register: PB1PCENR
      field: SPI2EN
    reset:
      register: PB1PRSTR
      field: SPI2RST
  interrupts:
    - signal: GLOBAL
      interrupt: SPI2
  pins:
    - { pin: "PB12", signal: "NSS" }
    - { pin: "PB13", signal: "SCK" }
    - { pin: "PB14", signal: "MISO" }
    - { pin: "PB15", signal: "MOSI" }
    # I2S2
    - { pin: "PB12", signal: "WS" }
    - { pin: "PB13", signal: "CK" }
    - { pin: "PB15", signal: "SD" }
    - { pin: "PC6", signal: "MCK" }

- name: SPI3
  address: 0x40003C00
  registers:
    kind: spi
    version: v4x7
    block: SPI
  rcc:
    bus_clock: PCLK1
    kernel_clock: PCLK1
    enable:
      register: PB1PCENR
      field: SPI3EN
    reset:
      register: PB1PRSTR
      field: SPI3RST
  remap:
    register: PCFR1
    field: SPI3_RM
  interrupts:
    - signal: GLOBAL
      interrupt: SPI3
  pins:
    # 0: default (NSS/PA15, SCK/PB3, MISO/PB4, MOSI/PB5)
    - { pin: "PA15", signal: "NSS", remap: 0 }
    - { pin: "PB3", signal: "SCK", remap: 0 }
    - { pin: "PB4", signal: "MISO", remap: 0 }
    - { pin: "PB5", signal: "MOSI", remap: 0 }
    # I2S3, default mapping
    - { pin: "PA15", signal: "WS", remap: 0 }
    - { pin: "PB3", signal: "CK", remap: 0 }
    - { pin: "PB5", signal: "SD", remap: 0 }
    - { pin: "PC7", signal: "MCK", remap: 0 }
    # 1: remapped (NSS/PA4, SCK/PC10, MISO/PC11, MOSI/PC12)
    - { pin: "PA4", signal: "NSS", remap: 1 }
    - { pin: "PC10", signal: "SCK", remap: 1 }
    - { pin: "PC11", signal: "MISO", remap: 1 }
    - { pin: "PC12", signal: "MOSI", remap: 1 }
    # I2S3, remapped mapping
    - { pin: "PA4", signal: "WS", remap: 1 }
    - { pin: "PC10", signal: "CK", remap: 1 }
    - { pin: "PC12", signal: "SD", remap: 1 }
    - { pin: "PC7", signal: "MCK", remap: 1 }
