- name: ADC2
  address: 0x40012800
  registers:
    kind: adc
    version: x315
    block: ADC
  rcc:
    bus_clock: PCLK2
    kernel_clock: ADC
    enable:
      register: HB2PCENR
      field: ADC2EN
    reset:
      register: HB2PRSTR
      field: ADC2RST
  interrupts:
  - signal: GLOBAL
    interrupt: ADC2
