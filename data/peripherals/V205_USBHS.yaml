# CH32V205 USBHS. The controller is at 0x40023400 and has no dedicated reset
# bit in RCC_HBRSTR (RM 3.4.11 lists only USBPDRST/USBFSRST/FSMCRST/PIOCRST/
# QSPI1RST), so no reset is declared here.
#
# Only the base block is attached (repo-wide pattern); USB_DEVICE/USB_HOST in
# usbhs_v4x7 are not instantiated as peripherals. Host registers are at
# 0x40023500: EVT ch32v205.h sets USBHS_BASE=0x40023400 and USBHSH_BASE=+0x100,
# and the SVD puts UH_CFG at offset 0x100. The 0x40030100 in RM table 22-2 is
# the CH32H417/X315 base (their USBHS is at 0x40030000).
- name: USBHS
  address: 1073886208
  registers:
    kind: usbhs
    version: v4x7
    block: USB
  rcc:
    bus_clock: HCLK
    kernel_clock: USBHSPLLCLK
    enable:
      register: HBPCENR
      field: USBHSEN
  interrupts:
  - signal: GLOBAL
    interrupt: USBHS
  - signal: WAKEUP
    interrupt: USBHS_WKUP
  pins:
  - pin: PB6
    signal: DP
  - pin: PB7
    signal: DM
