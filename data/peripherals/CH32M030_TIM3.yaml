- name: TIM3
  address: 0x40000400
  registers:
    kind: timer
    version: m030
    block: GPTM3
  rcc:
    bus_clock: PCLK1
    kernel_clock: PCLK1
    enable:
      register: PB1PCENR
      field: TIM3EN
    reset:
      register: PB1PRSTR
      field: TIM3RST
  interrupts:
  - signal: GLOBAL
    interrupt: TIM3
