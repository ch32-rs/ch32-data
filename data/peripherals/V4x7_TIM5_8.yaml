# TIM5, TIM6, TIM7 and TIM8 on CH32V407/CH32V467 (datasheet V1.3 table 2-3-3).
#
# TIM6/TIM7 are the two basic timers (BCTM block, update interrupt only).
# TIM8 is the second advanced timer; its remap lives in AFIO_PCFR2.

- name: TIM5
  address: 0x40000C00
  registers:
    kind: timer
    version: v4x7
    block: GPTM
  rcc:
    bus_clock: PCLK1_TIM
    kernel_clock: PCLK1
    enable:
      register: PB1PCENR
      field: TIM5EN
    reset:
      register: PB1PRSTR
      field: TIM5RST
  interrupts:
    - signal: UP
      interrupt: TIM5
    - signal: TRG
      interrupt: TIM5
    - signal: CC
      interrupt: TIM5
  pins:
    - { pin: "PA0", signal: "CH1" }
    - { pin: "PA1", signal: "CH2" }
    - { pin: "PA2", signal: "CH3" }
    - { pin: "PA3", signal: "CH4" }
    # CH4 can be driven from LSI when AFIO_PCFR1 TIM5CH4_RM = 1

- name: TIM6
  address: 0x40001000
  registers:
    kind: timer
    version: v4x7
    block: BCTM
  rcc:
    bus_clock: PCLK1_TIM
    kernel_clock: PCLK1
    enable:
      register: PB1PCENR
      field: TIM6EN
    reset:
      register: PB1PRSTR
      field: TIM6RST
  interrupts:
    - signal: UP
      interrupt: TIM6

- name: TIM7
  address: 0x40001400
  registers:
    kind: timer
    version: v4x7
    block: BCTM
  rcc:
    bus_clock: PCLK1_TIM
    kernel_clock: PCLK1
    enable:
      register: PB1PCENR
      field: TIM7EN
    reset:
      register: PB1PRSTR
      field: TIM7RST
  interrupts:
    - signal: UP
      interrupt: TIM7

- name: TIM8
  address: 0x40013400
  registers:
    kind: timer
    version: v4x7
    block: ADTM
  rcc:
    bus_clock: PCLK2_TIM
    kernel_clock: PCLK2
    enable:
      register: PB2PCENR
      field: TIM8EN
    reset:
      register: PB2PRSTR
      field: TIM8RST
  remap:
    register: PCFR2
    field: TIM8_RM
  interrupts:
    - signal: BRK
      interrupt: TIM8_BRK
    - signal: UP
      interrupt: TIM8_UP
    - signal: TRG
      interrupt: TIM8_TRG_COM
    - signal: COM
      interrupt: TIM8_TRG_COM
    - signal: CC
      interrupt: TIM8_CC
  pins:
    # 0: default (ETR/PA0, CH1/PC6, CH2/PC7, CH3/PC8, CH4/PC9,
    #    BKIN/PA6, CH1N/PA7, CH2N/PB0, CH3N/PB1)
    - { pin: "PA0", signal: "ETR", remap: 0 }
    - { pin: "PC6", signal: "CH1", remap: 0 }
    - { pin: "PC7", signal: "CH2", remap: 0 }
    - { pin: "PC8", signal: "CH3", remap: 0 }
    - { pin: "PC9", signal: "CH4", remap: 0 }
    - { pin: "PA6", signal: "BKIN", remap: 0 }
    - { pin: "PA7", signal: "CH1N", remap: 0 }
    - { pin: "PB0", signal: "CH2N", remap: 0 }
    - { pin: "PB1", signal: "CH3N", remap: 0 }
    # 1: remapped (ETR/PA0, CH1/PB6, CH2/PB7, CH3/PB8, CH4/PC13,
    #    BKIN/PB9, CH1N/PA13, CH2N/PA14, CH3N/PA15)
    - { pin: "PA0", signal: "ETR", remap: 1 }
    - { pin: "PB6", signal: "CH1", remap: 1 }
    - { pin: "PB7", signal: "CH2", remap: 1 }
    - { pin: "PB8", signal: "CH3", remap: 1 }
    - { pin: "PC13", signal: "CH4", remap: 1 }
    - { pin: "PB9", signal: "BKIN", remap: 1 }
    - { pin: "PA13", signal: "CH1N", remap: 1 }
    - { pin: "PA14", signal: "CH2N", remap: 1 }
    - { pin: "PA15", signal: "CH3N", remap: 1 }
