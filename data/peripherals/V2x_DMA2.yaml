    - signal: CH3
      interrupt: DMA2_Channel3
    - signal: CH4
      interrupt: DMA2_Channel4
    - signal: CH5
      interrupt: DMA2_Channel5
    - signal: CH6
      interrupt: DMA2_Channel6
    - signal: CH7
      interrupt: DMA2_Channel7
    - signal: CH8
      interrupt: DMA2_Channel8
