# USBFS of the CH32V303, without OTG cfg registers. The V20x one is FV2x_USBFS_PB6.yaml.
- name: USBFS
  address: 0x50000000
  registers:
    kind: usb
    version: v2fs
    block: USB
  rcc:
    bus_clock: HCLK
    kernel_clock: HCLK
    enable:
      register: AHBPCENR
      field: OTG_EN
  interrupts:
    - signal: GLOBAL
      interrupt: OTG_FS
  pins:
    - pin: PA11
      signal: DM
    - pin: PA12
      signal: DP
