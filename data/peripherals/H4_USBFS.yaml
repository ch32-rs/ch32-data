- name: USBFS
  address: 0x50000000
  registers:
    kind: usbfs
    version: h4
    block: USB_OTG_FS
  rcc:
    bus_clock: HCLK
    kernel_clock: HCLK
    enable:
      register: HBPCENR
      field: OTGFSEN
    reset:
      register: HBRSTR
      field: OTGFSRST
  interrupts:
    - signal: GLOBAL
      interrupt: USBFS
    - signal: WAKEUP
      interrupt: USBFSWakeUP
  # OTG_FS pins (PA9..PA12 dedicated, no AF — USB analog mode)
  pins:
    - pin: PA9
      signal: VBUS
    - pin: PA10
      signal: ID
    - pin: PA11
      signal: DM
    - pin: PA12
      signal: DP
