- name: ADC1
  address: 0x40012400
  registers:
    kind: adc
    version: m030
    block: ADC
  rcc:
    bus_clock: PCLK2
    kernel_clock: ADC
    enable:
      register: PB2PCENR
      field: ADCEN
    reset:
      register: PB2PRSTR
      field: ADC1RST
  interrupts:
  - signal: GLOBAL
    interrupt: ADC
