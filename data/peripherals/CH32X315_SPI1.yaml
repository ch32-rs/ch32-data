- name: SPI1
  address: 0x40013000
  registers:
    kind: spi
    version: v0
    block: SPI
  rcc:
    bus_clock: PCLK2
    kernel_clock: PCLK2
    enable:
      register: HB2PCENR
      field: SPI1EN
    reset:
      register: HB2PRSTR
      field: SPI1RST
  interrupts:
  - signal: GLOBAL
    interrupt: SPI1
