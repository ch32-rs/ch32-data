- name: USBPD
  address: 0x40024400
  registers:
    kind: usbpd
    version: h4
    block: USBPD
  rcc:
    bus_clock: HCLK
    kernel_clock: HCLK
    enable:
      register: HBPCENR
      field: USBPDEN
    reset:
      register: HBRSTR
      field: USBPDRST
  interrupts:
    - signal: GLOBAL
      interrupt: USBPD
    - signal: WAKEUP
      interrupt: USBPDWakeUP
  pins:
    - pin: PB3
      signal: CC1
      af: 4
    - pin: PB4
      signal: CC2
      af: 4
