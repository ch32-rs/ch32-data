# FSMC on CH32F203VCT6.
# NADV is on PB7. PCFR2.FSMC_NADV (bit 10) only disables the NADV output when
# set; it is not a pin-select remap. The PD2 alternative requires USBHSEN=1 and
# RB_UC_RST_SIE=0, which F203VCT6 cannot do; F207 uses FV2x_FSMC_USBHS.yaml.
- name: FSMC
  address: 0xa0000000
  registers:
    kind: fsmc
    version: v4x7
    block: FSMC
  rcc:
    bus_clock: HCLK
    kernel_clock: HCLK
    enable:
      register: AHBPCENR
      field: FSMCEN
  pins:
    - { pin: PD14, signal: D0 }
    - { pin: PD15, signal: D1 }
    - { pin: PD0, signal: D2 }
    - { pin: PD1, signal: D3 }
    - { pin: PE7, signal: D4 }
    - { pin: PE8, signal: D5 }
    - { pin: PE9, signal: D6 }
    - { pin: PE10, signal: D7 }
    - { pin: PE11, signal: D8 }
    - { pin: PE12, signal: D9 }
    - { pin: PE13, signal: D10 }
    - { pin: PE14, signal: D11 }
    - { pin: PE15, signal: D12 }
    - { pin: PD8, signal: D13 }
    - { pin: PD9, signal: D14 }
    - { pin: PD10, signal: D15 }
    - { pin: PD11, signal: A16 }
    - { pin: PD12, signal: A17 }
    - { pin: PD13, signal: A18 }
    - { pin: PE3, signal: A19 }
    - { pin: PE4, signal: A20 }
    - { pin: PE5, signal: A21 }
    - { pin: PE6, signal: A22 }
    - { pin: PE2, signal: A23 }
    - { pin: PB7, signal: NADV }
    - { pin: PD3, signal: CLK }
    - { pin: PD4, signal: NOE }
    - { pin: PD5, signal: NWE }
    - { pin: PD6, signal: NWAIT }
    - { pin: PD7, signal: NE1 }
    - { pin: PD7, signal: NCE2 }
    - { pin: PE0, signal: NBL0 }
    - { pin: PE1, signal: NBL1 }
