- name: USBPD
  address: 0x40027000
  registers:
    kind: usbpd
    version: l1
    block: USBPD
  rcc:
    bus_clock: HCLK
    kernel_clock: HCLK
    enable:
      register: HBPCENR
      field: USBPDEN
    reset:
      register: HBRSTR
      field: USBPDRST
  interrupts:
  - signal: GLOBAL
    interrupt: USBPD
  - signal: WKUP
    interrupt: USBPD_WKUP
  pins:
  - pin: PA0
    signal: CC1
    af: 7
  - pin: PA1
    signal: CC2
    af: 7
