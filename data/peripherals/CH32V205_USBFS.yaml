- name: USBFS
  address: 1342177280
  registers:
    kind: usb
    version: v2fs
    block: USB
  rcc:
    bus_clock: HCLK
    kernel_clock: HCLK
    enable:
      register: HBPCENR
      field: USBFSEN
    reset:
      register: HBRSTR
      field: USBFSRST
  interrupts:
  - signal: GLOBAL
    interrupt: USBFS
  - signal: WAKEUP
    interrupt: USBFS_WKUP
  pins:
  - pin: PA11
    signal: DM
  - pin: PA12
    signal: DP
