# Backup registers of the CH32V20x D8/D8W and CH32V30x: 42 data registers
# (CH32FV2x_V3xRM §4).

- name: BKP
  address: 0x40006C00
  registers:
    kind: bkp
    version: v3
    block: BKP
  rcc:
    bus_clock: PCLK1
    kernel_clock: PCLK1
    enable:
      register: APB1PCENR
      field: BKPEN
    reset:
      register: APB1PRSTR
      field: BKPRST
