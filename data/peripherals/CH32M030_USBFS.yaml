- name: USBFS
  address: 1073886208
  registers:
    kind: usb
    version: v2fs
    block: USB
  rcc:
    bus_clock: HCLK
    kernel_clock: HCLK
    enable:
      register: HBPCENR
      field: USBFSEN
    reset:
      register: HBRSTR
      field: USBFSRST
  interrupts:
  - signal: GLOBAL
    interrupt: USBFS
  - signal: WAKEUP
    interrupt: USBFSWakeUP
  pins:
  - pin: PB0
    signal: DP
  - pin: PB1
    signal: DM
