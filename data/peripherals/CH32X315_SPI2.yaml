- name: SPI2
  address: 0x40003800
  registers:
    kind: spi
    version: v0
    block: SPI
  rcc:
    bus_clock: PCLK1
    kernel_clock: PCLK1
    enable:
      register: HB1PCENR
      field: SPI2EN
    reset:
      register: HB1PRSTR
      field: SPI2RST
  interrupts:
  - signal: GLOBAL
    interrupt: SPI2
