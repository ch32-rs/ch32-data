- name: SPI2
  address: 0x40003800
  registers:
    kind: spi
    version: v3
    block: SPI
  rcc:
    bus_clock: PCLK1
    kernel_clock: PCLK1
    enable:
      register: APB1PCENR
      field: SPI2EN
    reset:
      register: APB1PRSTR
      field: SPI2RST
  interrupts:
    - signal: GLOBAL
      interrupt: SPI2
  # No remap
  pins:
    - pin: PB12
      signal: NSS
      remap: 0
    - pin: PB13
      signal: SCK
      remap: 0
    - pin: PB14
      signal: MISO
      remap: 0
    - pin: PB15
      signal: MOSI
      remap: 0
    # i2s
    - pin: PB12
      signal: WS
      remap: 0
    - pin: PB13
      signal: CK
      remap: 0
    - pin: PB15
      signal: SD
      remap: 0
    - pin: PC6
      signal: MCK
      remap: 0
