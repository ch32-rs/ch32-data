      signal: RX
      af: 11
    - pin: PB3
      signal: RX
      af: 11
    - pin: PE7
      signal: RX
      af: 7
    - pin: PF6
      signal: RX
      af: 7
    - pin: PA14
      signal: CK
      af: 11
    - pin: PB7
      signal: CK
      af: 10
    - pin: PE6
      signal: CK
      af: 8
    - pin: PF10
      signal: CK
      af: 7
