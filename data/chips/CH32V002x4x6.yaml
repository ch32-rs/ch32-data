# CH32V002F4P6 16K 4K 18 1 1 2 8+3 1 1 1 TSSOP20
# CH32V002F4U6 16K 4K 18 1 1 2 8+3 1 1 1 QFN20
# CH32V002A4M6 16K 4K 14 1 1 2 6+3 1 1 1 SOP16
# CH32V002D4U6 16K 4K 11 1 1 2 4+3 1 1 - QFN12
# CH32V002J4M6 16K 4K 6 1 1 2 6+3 1 1 - SOP8

name: CH32V002
family: QingKe RISC-V-based, general-purpose MCU
subfamily: General-purpose
product_type: QingKe V2/V4 core, great value version, main frequency <= 48M
packages:
  - name: CH32V002F4P6
    package: TSSOP20
    device_id: 0x00200600
  - name: CH32V002F4U6
    package: QFN20
    device_id: 0x00210600
  - name: CH32V002A4M6
    package: SOP16
    device_id: 0x00220600
  # no SPI
  - name: CH32V002D4U6
    package: QFN12
    device_id: 0x00230600
  # no SPI
  - name: CH32V002J4M6
    package: SOP8
    device_id: 0x00240600
include_memory: ../memory/CH32V00X.yaml
memory_sizes: { USR_1: 16K, RAM: 4K }
docs:
  - type: homepage
    title: Homepage
    name: "CH32V002"
    url: http://www.wch.cn/products/CH32V002.html
cores:
  - name: qingke-v2c
    arch: riscv
    peripherals: []
    include_peripherals:
      - "../family/CH32V00X.yaml"
      - "../peripherals/V002_V006_TIM2.yaml"
    include_dma_channels:
      DMA1: "../dma/CH32V00X.yaml"
    include_interrupts: "../interrupts/CH32V00X.yaml"
