    - { name: c192_r128, code: 192K, ram: 128K }
    - { name: c224_r96, code: 224K, ram: 96K }
    - { name: c256_r64, code: 256K, ram: 64K }
    - { name: c288_r32, code: 288K, ram: 32K }
