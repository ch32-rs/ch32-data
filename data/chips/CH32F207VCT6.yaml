name: CH32F207VCT6
family: ARM Cortex-M-based, general-purpose MCU
subfamily: Interconnectivity (USB high-speed, CAN, Ethernet, DVP, SDIO, FSMC)
product_type: Cortex-M3 core, main frequency <= 144M
keywords:
  - USBFS
  - USBHS
  - CAN
  - DAC
  - RNG
  - SDIO
  - I2S
  - ETH
  - DVP
  - FSMC
packages:
