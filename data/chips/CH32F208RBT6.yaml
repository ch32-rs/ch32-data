name: CH32F208RBT6
family: ARM Cortex-M-based, general-purpose MCU
subfamily: Wireless (BLE5.X, CAN, USB, Ethernet)
product_type: Cortex-M3 core, main frequency <= 144M
keywords:
  - BLE
  - USBD
  - USBFS
  - CAN
  - ETH
packages:
  - name: CH32F208RBT6
    package: LQFP64M
    device_id: 0x2081040C
include_memory: ../memory/CH32V2_RC.yaml
# OB SRAM_CODE_MODE: 00x=128K/64K (default), 01x=144K/48K, 1xx=160K/32K
memory_ram_code_config:
  total_flash: 480K
  default: c128_r64
  configs:
    - { name: c128_r64, code: 128K, ram: 64K }
    - { name: c144_r48, code: 144K, ram: 48K }
    - { name: c160_r32, code: 160K, ram: 32K }
docs:
