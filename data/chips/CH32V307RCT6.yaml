      - "../peripherals/FV2x_V3x_CAN2.yaml"
      - "../peripherals/FV3x_ETH.yaml"

    include_interrupts: "../interrupts/CH32V3.yaml"
    include_dma_channels:
      DMA1: "../dma/CH32V_V4F_DMA1.yaml"
      DMA2: "../dma/CH32V_V4F_DMA2.yaml"

