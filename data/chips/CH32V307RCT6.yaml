name: CH32V307RCT6
family: QingKe RISC-V-based, general-purpose MCU
subfamily: Interconnectivity (USB high-speed, CAN, Ethernet, DVP, SDIO, FSMC)
product_type: QingKe V4F floating-point core, main frequency <= 144M
device_id: 812713224
keywords:
  - USBHS
  - CAN
  - SDIO
  - ETH
  - I2S
packages:
  - name: CH32V307RCT6
    package: LQFP64M
include_memory: ../memory/CH32V3_RC.yaml
memory_ram_code_config:
  total_flash: 480K
  default: c256_r64
  configs:
    - { name: c192_r128, code: 192K, ram: 128K }
    - { name: c224_r96, code: 224K, ram: 96K }
    - { name: c256_r64, code: 256K, ram: 64K }
    - { name: c128_r192, code: 128K, ram: 192K }
    - { name: c288_r32, code: 288K, ram: 32K }
docs:
  - type: homepage
    title: Homepage
    name: ""
    url: http://www.wch.cn/products/CH32V307.html
cores:
  - name: qingke-v4f
    peripherals:
      - name: RCC
        address: 0x40021000
        registers:
          kind: rcc
          version: v3_d8c
          block: RCC
        pins:
          - pin: PA8
            signal: MCO
    include_peripherals:
      - "../family/CH32V3.yaml"
      - "../peripherals/FV2x_V3x_USART1.yaml"
