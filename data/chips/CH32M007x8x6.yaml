name: CH32M007
family: Low price, motor control MCU
subfamily: General-purpose
product_type: QingKe V2/V4 core, great value version, main frequency <= 48M
# Note: the 0x007 family is shared with CH32V007. Only G8R6 is currently known
# to wlink; E8R6/E8U7/K8U7 per-package device IDs are not yet documented upstream.
packages:
  - name: CH32M007E8R6
    package: QSOP24
    device_id: 0x0
  - name: CH32M007E8U7
    package: QFN26C3
    device_id: 0x0
  - name: CH32M007G8R6
    package: QSOP28
    device_id: 0x00700800
  - name: CH32M007K8U7
    package: QFN32
    device_id: 0x0
include_memory: ../memory/CH32V00X.yaml
memory_sizes: { USR_1: 62K, RAM: 8K }
docs:
  - type: homepage
    title: Homepage
    name: "CH32M007"
    url: https://www.wch-ic.com/products/CH32M007.html
cores:
  - name: qingke-v2c
    arch: riscv
    peripherals: []
    include_peripherals:
      - "../family/CH32V00X.yaml"
      - "../peripherals/V007_M007_TIM2.yaml"
      - "../peripherals/V00X_OPA.yaml"
    include_dma_channels:
      DMA1: "../dma/CH32V00X.yaml"
    include_interrupts: "../interrupts/CH32V00X.yaml"
