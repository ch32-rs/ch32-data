name: CH32M007
family: Low price, motor control MCU
subfamily: General-purpose
product_type: QingKe V2/V4 core, great value version, main frequency <= 48M
# Note: the 0x007 family is shared with CH32V007.
# TODO: wlink only lists G8R6. E8R6 and E8U6 device IDs verified against
# openwch/ch32v002_004_005_006_007 EVT (ch32v00X_dbgmcu.c + ch32v00X_gpio.c);
# update wlink. K8U7 is not in openwch's list — device_id remains unknown.
packages:
  - name: CH32M007E8R6
    package: QSOP24
    device_id: 0x00730800
  # Package name corrected from E8U7 to E8U6 per openwch (both dbgmcu.c comment
  # and gpio.c runtime switch confirm 0x00740800 is CH32M007E8U6).
  - name: CH32M007E8U6
    package: QFN26C3
    device_id: 0x00740800
  - name: CH32M007G8R6
    package: QSOP28
    device_id: 0x00700800
  - name: CH32M007K8U7
    package: QFN32
    device_id: 0x0
include_memory: ../memory/CH32V00X.yaml
memory_sizes: { USR_1: 62K, RAM: 8K }
docs:
  - type: homepage
    title: Homepage
    name: "CH32M007"
    url: https://www.wch-ic.com/products/CH32M007.html
cores:
  - name: qingke-v2c
    arch: riscv
    peripherals: []
    include_peripherals:
      - "../family/CH32V00X.yaml"
      - "../peripherals/V007_M007_TIM2.yaml"
      - "../peripherals/V00X_OPA.yaml"
    include_dma_channels:
      DMA1: "../dma/CH32V00X.yaml"
    include_interrupts: "../interrupts/CH32V00X.yaml"
