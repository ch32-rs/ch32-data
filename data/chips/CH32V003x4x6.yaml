    arch: riscv
    peripherals: []
    include_peripherals:
      - "../family/CH32V003.yaml"
    include_dma_channels:
      DMA1: "../dma/CH32V003.yaml"
    include_interrupts: "../interrupts/CH32V003.yaml"

_raw:
