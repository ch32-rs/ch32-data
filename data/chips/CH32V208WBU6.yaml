name: CH32V208WBU6
family: QingKe RISC-V-based, general-purpose MCU
subfamily: Wireless (BLE5.X, CAN, USB, Ethernet)
product_type: QingKe V4 non-floating-point core, enhanced version, main frequency <= 144M
device_id: 545260812
keywords:
  - GPTM32
  - BLE
packages:
  - name: CH32V208WBU6
    package: QFN68
include_memory: ../memory/CH32V2.yaml
# CODE/RAM split selected by OB SRAM_CODE_MODE (V20x_D8W RM):
#   00x -> 128K code / 64K ram   (power-on default)
#   01x -> 144K code / 48K ram
#   1xx -> 160K code / 32K ram
memory_options:
  c128_r64:
    USR_1: 128K
    RAM: 64K
  c144_r48:
    USR_1: 144K
    RAM: 48K
  c160_r32:
    USR_1: 160K
    RAM: 32K
default_memory_option: c128_r64
docs:
  - type: homepage
    title: Homepage
    name: ""
    url: http://www.wch.cn/products/CH32V208.html
cores:
  - name: qingke-v4c
    peripherals:
    include_peripherals:
      - "../family/CH32V2.yaml"
      - "../peripherals/FV2x_V3x_USART1.yaml"
      - "../peripherals/FV2x_V3x_USART2.yaml"
      - "../peripherals/FV2x_V3x_USART3.yaml"
      - "../peripherals/V2x_USART4.yaml"
      - "../peripherals/V1x_V2x_ADV_TIM1.yaml"
      - "../peripherals/FV2x_V3x_GP16_TIM234.yaml"
      - "../peripherals/FV2x_V3x_GP32_TIM5.yaml"
      - "../peripherals/FV2x_V3x_ADC1.yaml"
      - "../peripherals/FV2x_V3x_SPI1.yaml"
      - "../peripherals/FV2x_V3x_SPI2.yaml"
      - "../peripherals/FV2x_V3x_I2C1.yaml"
      - "../peripherals/FV2x_V3x_I2C2.yaml"
      - "../peripherals/FV2x_V3x_USBD.yaml"
      - "../peripherals/FV2x_V3x_USBFS.yaml"
      - "../peripherals/FV2x_V3x_CAN1.yaml"
      - "../peripherals/FV2x_ETH10.yaml"
      # BLE peripherals — scoped to the bits/offsets exercised by the working
      # ch32-hal BLE examples (advertising TX + scan RX). Remaining offsets are
      # left as u32 placeholders so the block layout stays addressable.
      - "../peripherals/V208_BLE_BB.yaml"
      - "../peripherals/V208_BLE_LLE.yaml"
      - "../peripherals/V208_BLE_RFEND.yaml"
      - "../peripherals/V208_BLE_AES.yaml"

    include_interrupts: "../interrupts/CH32V2_D8.yaml"
    include_dma_channels:
      DMA1: "../dma/CH32V_V4C.yaml"

_raw:
  CAN: "1"
  GPIO: "53"
  SPI: 2/-
  Package: QFN68
  USB_20: D+H/D
  Advanced TM: 1/4
  ADC: 1/16
  Flash: 128K
  SRAM: 64K
  BLE: "5.3"
  Touchkey: "16"
  UART: "4"
  Freq: 144MHz
  OPA: "2"
  RTC: "1"
  Ethernet: 10M
  IIC: "2"
  WDOG: "2"
  Part NO.: CH32V208WBU6
  VDD: 2.5/3.3
  url: http://www.wch.cn/products/CH32V208.html
