# CH32H4 family interrupt table.
# Source: CH32H417 RM V1.7 section 4.7.5 (PFIC vector table).
# Vector index column is the second column of the RM table (subtracted by 4
# from the absolute vector number so #16 == IPC_CH0 -> index 0 etc.).
# The "core-private" first 16 vectors (NMI, EXC, SysTick, etc.) live in
# qingke-rt and are not part of this map.

# Vectors 0-15 are core interrupts (NMI / Exception / SysTick0 @ 12 /
# SysTick1 @ 13 / SW @ 14) handled by qingke-rt, not listed here.
# Note: classic Qingke layout only had a single SysTick at 12; the
# CH32H4 dual-core SysTick adds SysTick1 at 13 — qingke-rt support
# for that will land separately.

# --- 16..28: Inter-core ---
IPC_CH0: 16
IPC_CH1: 17
IPC_CH2: 18
IPC_CH3: 19
HSEM: 28

# --- 32..148: External interrupts ---
