# Analog block: RTC, DAC, HSADC (RM ch12), OPA, DFSDM.
# RTC uses LSE/LSI as kernel clock so no HBxPCENR enable bit; it's gated by RCC.BDCTLR.RTCEN.
# OPA and CMP share a single RCC enable bit (OPCMEN); OPA peripheral is exposed here, CMP TBD.
- name: RTC
