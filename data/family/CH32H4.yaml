- name: RCC
  address: 0x40021000
  registers:
    kind: rcc
    version: h4
    block: RCC
  # MCO pin and per-chip clock-source variability handled at chip yaml
  # level when needed.
  interrupts:
    - signal: GLOBAL
      interrupt: RCC

- name: SYSTICK
  address: 0xE000F000
  registers:
    kind: systick
    version: v3f_v5f
    block: SYSTICK
  # Per-counter interrupt routing is configured at runtime via CTLR.CID;
  # SysTick0/SysTick1 are exposed as separate interrupts (SysTick0=12,
  # SysTick1=13). Handled in qingke-rt entry, not wired here.

- name: HSEM
  address: 0xE000C000
  registers:
    kind: hsem
    version: h4
    block: HSEM
  interrupts:
    - signal: GLOBAL
      interrupt: HSEM

- name: IPC
  address: 0xE000D000
  registers:
    kind: ipc
    version: h4
    block: IPC
  interrupts:
    - signal: CH0
      interrupt: IPC_CH0
    - signal: CH1
      interrupt: IPC_CH1
    - signal: CH2
      interrupt: IPC_CH2
    - signal: CH3
      interrupt: IPC_CH3

- name: EXTI
  address: 0x40010400
  registers:
    kind: exti
    version: common
    block: EXTI
  # H4 has 27 EXTI lines (0..26). Lines 0-15 GPIO-routable via AFIO.
  # Lines 16-26 are peripheral wake-up events. Aggregated interrupts:
  #   EXTI0..EXTI4 individual, EXTI7_0 aggregates 0..7, EXTI15_8
  #   aggregates 8..15. Higher EXTI lines route through the matching
  #   peripheral interrupt (e.g. RTCAlarm @ 142, USARTWakeUP @ 148).
  interrupts:
    - signal: EXTI0
      interrupt: EXTI7_0
    - signal: EXTI8
      interrupt: EXTI15_8

- name: WWDG
  address: 0x40002C00
  registers:
    kind: wwdg
    version: common
    block: WWDG
  rcc:
    bus_clock: PCLK1
    kernel_clock: PCLK1
    enable:
      register: HB1PCENR
      field: WWDGEN
    reset:
      register: HB1PRSTR
      field: WWDGRST
  interrupts:
    - signal: GLOBAL
      interrupt: WWDG

- name: IWDG
  address: 0x40003000
  registers:
    kind: iwdg
    version: h4
    block: IWDG
  # No clock enable/reset; IWDG is driven by LSI and is always available.

- name: PWR
  address: 0x40007000
  registers:
    kind: pwr
    version: h4
    block: PWR
  rcc:
    bus_clock: PCLK1
    kernel_clock: PCLK1
    enable:
      register: HB1PCENR
      field: PWREN
    reset:
      register: HB1PRSTR
      field: PWRRST

- name: FLASH
  address: 0x40022000
  registers:
    kind: flash
    version: h4
    block: FLASH
  # No clock enable/reset; FLASH interface clock is always on.
  interrupts:
    - signal: GLOBAL
      interrupt: FLASH

- name: CRC
  address: 0x40023000
  registers:
    kind: crc
    version: h4
    block: CRC
  rcc:
    bus_clock: HCLK
    kernel_clock: HCLK
    enable:
      register: HBPCENR
      field: CRCEN
  # H4 RCC does not expose a CRC reset bit.

- name: ESIG
  address: 0x1FFFF7E0
  registers:
    kind: esig
    version: h4
    block: ESIG
  # System memory; no clock/reset.

