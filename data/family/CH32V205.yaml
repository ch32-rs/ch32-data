- name: PFIC
  address: 0xE000E000
  registers:
    kind: pfic
    version: rv4
    block: PFIC
- name: SYSTICK
  address: 0xE000F000
  registers:
    kind: systick
    version: rv4
    block: SYSTICK
  # SysTick interrupt handling is moved to qingke-rt as it's a core feature
  # interrupts:
  #   - signal: GLOBAL
  #    interrupt: SYSTICK
- name: FLASH
  address: 0x40022000
  registers:
    kind: flash
    version: v3
    block: FLASH
- name: EXTI
  address: 0x40010400
  registers:
    kind: exti
    version: common
    block: EXTI
  interrupts:
    - signal: EXTI0
      interrupt: EXTI0
    - signal: EXTI1
      interrupt: EXTI1
    - signal: EXTI2
      interrupt: EXTI2
    - signal: EXTI3
      interrupt: EXTI3
    - signal: EXTI4
      interrupt: EXTI4
    - signal: EXTI5
      interrupt: EXTI9_5
    - signal: EXTI10
      interrupt: EXTI15_10

- name: RCC
  address: 0x40021000
  registers:
    kind: rcc
    version: v205
    block: RCC
  pins:
    - pin: PA8
      signal: MCO

- name: DMA1
  address: 1073872896 # 0x40020000
  registers:
    kind: dma
    version: v1
    block: DMA
  rcc:
    bus_clock: HCLK
    kernel_clock: HCLK
    enable:
      register: HBPCENR
      field: DMAEN
  interrupts:
    - signal: CH1
      interrupt: DMA1_Channel1
    - signal: CH2
      interrupt: DMA1_Channel2
    - signal: CH3
      interrupt: DMA1_Channel3
    - signal: CH4
      interrupt: DMA1_Channel4
    - signal: CH5
      interrupt: DMA1_Channel5
    - signal: CH6
      interrupt: DMA1_Channel6
    - signal: CH7
      interrupt: DMA1_Channel7
    - signal: CH8
      interrupt: DMA1_Channel8

- name: GPIOA
  address: 0x40010800
  registers:
    kind: gpio
    version: v3
    block: GPIO
  rcc:
    bus_clock: PCLK2
    kernel_clock: PCLK2
    enable:
      register: PB2PCENR
      field: IOPAEN
    reset:
      register: PB2PRSTR
      field: IOPARST
- name: GPIOB
  address: 0x40010C00
  registers:
    kind: gpio
    version: v3
    block: GPIO
  rcc:
    bus_clock: PCLK2
    kernel_clock: PCLK2
    enable:
      register: PB2PCENR
      field: IOPBEN
    reset:
      register: PB2PRSTR
      field: IOPBRST
- name: GPIOC
  address: 0x40011000
  registers:
    kind: gpio
    version: v3
    block: GPIO
  rcc:
    bus_clock: PCLK2
    kernel_clock: PCLK2
    enable:
      register: PB2PCENR
      field: IOPCEN
    reset:
      register: PB2PRSTR
      field: IOPCRST
# PD0 to PD2
- name: GPIOD
  address: 0x40011400
  registers:
    kind: gpio
    version: v3
    block: GPIO
  rcc:
    bus_clock: PCLK2
    kernel_clock: PCLK2
    enable:
      register: PB2PCENR
      field: IOPDEN
    reset:
      register: PB2PRSTR
      field: IOPDRST

- name: AFIO
  address: 0x40010000
  registers:
    kind: afio
    version: v3
    block: AFIO
  rcc:
    bus_clock: PCLK2
    kernel_clock: PCLK2
    enable:
      register: PB2PCENR
      field: AFIOEN
    reset:
      register: PB2PRSTR
      field: AFIORST

- name: EXTEND
  address: 0x40023800
  registers:
    kind: extend
    version: v3b
    block: EXTEND

- name: RTC
  address: 0x40002800
  registers:
    kind: rtc
    version: common
    block: RTC

- name: TIM1
  address: 0x40012C00
  registers:
    kind: timer
    version: v3b
    block: ADTM
  rcc:
    bus_clock: PCLK2_TIM
    kernel_clock: PCLK2
    enable:
      register: PB2PCENR
      field: TIM1EN
    reset:
      register: PB2PRSTR
      field: TIM1RST
  interrupts:
    - signal: BRK
      interrupt: TIM1_BRK
    - signal: UP
      interrupt: TIM1_UP
    - signal: TRG
      interrupt: TIM1_TRG_COM
    - signal: COM
      interrupt: TIM1_TRG_COM
    - signal: CC
      interrupt: TIM1_CC
