- name: PFIC
  address: 0xE000E000
  registers:
    kind: pfic
    version: v205
    block: PFIC
- name: SYSTICK
  address: 0xE000F000
  registers:
    kind: systick
    version: rv4
    block: SYSTICK
  # SysTick interrupt handling is moved to qingke-rt as it's a core feature
- name: FLASH
  address: 0x40022000
  registers:
    kind: flash
    version: v205
    block: FLASH
- name: EXTI
  address: 0x40010400
  registers:
    kind: exti
    version: common
    block: EXTI
  interrupts:
    - signal: EXTI0
      interrupt: EXTI0
    - signal: EXTI1
      interrupt: EXTI1
    - signal: EXTI2
      interrupt: EXTI2
    - signal: EXTI3
      interrupt: EXTI3
    - signal: EXTI4
      interrupt: EXTI4
    - signal: EXTI5
      interrupt: EXTI9_5
    - signal: EXTI10
      interrupt: EXTI15_10

- name: RCC
  address: 0x40021000
  registers:
    kind: rcc
    version: v205
    block: RCC
  pins:
    - pin: PA8
      signal: MCO

- name: DMA1
  address: 0x40020000
  registers:
    kind: dma
    version: v205
    block: DMA
  rcc:
    bus_clock: HCLK
    kernel_clock: HCLK
    enable:
      register: HBPCENR
      field: DMAEN
  interrupts:
    - signal: CH1
      interrupt: DMA1_CH1
    - signal: CH2
      interrupt: DMA1_CH2
    - signal: CH3
      interrupt: DMA1_CH3
    - signal: CH4
      interrupt: DMA1_CH4
    - signal: CH5
      interrupt: DMA1_CH5
    - signal: CH6
      interrupt: DMA1_CH6
    - signal: CH7
      interrupt: DMA1_CH7
    - signal: CH8
      interrupt: DMA1_CH8
- name: DMA2
  address: 0x40020400
  registers:
    kind: dma
    version: v205
    block: DMA
  rcc:
    bus_clock: HCLK
    kernel_clock: HCLK
    enable:
      register: HBPCENR
      field: DMAEN
  interrupts:
    - signal: CH1
      interrupt: DMA2_CH1
    - signal: CH2
      interrupt: DMA2_CH2
    - signal: CH3
      interrupt: DMA2_CH3
    - signal: CH4
      interrupt: DMA2_CH4
    - signal: CH5
      interrupt: DMA2_CH5
    - signal: CH6
      interrupt: DMA2_CH6
    - signal: CH7
      interrupt: DMA2_CH7
    - signal: CH8
      interrupt: DMA2_CH8

- name: GPIOA
  address: 0x40010800
  registers:
    kind: gpio
    version: v3
    block: GPIO
  rcc:
    bus_clock: PCLK2
    kernel_clock: PCLK2
    enable:
      register: PB2PCENR
      field: IOPAEN
    reset:
      register: PB2PRSTR
      field: IOPARST
