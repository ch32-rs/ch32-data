# CH32V407/CH32V467, CH32V407RM V1.2 table 11-3 (DMA2 peripheral/channel map).
# DMA2 has 11 channels; DMA1 has 13 (see CH32V_V4X7_DMA1.yaml).
#
# The two DAC units share one register block, so they are the two channels of
# the single DAC1 peripheral: DAC1_CH1 is what the RM calls "DAC1" and
# DAC1_CH2 is its "DAC2".

# channel 1
TIM5_CH4: 1
TIM5_TRIG: 1
TIM8_CH3: 1
TIM8_UP: 1
SPI3_RX: 1

# channel 2
TIM5_CH3: 2
TIM5_UP: 2
TIM8_CH4: 2
TIM8_TRIG: 2
TIM8_COM: 2
SPI3_TX: 2
USART5_RX: 2

# channel 3
TIM6_UP: 3
TIM8_CH1: 3
USART4_RX: 3
DAC1_CH1: 3

# channel 4
TIM5_CH2: 4
TIM7_UP: 4
SDIO: 4
DAC1_CH2: 4

# channel 5
TIM5_CH1: 5
USART4_TX: 5
USART5_TX: 5
TIM8_CH2: 5

# channel 6
USART6_TX: 6

# channel 7
USART6_RX: 7

# channel 8
USART7_TX: 8

# channel 9
USART7_RX: 9

# channel 10
USART8_TX: 10

# channel 11
USART8_RX: 11
