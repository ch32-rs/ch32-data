# DMAMUX request numbers for the CH32H4 family.
#
# Source: CH32H417RM V1.8, 表 10-2 "DMA 复用器输入到资源的分配表" (section 10.2.3).
# The same table covers CH32H415/H416/H417, which share family/CH32H4.yaml.
#
# Unlike the other files in this directory, the number is a DMAMUX request ID,
# not a DMA channel number. Every one of the 16 channels (DMA1_CH1..CH8 and
# DMA2_CH1..CH8) can be routed to any of these requests; ch32-data-gen's
# DMAMUX branch reads this file that way.
#
# Only signals the HAL grows a DMA trait for are listed (usart TX/RX, spi
# TX/RX, i2c TX/RX, timer CH1..CH4/UP/TRIG/COM, dac CH1/CH2, adc, sdio).
# Reserved IDs (105, 106, 109, 110, 116-119) and peripherals without a DMA
# trait (I3C, SWPMI, QSPI, DFSDM, SAI) are omitted.
#
# The key is split on the first '_' and the prefix must be the peripheral's
# name: the manual calls the two DAC triggers DAC1/DAC2, but the peripheral
# is `DAC`, so those are DAC_CH1/DAC_CH2 here (requests 103/104).

# TIM1
TIM1_CH1: 1
TIM1_CH2: 2
TIM1_CH3: 3
TIM1_CH4: 4
TIM1_UP: 5
TIM1_COM: 6
TIM1_TRIG: 7

# TIM2
