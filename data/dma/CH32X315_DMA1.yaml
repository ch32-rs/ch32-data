# CH32X315 / CH32X305, CH32X315RM V1.2 §11.2.4 (DMA1 peripheral/channel map).
# DMA1 has 11 channels; there is no DMA2.
#
# Signals with a "_0"/"_1" suffix in the RM can be moved between the two
# channels with EXTEN_CTR; this file records the default (_0) mapping.
#
# channel 1
TIM2_CH3: 1
TIM4_CH1: 1
ADC1: 1

# channel 2
SPI1_RX: 2
USART3_TX: 2
TIM1_CH1: 2
TIM2_UP: 2
TIM3_CH3: 2

# channel 3
