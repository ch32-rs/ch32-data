memory:
- name: USR_1
  kind: flash
  address: 0x8000000
  size: 64K
  modes:
  - type: fast
    page_size: 128
    load_size: 4
  - type: standard
    erase_size: 128
    write_size: 2
  access:
    read: true
    write: true
    execute: true
- name: VND
  kind: flash
  address: 0x1ffff380
  size: 128
  access:
    read: true
    write: false
    execute: false
  structs:
  - name: ESIG
    offset: 32
    kind: esig
    version: common
    block: ESIG
- name: OPT
  kind: flash
  address: 0x1ffff300
  size: 128
  modes:
  - type: standard
    erase_size: 128
    write_size: 2
  access:
    read: true
    write: true
    execute: false
  structs:
  - name: OB
    offset: 0
    kind: ob
    version: m030
    block: OB
    defaults:
      RDPR: 165
      NRDPR: 90
      USER: 191
      NUSER: 64
- name: RAM
  kind: ram
  address: 0x20000000
  access:
    read: true
    write: true
    execute: true
