memory:
  - name: USR_1
    kind: flash
    address: 0x08000000
    modes:
      - type: fast
        page_size: 256
        load_size: 4
    access:
      read: true
      write: true
      execute: true
  - name: SYS_1
    kind: flash
    address: 0x1FFF0000
    size: 3328
    modes:
      - type: fast
        page_size: 256
        load_size: 4
    access:
      read: true
      write: true
      execute: true
  - name: OPT
    kind: flash
    address: 0x1FFFF800
    size: 256
    modes:
      - type: fast
        page_size: 256
        load_size: 4
    access:
      read: true
      write: true
      execute: false
    structs:
      - name: OB
        offset: 0
        kind: ob
        version: l1
        block: OB
        defaults:
          RDPR: 0xA5
          NRDPR: 0x5A
          USER: 0xFF
          NUSER: 0x00
  - name: VND
    kind: flash
    address: 0x1FFFF700
    size: 256
    access:
      read: true
      write: false
      execute: false
    structs:
      - name: ESIG
        offset: 0xE0
        kind: esig
        version: common
        block: ESIG
  - name: RAM
    kind: ram
    address: 0x20000000
    access:
      read: true
      write: true
      execute: true
