include_memory: CH32V2_V3.yaml
memory:
  - name: USR_2
    kind: flash
    address: 0x08010000
    size: 160K
    modes:
      - type: fast
        page_size: 256
        load_size: 4
      - type: standard
        erase_size: 4K
        write_size: 2
    access:
      read: true
      write: true
      execute: true
  - name: OPT
    kind: flash
    address: 0x1FFFF800
    size: 128
    modes:
      - type: standard
        erase_size: 128
        write_size: 2
    access:
      read: true
      write: true
      execute: false
    structs:
      - name: OB
        offset: 0
        kind: ob
        version: v2_v3
        block: OB
        defaults:
          RDPR: 0xA5
          NRDPR: 0x5A
          USER: 0x3F
          NUSER: 0xC0
