memory:
  - name: USR_1
    kind: flash
    address: 0x08000000
    modes:
      - type: fast
        page_size: 64
        load_size: 4
      - type: standard
        erase_size: 1K
        write_size: 2
    access:
      read: true
      write: true
      execute: true
  - name: SYS_1
    kind: flash
    address: 0x1FFFF000
    size: 1920
    modes:
      - type: fast
        page_size: 64
        load_size: 4
      - type: standard
        erase_size: 1K
        write_size: 2
    access:
      read: true
      write: true
      execute: true
  - name: OPT
    kind: flash
    address: 0x1FFFF800
    size: 64
    modes:
      - type: standard
        erase_size: 64
        write_size: 2
    access:
      read: true
      write: true
      execute: false
    structs:
      - name: OB
        offset: 0
        kind: ob
        version: v003
        block: OB
        defaults:
          RDPR: 0xA5
          NRDPR: 0x5A
          USER: 0xF7
          NUSER: 0x08
  - name: VND
    kind: flash
    address: 0x1FFFF7C0
    size: 64
    access:
      read: true
      write: false
      execute: false
    structs:
      - name: ESIG
        offset: 0x20
        kind: esig
        version: common
        block: ESIG
  - name: RAM
    kind: ram
    address: 0x20000000
    access:
      read: true
      write: true
      execute: true
