memory:
  - name: USR_1
    kind: flash
    address: 0x08000000
    modes:
      - type: fast
        page_size: 128
        load_size: 16
      - type: standard
        erase_size: 1K
        write_size: 2
    access:
      read: true
      write: true
      execute: true
  - name: SYS_1
    kind: flash
    address: 0x1FFFF000
    size: 2K
    modes:
      - type: fast
        page_size: 128
        load_size: 16
      - type: standard
        erase_size: 1K
        write_size: 2
    access:
      read: true
      write: true
      execute: true
  - name: OPT
    kind: flash
    address: 0x1FFFF800
    size: 128
    modes:
      - type: standard
        erase_size: 128
        write_size: 2
    access:
      read: true
      write: true
      execute: false
  - name: VND
    kind: flash
    address: 0x1FFFF880
    size: 128
    access:
      read: true
      write: false
      execute: false
  - name: SYS_2
    kind: flash
    address: 0x1FFFF900
    size: 1792
    modes:
      - type: fast
        page_size: 128
        load_size: 16
      - type: standard
        erase_size: 1K
        write_size: 2
    access:
      read: true
      write: true
      execute: true
  - name: RAM
    kind: ram
    address: 0x20000000
    access:
      read: true
      write: true
      execute: true
