[package]
name = "ch32-metapac-gen"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
default-run = "ch32-metapac-gen"


[dependencies]
regex = "1.7.1"
chiptool = { git = "https://github.com/ch32-rs/chiptool", rev = "e8902440a6eee471a9b14b38ee1cd2e526d2c495" }
serde = { version = "1.0.157", features = ["derive"] }
serde_json = "1.0.94"
proc-macro2 = "1.0.52"
ch32-data-macros = { version = "0.1.0", path = "../ch32-data-macros" }
